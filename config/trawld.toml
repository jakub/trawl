# Standalone starter for trawld and trawl-web. See config/README.md.
# Required: two database URLs, a writable data directory, a persistent
# browser-session key, and the browser's HTTPS origin. Configure a trusted
# API certificate for permanent use. Setup: https://trawl.sh/operate/deployment/
# For a disposable local trial: https://trawl.sh/getting-started/first-query/
# Optional settings: config/trawld.reference.toml and
# https://trawl.sh/reference/configuration/

[server]
# HTTPS API for CLI queries, collectors, and the browser proxy.
http_addr = "127.0.0.1:5514"
# Without both paths, trawld generates a self-signed localhost certificate.
# tls_cert_path = "/etc/trawl/cert.pem"
# tls_key_path = "/etc/trawl/key.pem"

[data]
path = "~/.trawl/data"

[auth]
# Required: FLEET_DATABASE_URL, or uncomment database_url below.
# Provision the Fleet schema with fleet-admin before starting trawld.
# database_url = "postgres://fleet:PASSWORD@db.example.com:5432/fleet"

[storage]
# Required: TRAWL_DATABASE_URL, or uncomment database_url below.
# Use a separate Trawl database; trawld initializes its schema at startup.
# database_url = "postgres://trawl:PASSWORD@db.example.com:5432/trawl"

[web]
# Browser proxy: put an HTTPS reverse proxy in front for remote access.
bind_addr = "127.0.0.1:8090"
upstream_url = "https://localhost:5514"
# Required: replace with the exact origin shown by your browser.
public_origins = ["https://trawl.example.com"]
# Required: create a private file containing 32 random bytes before startup.
cookie_secret_path = "~/.trawl/web.cookie"
allow_insecure_cookies = false

# trawl drop-in: docker container logs
#
# collects from all containers via the docker socket. automatically captures
# portainer, watchtower, and any other containerized service.
#
# service name priority: compose service label > swarm service label >
# container name > image name. swarm labels avoid the cardinality explosion
# from task IDs in container names (e.g. uptime-kuma_uptime-kuma.1.abc123).
# A name trawld refuses gives "docker-unidentified"; the compose and swarm
# service labels stay on the event as docker_compose_service and
# docker_swarm_service, beside container_name and image.
#
# retries socket connection if docker is not installed or not running —
# safe to deploy on non-docker hosts.
#
# requires: vector user in docker group

# =============================================================================
# SOURCE
# =============================================================================

# first start: Vector 0.57 docker_logs collects from collector start. It keeps
# no persisted cursor and has no since_now setting, so lines a container wrote
# while Vector was down are not collected.

[sources.docker]
type = "docker_logs"

# =============================================================================
# TRANSFORMS
# =============================================================================

[transforms.trawl_docker]
type = "remap"
inputs = ["docker"]
source = '''
# --- service name: best available identifier ---
# The gate is trawld's service rule (trawl_config::is_valid_service_name):
# 1 to 128 bytes of [A-Za-z0-9._-], not starting with a dot (ADR-0053).
gate = r'^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$'
# priority: compose label > swarm label > container name > image name
compose_svc = to_string(.label."com.docker.compose.service") ?? ""
swarm_svc = to_string(.label."com.docker.swarm.service.name") ?? ""
container = to_string(.container_name) ?? ""
image = to_string(.image) ?? ""
service = ""

if compose_svc != "" {
  service = compose_svc
} else if swarm_svc != "" {
  # swarm format: {stack}_{service} — normalize to hyphenated name
  service = replace(swarm_svc, "_", "-")
} else if container != "" {
  # strip leading / from container name (docker API includes it)
  clean = replace(container, r'^/', "")
  # strip swarm task suffix: name.{node/replica}.{task_id} → name
  # matches the .{25-char-alphanumeric}.{25-char-alphanumeric} tail
  swarm_match, err = parse_regex(clean, r'^(?P<base>.+)\.[a-z0-9]{25}\.[a-z0-9]{25}$')
  if err == null {
    # base may be {stack}_{service}.{replica} or {stack}_{service}
    base = string!(swarm_match.base)
    # strip trailing .{digit} replica number if present
    base = replace(base, r'\.\d+$', "")
    # normalize {stack}_{service} to hyphenated name
    service = replace(base, "_", "-")
  } else {
    service = clean
  }
} else if image != "" {
  # image reference: [registry[:port]/]path/name[:tag][@digest]. Drop the
  # digest, keep the last path component, then drop the tag:
  # registry.example:5000/org/redis:7 → redis
  name = replace(image, r'(?s)@.*', "")
  name = replace(name, r'(?s)^.*/', "")
  service = replace(name, r'(?s):.*', "")
}
# the priority stays: a name trawld refuses is marked, not passed down to the
# next identifier; the labels, container_name and image keep the originals
if !match(service, gate) {
  service = "docker-unidentified"
}
.service = service

# --- host: compose project, swarm stack, or container name ---
compose_project = to_string(.label."com.docker.compose.project") ?? ""
if compose_project != "" {
  .host = compose_project
} else if swarm_svc != "" {
  # swarm: use stack name (part before _) as host for grouping
  swarm_parts_host = split(swarm_svc, "_", limit: 2)
  .host = swarm_parts_host[0]
} else if container != "" {
  clean_host = replace(container, r'^/', "")
  # for swarm containers, use stack name as host
  host_swarm_match, err = parse_regex(clean_host, r'^(?P<base>.+)\.[a-z0-9]{25}\.[a-z0-9]{25}$')
  if err == null {
    host_base = replace(string!(host_swarm_match.base), r'\.\d+$', "")
    host_parts = split(host_base, "_", limit: 2)
    .host = host_parts[0]
  } else {
    .host = clean_host
  }
}

# --- log level ---
# stderr → error, otherwise try to detect from message content
stream = to_string(.stream) ?? ""
if stream == "stderr" {
  .severity_text = "error"
} else {
  msg = downcase(to_string(.message) ?? "")
  if match(msg, r'\b(?:error|fatal|panic|crit)\b') {
    .severity_text = "error"
  } else if match(msg, r'\b(?:warn|warning)\b') {
    .severity_text = "warn"
  } else if match(msg, r'\b(?:debug|trace)\b') {
    .severity_text = "debug"
  } else {
    .severity_text = "info"
  }
}

# --- preserve useful docker metadata as extra fields ---
.container_name = replace(container, r'^/', "")
.container_id = to_string(.container_id) ?? null
.image = image
if compose_svc != "" { .docker_compose_service = compose_svc }
if swarm_svc != "" { .docker_swarm_service = swarm_svc }

# clean up docker-internal fields
del(.label)
del(.stream)
del(.container_created_at)
.env = "${TRAWL_ENV:-prod}"
del(.source_type)
'''

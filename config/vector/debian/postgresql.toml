# trawl drop-in: postgresql logs (multiline-aware)
#
# idles silently if postgresql is not installed.

# =============================================================================
# SOURCE
# =============================================================================

[sources.postgresql]
type = "file"
include = ["/var/log/postgresql/*.log"]
read_from = "end"

[sources.postgresql.multiline]
start_pattern = '^\d{4}-\d{2}-\d{2}'
condition_pattern = '^\d{4}-\d{2}-\d{2}'
mode = "halt_before"
timeout_ms = 1000

# =============================================================================
# TRANSFORMS
# =============================================================================

[transforms.trawl_postgresql]
type = "remap"
inputs = ["postgresql"]
source = '''
# postgresql log format:
#   2024-01-15 10:30:45.123 UTC [12345] user@db LOG:  statement: SELECT ...
#   2024-01-15 10:30:45.123 UTC [12345] LOG:  autovacuum launcher started
parsed, err = parse_regex(
  .message,
  r'^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+) (?P<tz>[A-Za-z]+|[+-]\d{2}(?:\d{2})?) \[(?P<pid>\d+)\] (?:(?P<user>\w+)@(?P<db>\w+) )?(?P<level>\w+):\s+(?P<msg>.*)'
)
if err == null {
  # The line's own time, not the time Vector read it. PostgreSQL stamps the
  # log_timezone abbreviation. UTC and GMT are exact, and so are the numeric
  # names, such as -03 or +0545, of zones without one. Other names, such as
  # EDT or CEST, name no fixed offset: read the time in the collector's zone
  # (TZ, else the host's zone, which initdb copies into log_timezone) and keep
  # it only if that zone has the line's abbreviation at that instant. An
  # abbreviation that two zones share, such as CST, cannot be told apart.
  # Otherwise, or if the timestamp does not parse, such as in the hour a
  # change from summer time repeats, keep the read time. Set
  # log_timezone = 'UTC' for exact times.
  time = null
  tz = string!(parsed.tz)
  if tz == "UTC" || tz == "GMT" {
    time = parse_timestamp(parsed.ts, "%Y-%m-%d %H:%M:%S%.f", timezone: "UTC") ?? null
  } else if starts_with(tz, "+") || starts_with(tz, "-") {
    time = parse_timestamp(string!(parsed.ts) + " " + tz, "%Y-%m-%d %H:%M:%S%.f %#z") ?? null
  } else {
    zone = get_env_var("TZ") ?? get_timezone_name() ?? ""
    if starts_with(zone, ":") {
      zone = slice!(zone, 1)
    }
    local, local_err = parse_timestamp(parsed.ts, "%Y-%m-%d %H:%M:%S%.f", timezone: zone)
    if local_err == null && (format_timestamp(local, "%Z", timezone: zone) ?? null) == tz {
      time = local
    }
  }
  if time != null {
    ._time = time
  }

  .message = parsed.msg

  if parsed.user != null {
    .user_name = parsed.user
  }

  lvl = upcase(to_string(parsed.level))
  if lvl == "ERROR" || lvl == "FATAL" || lvl == "PANIC" {
    .severity_text = "error"
  } else if lvl == "WARNING" {
    .severity_text = "warn"
  } else if lvl == "DEBUG" || starts_with(lvl, "DEBUG") {
    .severity_text = "debug"
  } else {
    # LOG, NOTICE, STATEMENT, DETAIL, HINT, CONTEXT
    .severity_text = "info"
  }
} else {
  .severity_text = "info"
}

.service = "postgresql"
.env = "${TRAWL_ENV:-prod}"
del(.source_type)
del(.file)
'''

# trawl drop-in: fail2ban structured parsing
#
# extracts jail, action (Ban/Unban/Found), and source IP for queries like:
#   service=fail2ban action=Ban | stats count() by src_ip
#
# idles silently if fail2ban is not installed.

# =============================================================================
# SOURCE
# =============================================================================

[sources.fail2ban]
type = "file"
include = ["/var/log/fail2ban.log"]
read_from = "end"

# =============================================================================
# TRANSFORMS
# =============================================================================

[transforms.trawl_fail2ban]
type = "remap"
inputs = ["fail2ban"]
source = '''
# fail2ban log format:
#   2024-01-15 10:30:45,123 fail2ban.actions [12345]: NOTICE [sshd] Ban 192.168.1.100
#   2024-01-15 10:30:45,123 fail2ban.filter  [12345]: INFO   [sshd] Found 192.168.1.100
parsed, err = parse_regex(
  .message,
  r'^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}),\d+\s+fail2ban\.\w+\s*\[\d+\]:\s*(?P<level>\w+)\s+\[(?P<jail>[^\]]+)\]\s+(?P<action>\w+)\s+(?P<ip>\S+)'
)
if err == null {
  .jail = parsed.jail
  .action = parsed.action
  .src_ip = parsed.ip

  lvl = upcase(to_string(parsed.level))
  if lvl == "ERROR" || lvl == "CRITICAL" {
    .severity_text = "error"
  } else if lvl == "WARNING" || lvl == "NOTICE" {
    .severity_text = "warn"
  } else if lvl == "DEBUG" {
    .severity_text = "debug"
  } else {
    .severity_text = "info"
  }
} else {
  # fallback: still capture lines that don't match the structured format
  msg = downcase(to_string(.message) ?? "")
  if match(msg, r'\b(?:error|critical)\b') {
    .severity_text = "error"
  } else if match(msg, r'\b(?:warn|warning|notice)\b') {
    .severity_text = "warn"
  } else {
    .severity_text = "info"
  }
}

.service = "fail2ban"
.env = "${TRAWL_ENV:-prod}"
del(.source_type)
del(.file)
'''

# trawl drop-in: apache2 access + error logs
#
# idles silently if apache2 is not installed.

# =============================================================================
# SOURCE
# =============================================================================

[sources.apache]
type = "file"
include = ["/var/log/apache2/*.log"]
read_from = "end"

# =============================================================================
# TRANSFORMS
# =============================================================================

# -- route by filename: access vs error ---------------------------------------

[transforms.route_apache]
type = "route"
inputs = ["apache"]

[transforms.route_apache.route]
access = '.file != null && contains(to_string!(.file), "access")'
error = '.file != null && contains(to_string!(.file), "error")'

# -- apache access logs (combined format) -------------------------------------

[transforms.trawl_apache_access]
type = "remap"
inputs = ["route_apache.access", "route_apache._unmatched"]
source = '''
parsed, err = parse_apache_log(.message, "combined")
if err == null {
  ._time = parsed.timestamp
  .src_ip = parsed.host
  .method = parsed.method
  .uri = parsed.path
  .status = to_int(parsed.status) ?? null
  .message = .message

  user = to_string(parsed.identity) ?? "-"
  if user != "-" {
    .user_name = user
  }

  status = to_int(parsed.status) ?? 0
  if status >= 500 {
    .severity_text = "error"
  } else if status >= 400 {
    .severity_text = "warn"
  } else {
    .severity_text = "info"
  }
} else {
  .severity_text = "info"
}

.service = "apache"
.env = "${TRAWL_ENV:-prod}"
del(.source_type)
del(.file)
'''

# -- apache error logs --------------------------------------------------------

[transforms.trawl_apache_error]
type = "remap"
inputs = ["route_apache.error"]
source = '''
# apache error format: [day_of_week month day time.usec year] [module:level] [pid PID:tid TID] [client IP:PORT] MSG
parsed, err = parse_regex(
  .message,
  r'^\[[^\]]+\] \[\S+:(?P<level>\w+)\] \[pid \d+(?::tid \d+)?\](?:\s+\[client (?P<client>[^\]]+)\])?\s*(?P<msg>.*)'
)
if err == null {
  .message = parsed.msg

  if parsed.client != null {
    # strip port from client IP
    client_parts = split(to_string(parsed.client), ":")
    .src_ip = client_parts[0]
  }

  lvl = downcase(to_string(parsed.level))
  if lvl == "emerg" || lvl == "alert" || lvl == "crit" || lvl == "error" {
    .severity_text = "error"
  } else if lvl == "warn" {
    .severity_text = "warn"
  } else if lvl == "notice" || lvl == "info" {
    .severity_text = "info"
  } else {
    .severity_text = "debug"
  }
} else {
  .severity_text = "error"
}

.service = "apache"
.env = "${TRAWL_ENV:-prod}"
del(.source_type)
del(.file)
'''

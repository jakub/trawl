# trawl log forwarder — debian 13 (trixie) base config
#
# deployment (getting-started/vector-integration in the Trawl docs):
#   1. install the tested vector and hold it:
#      apt-get install vector=0.57.0-1 && apt-mark hold vector
#      (Vector 0.58 removed `vector config`, which the guide's sample capture uses)
#   2. deploy configs to /etc/vector/vector.d/ (base.toml + service drop-ins).
#      The trawl-server package installs them under
#      /usr/share/doc/trawl-server/examples/vector/
#   3. set env vars in /etc/vector/trawl.env (root:root 0600), loaded by the
#      drop-in /etc/systemd/system/vector.service.d/trawl.conf:
#        [Service]
#        EnvironmentFile=/etc/vector/trawl.env
#      Do not edit /etc/default/vector: it is a dpkg conffile, and an edit
#      there stops unattended upgrades at a conffile prompt.
#      VECTOR_CONFIG_DIR=/etc/vector/vector.d
#      TRAWL_URL=https://trawl.internal:5514
#      TRAWL_INGEST_TOKEN=<token>
#      TRAWL_ENV=prod
#      (TRAWL_ENV must be listed in trawld's [ingest] envs; trawld rejects any
#      other env. The templates send "prod" when TRAWL_ENV is unset.)
#      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
#      (Vector 0.57 and later do not expand environment variables in config files unless
#      this is set or vector runs with --dangerously-allow-env-var-interpolation)
#   4. against the selected Fleet database, create trawl-ingest with trawl:ingest,
#      then: fleet-admin keys create --name vector --kind service --role trawl-ingest
#      fleet-admin reads DATABASE_URL; prefer a separate key per collector fleet
#   5. use a server certificate valid for the TRAWL_URL hostname. For a private
#      CA, install its PEM certificate and set ca_file in sinks.trawld.tls below.
#   6. start: systemctl enable --now vector
#
# permissions (ansible should handle):
#   - vector user in: systemd-journal, adm
#   - for docker.toml: vector user in docker group
#   - for app-specific logs: add to www-data, postgres, mysql, redis as needed
#
# Deploy only the service drop-ins this host needs. Account for their
# permissions, listening sockets, and retries when a dependency is unavailable.

# =============================================================================
# GLOBAL
# =============================================================================

data_dir = "/var/lib/vector"

[acknowledgements]
enabled = true

# =============================================================================
# SOURCES
# =============================================================================

# -- journald: all systemd units, current boot only ---------------------------
# captures: sshd, cron, tailscale, cockpit, ufw (via kernel), and every other
# systemd-managed service. no unit filtering — collect everything.

[sources.journald]
type = "journald"
current_boot_only = true

# -- varlog catch-all: everything not handled by dedicated drop-ins -----------
# anything that writes directly to /var/log and isn't covered by a service-
# specific config (dpkg, apt, unattended-upgrades, misc application logs).
# Excluded application files require their service drop-in; base alone skips them.
# read_from=end collects newly appended lines, not existing file history.
#
# The include is every *.log under /var/log except under /var/log/private,
# which systemd keeps root-only (0700) for DynamicUser services, and
# /var/log/trawl, which trawld.service keeps owner-only (0700). trawld's own
# events reach trawl through its internal telemetry instead. Vector reads
# every directory a `**` pattern reaches before it applies `exclude`, so
# "/var/log/**/*.log" logs "Failed to glob path" for both on every scan. Each
# pattern below names the subdirectories it may enter: [!pt]* is every name
# not starting with "p" or "t", and the rest spell out the "p" and "t" names
# one letter at a time, so no pattern ever matches "private" or "trawl" itself.

[sources.varlog]
type = "file"
include = [
  "/var/log/*.log",
  "/var/log/[!pt]*/**/*.log",
  "/var/log/p/**/*.log",
  "/var/log/p[!r]*/**/*.log",
  "/var/log/pr/**/*.log",
  "/var/log/pr[!i]*/**/*.log",
  "/var/log/pri/**/*.log",
  "/var/log/pri[!v]*/**/*.log",
  "/var/log/priv/**/*.log",
  "/var/log/priv[!a]*/**/*.log",
  "/var/log/priva/**/*.log",
  "/var/log/priva[!t]*/**/*.log",
  "/var/log/privat/**/*.log",
  "/var/log/privat[!e]*/**/*.log",
  "/var/log/private?*/**/*.log",
  "/var/log/t/**/*.log",
  "/var/log/t[!r]*/**/*.log",
  "/var/log/tr/**/*.log",
  "/var/log/tr[!a]*/**/*.log",
  "/var/log/tra/**/*.log",
  "/var/log/tra[!w]*/**/*.log",
  "/var/log/traw/**/*.log",
  "/var/log/traw[!l]*/**/*.log",
  "/var/log/trawl?*/**/*.log",
]
read_from = "end"
exclude = [
  # owner-only directories the include never enters (see the include above)
  "/var/log/private/**",
  "/var/log/trawl/**",

  # rsyslog-managed files (already captured via journald)
  "/var/log/syslog*",
  "/var/log/auth.log*",
  "/var/log/kern.log*",
  "/var/log/daemon.log*",
  "/var/log/user.log*",
  "/var/log/mail.*",
  "/var/log/debug*",
  "/var/log/messages*",

  # app-specific directories (handled by dedicated drop-ins)
  "/var/log/nginx/**",
  "/var/log/apache2/**",
  "/var/log/postgresql/**",
  "/var/log/mysql/**",
  "/var/log/redis/**",

  # fail2ban (handled by drop-in)
  "/var/log/fail2ban.log*",

  # binary files (not text logs)
  "/var/log/btmp*",
  "/var/log/wtmp*",
  "/var/log/lastlog*",
  "/var/log/faillog*",
]

# =============================================================================
# TRANSFORMS
# =============================================================================

# -- journald → trawl schema -------------------------------------------------
# maps systemd journal fields to trawl's expected schema. includes UFW firewall
# log enhancement: kernel messages containing [UFW are parsed for src/dst/proto.

[transforms.journal_enriched]
type = "remap"
inputs = ["journald"]
source = '''
# --- service: the first candidate trawld accepts (ADR-0053) ---
# The gate is trawld's service rule (trawl_config::is_valid_service_name):
# 1 to 128 bytes of [A-Za-z0-9._-], not starting with a dot. VRL has no
# functions, so each transform that derives service keeps its own copy.
gate = r'^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$'
service = ""

# 1. The unit: the user unit unless it is the user manager's own
#    init.scope, else the system unit. One unit-type suffix comes off,
#    then everything from the template "@":
#    postgresql@17-main.service gives postgresql.
unit = to_string(._SYSTEMD_USER_UNIT) ?? ""
if unit == "" || unit == "init.scope" {
  unit = to_string(._SYSTEMD_UNIT) ?? ""
}
unit = replace(unit, r'\.(?:service|scope|slice|socket|target)$', "")
unit = replace(unit, r'(?s)@.*', "")
if match(unit, gate) {
  service = unit
}

# 2. SYSLOG_IDENTIFIER, then 3. _COMM, each without one pair of
#    parentheses around the whole value: "(sd-pam)" gives "sd-pam".
if service == "" {
  identifier = to_string(.SYSLOG_IDENTIFIER) ?? ""
  enclosed, err = parse_regex(identifier, r'^\((?P<inner>.+)\)$')
  if err == null { identifier = string!(enclosed.inner) }
  if match(identifier, gate) { service = identifier }
}
if service == "" {
  comm = to_string(._COMM) ?? ""
  enclosed, err = parse_regex(comm, r'^\((?P<inner>.+)\)$')
  if err == null { comm = string!(enclosed.inner) }
  if match(comm, gate) { service = comm }
}

# Nothing is rewritten, unescaped or truncated. When no candidate passes,
# the fallback is marked, and the originals below tell such events apart.
if service == "" {
  service = "journal-unidentified"
}
.service = service

# --- the journal's identity fields, verbatim, under trawld's own names ---
# Each is kept only when the journal set it. Never name one `unit`: trawld
# folds journald's own UNIT field to that name.
.systemd_unit = del(._SYSTEMD_UNIT)
if .systemd_unit == null || .systemd_unit == "" { del(.systemd_unit) }
.systemd_user_unit = del(._SYSTEMD_USER_UNIT)
if .systemd_user_unit == null || .systemd_user_unit == "" { del(.systemd_user_unit) }
.syslog_identifier = del(.SYSLOG_IDENTIFIER)
if .syslog_identifier == null || .syslog_identifier == "" { del(.syslog_identifier) }
.comm = del(._COMM)
if .comm == null || .comm == "" { del(.comm) }

# --- log level from journal PRIORITY ---
# 0=emerg, 1=alert, 2=crit, 3=error, 4=warn, 5=notice, 6=info, 7=debug
priority = to_int(.PRIORITY) ?? 6
if priority <= 3 {
  .severity_text = "error"
} else if priority == 4 {
  .severity_text = "warn"
} else if priority <= 6 {
  .severity_text = "info"
} else {
  .severity_text = "debug"
}

# --- UFW firewall log enhancement ---
msg = to_string(.message) ?? ""
if contains(msg, "[UFW ") {
  .service = "ufw"

  # extract action for level override
  ufw_action = ""
  action_match, err = parse_regex(msg, r'\[UFW (?P<action>\w+)\]')
  if err == null {
    ufw_action = action_match.action
  }
  if ufw_action == "BLOCK" {
    .severity_text = "warn"
  } else if ufw_action == "ALLOW" {
    .severity_text = "info"
  }

  # extract network fields
  src_match, err = parse_regex(msg, r'SRC=(?P<src_ip>\S+)')
  if err == null { .src_ip = src_match.src_ip }

  dst_match, err = parse_regex(msg, r'DST=(?P<dst_ip>\S+)')
  if err == null { .dst_ip = dst_match.dst_ip }

  spt_match, err = parse_regex(msg, r'SPT=(?P<src_port>\S+)')
  if err == null { .src_port = to_int(spt_match.src_port) ?? null }

  dpt_match, err = parse_regex(msg, r'DPT=(?P<dst_port>\S+)')
  if err == null { .dst_port = to_int(dpt_match.dst_port) ?? null }

  proto_match, err = parse_regex(msg, r'PROTO=(?P<protocol>\S+)')
  if err == null { .protocol = downcase(string!(proto_match.protocol)) }
}

# --- drop internal journal metadata ---
# systemd-prefixed fields are internal identifiers, not useful downstream.
# listed explicitly because VRL closures can't mutate the event. The identity
# fields already moved to their kept names above.
del(.__CURSOR)
del(.__MONOTONIC_TIMESTAMP)
del(.__REALTIME_TIMESTAMP)
del(._BOOT_ID)
del(._CAP_EFFECTIVE)
del(._CMDLINE)
del(._EXE)
del(._GID)
del(._HOSTNAME)
del(._MACHINE_ID)
del(._PID)
del(._RUNTIME_SCOPE)
del(._SELINUX_CONTEXT)
del(._SOURCE_REALTIME_TIMESTAMP)
del(._STREAM_ID)
del(._SYSTEMD_CGROUP)
del(._SYSTEMD_INVOCATION_ID)
del(._SYSTEMD_SLICE)
del(._TRANSPORT)
del(._UID)
del(.PRIORITY)
.env = "${TRAWL_ENV:-prod}"
del(.source_type)
'''

# -- optional homelab noise policy ------------------------------------------
# Default: forward every normalized journal event. To suppress serial-console
# and container-network messages, explicitly set TRAWL_SUPPRESS_HOMELAB_NOISE=true
# in /etc/vector/trawl.env. Review these rules before opting in.

[transforms.trawl_journal]
type = "filter"
inputs = ["journal_enriched"]
condition = '''
if "${TRAWL_SUPPRESS_HOMELAB_NOISE:-false}" != "true" { return true }

unit = to_string(.systemd_unit) ?? ""
svc = to_string(.service) ?? ""
msg = to_string(.message) ?? ""

# drop the ttyS0 serial-getty crash loop (the unit itself + init reporting
# restarts); other serial gettys still arrive
if unit == "serial-getty@ttyS0.service" { return false }
if svc == "init" && contains(msg, "serial-getty") { return false }

# drop docker network churn from networkd/NM/systemd-networkd
if svc == "networkd-dispatcher" || svc == "NetworkManager" || svc == "systemd-networkd" {
  if match(msg, r'(?i)veth|docker[0-9]|br-[0-9a-f]') { return false }
}

true
'''

# -- varlog catch-all → trawl schema -----------------------------------------
# derives service name from the file path. e.g.:
#   /var/log/dpkg.log → "dpkg"
#   /var/log/apt/history.log → "apt"
#   /var/log/unattended-upgrades/unattended-upgrades.log → "unattended-upgrades"
# a name trawld refuses, such as "my app", gives "varlog-unidentified" (ADR-0053)

[transforms.trawl_varlog]
type = "remap"
inputs = ["varlog"]
source = '''
# the gate is trawld's service rule (trawl_config::is_valid_service_name)
gate = r'^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$'
service = ""

# derive service from file path
filepath = to_string(.file) ?? ""
if filepath != "" {
  # strip /var/log/ prefix and .log suffix, take first path component
  stripped = replace(filepath, r'^/var/log/', "")
  parts = split(stripped, "/")
  if length(parts) > 1 {
    # subdirectory: use directory name (e.g. apt/history.log → apt)
    service = string!(parts[0])
  } else {
    # top-level: strip .log extension (e.g. dpkg.log → dpkg)
    service = replace(string!(parts[0]), r'\.log$', "")
  }
}
# a path component trawld refuses is marked; `file` keeps the original
if !match(service, gate) {
  service = "varlog-unidentified"
}
.service = service

# scan message for log level keywords
msg = downcase(to_string(.message) ?? "")
if match(msg, r'\b(?:error|fatal|panic|crit)\b') {
  .severity_text = "error"
} else if match(msg, r'\b(?:warn|warning)\b') {
  .severity_text = "warn"
} else if match(msg, r'\b(?:debug|trace)\b') {
  .severity_text = "debug"
} else {
  .severity_text = "info"
}

.env = "${TRAWL_ENV:-prod}"
del(.source_type)
'''

# =============================================================================
# SINK
# =============================================================================

# -- HTTP sink to trawld ------------------------------------------------------
# Reserve "trawl_*" for final outputs only; intermediate stages must use
# another prefix so they cannot bypass filters or deliver duplicates.
# Wildcard input "trawl_*" automatically discovers all final transforms
# from this config AND any drop-in configs loaded via --config-dir.
# adding a new drop-in requires NO changes to this file.

[sinks.trawld]
type = "http"
inputs = ["trawl_*"]
uri = "${TRAWL_URL}/api/v1/ingest"
method = "post"

[sinks.trawld.encoding]
codec = "json"

[sinks.trawld.auth]
strategy = "bearer"
token = "${TRAWL_INGEST_TOKEN}"

[sinks.trawld.compression]
algorithm = "gzip"

[sinks.trawld.batch]
max_bytes = 1_048_576  # 1 MB
timeout_secs = 5

[sinks.trawld.buffer]
type = "disk"
max_size = 1_073_741_824  # 1 GB — survives trawld downtime

[sinks.trawld.request]
retry_initial_backoff_secs = 1
retry_max_backoff_secs = 30
timeout_secs = 30
concurrency = "adaptive"

[sinks.trawld.tls]
# Trust the system CA store and verify the hostname in TRAWL_URL.
# For a private CA, install its PEM certificate readable by the vector user:
# ca_file = "/etc/vector/trawl-ca.pem"
verify_certificate = true
verify_hostname = true

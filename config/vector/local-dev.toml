# fleet / vector — local dev config for macOS
#
# collects logs from two sources:
#   1. demo_logs: generates realistic fake apache/syslog/json logs
#   2. docker: collects from running containers on this machine
#
# writes ndjson to ./data/logs/ relative to the fleet repo root.
#
# install & run:
#   brew install vector
#   vector --config config/vector/local-dev.toml
#
# query with fleet:
#   cargo run -p fleet-cli -- --data "./data/logs/**/*.ndjson" "*"
#   cargo run -p fleet-cli -- --data "./data/logs/**/*.ndjson" "level:error last:5m"
#   cargo run -p fleet-cli -- --data "./data/logs/**/*.ndjson" "service:flog | stats count() by host"

# ============================================================================
# SOURCES
# ============================================================================

# -- demo logs: fake apache access logs --------------------------------------
# generates ~2 events/sec in apache combined format — enough to have
# something to query immediately without waiting for real traffic.

[sources.demo_apache]
type = "demo_logs"
format = "apache_common"
interval = 0.5  # seconds between events

# -- demo logs: fake syslog --------------------------------------------------

[sources.demo_syslog]
type = "demo_logs"
format = "syslog"
interval = 1.0

# -- demo logs: fake json app logs -------------------------------------------

[sources.demo_json]
type = "demo_logs"
format = "json"
interval = 0.75

# -- docker containers -------------------------------------------------------
# collects from all running containers on this machine

[sources.docker]
type = "docker_logs"

# ============================================================================
# TRANSFORMS
# ============================================================================

[transforms.normalize_apache]
type = "remap"
inputs = ["demo_apache"]
source = '''
parsed, err = parse_apache_log(.message, "common")
if err == null {
  .timestamp = parsed.timestamp
  .src_ip = parsed.host
  .user_name = if to_string(parsed.identity) ?? "-" != "-" { parsed.identity } else { null }
  .status = to_int!(parsed.status)
  .method = parsed.method
  .uri = parsed.path
  .message = .message
  .host = "demo"
  .service = "apache-demo"

  status = to_int!(parsed.status)
  if status >= 500 {
    .level = "error"
  } else if status >= 400 {
    .level = "warn"
  } else {
    .level = "info"
  }
} else {
  .host = "demo"
  .service = "apache-demo"
  .level = "warn"
}

del(.source_type)
'''

[transforms.normalize_syslog]
type = "remap"
inputs = ["demo_syslog"]
source = '''
parsed, err = parse_syslog(.message)
if err == null {
  .timestamp = parsed.timestamp
  .host = parsed.hostname
  .service = parsed.appname
  .message = parsed.message

  sev = to_string(parsed.severity) ?? "info"
  if sev == "emerg" || sev == "alert" || sev == "crit" || sev == "err" {
    .level = "error"
  } else if sev == "warning" {
    .level = "warn"
  } else if sev == "notice" || sev == "info" {
    .level = "info"
  } else {
    .level = "debug"
  }
} else {
  .host = "demo"
  .service = "syslog-demo"
  .level = "info"
}

del(.source_type)
'''

[transforms.normalize_json]
type = "remap"
inputs = ["demo_json"]
source = '''
# demo_logs json format has .message as a JSON string — parse it
msg, err = parse_json(.message)
if err == null {
  .timestamp = msg.datetime
  .host = msg.host
  .service = "app-demo"
  .level = downcase(to_string(msg.level) ?? "info")
  .message = to_string(msg.message) ?? .message
} else {
  .host = "demo"
  .service = "app-demo"
  .level = "info"
}

del(.source_type)
'''

[transforms.normalize_docker]
type = "remap"
inputs = ["docker"]
source = '''
.timestamp = .timestamp
.host = .container_name
.service = split(to_string(.image) ?? "unknown", ":")[0] ?? "unknown"
.level = if .stream == "stderr" { "error" } else { "info" }
.message = .message

del(.container_created_at)
del(.container_id)
del(.container_name)
del(.image)
del(.label)
del(.stream)
del(.source_type)
'''

# ============================================================================
# SINK
# ============================================================================

[sinks.fleet_ndjson]
type = "file"
inputs = [
  "normalize_apache",
  "normalize_syslog",
  "normalize_json",
  "normalize_docker",
]
# writes to ./data/logs/ under the fleet repo root
path = "data/logs/%Y-%m-%d/%H/{{ service }}.ndjson"
encoding.codec = "json"

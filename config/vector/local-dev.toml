# trawl / vector — local dev config for macOS
#
# collects logs from two sources:
#   1. demo_logs: generates realistic fake apache/syslog/json logs
#   2. docker: collects from running containers on this machine
#
# writes ndjson to ./data/logs/ relative to the trawl repo root.
#
# install & run:
#   brew install vector
#   vector --config config/vector/local-dev.toml
#
# query with trawl:
#   cargo run -p trawl-cli -- --data "./data/logs/**/*.ndjson" "*"
#   cargo run -p trawl-cli -- --data "./data/logs/**/*.ndjson" "_severity=error last=5m"
#   cargo run -p trawl-cli -- --data "./data/logs/**/*.ndjson" "service:flog | stats count() by host"

# ============================================================================
# SOURCES
# ============================================================================

# -- demo logs: fake apache access logs --------------------------------------
# generates ~2 events/sec in apache combined format — enough to have
# something to query immediately without waiting for real traffic.

[sources.demo_apache]
type = "demo_logs"
format = "apache_common"
interval = 0.5  # seconds between events

# -- demo logs: fake syslog --------------------------------------------------

[sources.demo_syslog]
type = "demo_logs"
format = "syslog"
interval = 1.0

# -- demo logs: fake json app logs -------------------------------------------

[sources.demo_json]
type = "demo_logs"
format = "json"
interval = 0.75

# -- docker containers -------------------------------------------------------
# collects from all running containers on this machine

[sources.docker]
type = "docker_logs"

# ============================================================================
# TRANSFORMS
# ============================================================================

[transforms.normalize_apache]
type = "remap"
inputs = ["demo_apache"]
source = '''
parsed, err = parse_apache_log(.message, "common")
if err == null {
  ._time = parsed.timestamp
  .src_ip = parsed.host
  identity = to_string(parsed.identity)
  .user_name = if identity != "-" { identity } else { null }
  .status = to_int(parsed.status)
  .method = parsed.method
  .uri = parsed.path
  .message = .message
  .host = "demo"
  .service = "apache-demo"

  status = to_int(parsed.status)
  if status >= 500 {
    .severity_text = "error"
  } else if status >= 400 {
    .severity_text = "warn"
  } else {
    .severity_text = "info"
  }
} else {
  .host = "demo"
  .service = "apache-demo"
  .severity_text = "warn"
}

del(.source_type)
'''

[transforms.normalize_syslog]
type = "remap"
inputs = ["demo_syslog"]
source = '''
parsed, err = parse_syslog(.message)
if err == null {
  ._time = parsed.timestamp
  .host = parsed.hostname
  .service = parsed.appname
  .message = parsed.message

  sev = to_string(parsed.severity)
  if sev == "emerg" || sev == "alert" || sev == "crit" || sev == "err" {
    .severity_text = "error"
  } else if sev == "warning" {
    .severity_text = "warn"
  } else if sev == "notice" || sev == "info" {
    .severity_text = "info"
  } else {
    .severity_text = "debug"
  }
} else {
  .host = "demo"
  .service = "syslog-demo"
  .severity_text = "info"
}

del(.source_type)
'''

[transforms.normalize_json]
type = "remap"
inputs = ["demo_json"]
source = '''
# demo_logs json format has .message as a JSON string — parse it
msg, err = parse_json(.message)
if err == null {
  ._time = msg.datetime
  .host = msg.host
  .service = "app-demo"
  .severity_text = downcase(to_string(msg.level) ?? "info")
  .message = to_string(msg.message) ?? .message
} else {
  .host = "demo"
  .service = "app-demo"
  .severity_text = "info"
}

del(.source_type)
'''

[transforms.normalize_docker]
type = "remap"
inputs = ["docker"]
source = '''
._time = del(.timestamp)
.host = .container_name
.service = split(to_string(.image) ?? "unknown", ":")[0]
.severity_text = if .stream == "stderr" { "error" } else { "info" }
.message = .message

del(.container_created_at)
del(.container_id)
del(.container_name)
del(.image)
del(.label)
del(.stream)
del(.source_type)
'''

# -- envelope: materialize the declared schema ------------------------------
# this config writes ndjson consumed DIRECTLY by embedded-mode queries
# (no trawld ingest canonicalizer in the path), so the declared envelope
# is materialized here: _time/_ingested/_raw/env plus the derived
# `_severity` slot, read off `severity_text` through the OTel token table.
# The source field stays exactly where it is (ADR-0013: derivation
# observes, it never consumes).

[transforms.envelope]
type = "remap"
inputs = [
  "normalize_apache",
  "normalize_syslog",
  "normalize_json",
  "normalize_docker",
]
source = '''
.env = "prod"
if !exists(._time) && exists(.timestamp) { ._time = .timestamp }
if !exists(._time) { ._time = now() }
._ingested = now()
if !exists(._raw) { ._raw = encode_json(.) }

st = downcase(to_string(.severity_text) ?? "")
if st == "error" || st == "err" || st == "e" {
  ._severity = 17
} else if st == "warn" || st == "warning" || st == "w" {
  ._severity = 13
} else if st == "notice" {
  ._severity = 10
} else if st == "info" || st == "i" {
  ._severity = 9
} else if st == "debug" || st == "d" {
  ._severity = 5
} else if st == "trace" || st == "t" {
  ._severity = 1
} else if st == "fatal" || st == "critical" || st == "crit" || st == "f" {
  ._severity = 21
}
'''

# ============================================================================
# SINK
# ============================================================================

[sinks.trawl_ndjson]
type = "file"
inputs = ["envelope"]
# writes to ./data/logs/ under the trawl repo root
path = "data/logs/%Y-%m-%d/%H/{{ service }}.ndjson"
encoding.codec = "json"

# fleet / vector — file tailing (nginx access logs)
#
# tails nginx access logs (combined format), parses structured fields,
# normalizes to the fleet schema, and writes ndjson partitioned by hour.
#
# usage:
#   vector --config config/vector/file.toml
#
# prerequisites:
#   - vector user needs read access to the log files
#   - nginx should use the default combined log format

# -- source: tail nginx access logs ------------------------------------------

[sources.nginx_access]
type = "file"
include = ["/var/log/nginx/access.log"]
read_from = "beginning"

# -- source: tail nginx error logs -------------------------------------------

[sources.nginx_error]
type = "file"
include = ["/var/log/nginx/error.log"]
read_from = "beginning"

# -- transform: parse nginx combined format ----------------------------------

[transforms.parse_access]
type = "remap"
inputs = ["nginx_access"]
source = '''
# parse nginx combined log format:
# $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
parsed, err = parse_nginx_log(.message, "combined")
if err != null {
  # if parsing fails, keep the raw message and flag it
  .service = "nginx"
  .level = "warn"
  .host = get_hostname!()
} else {
  .timestamp = parsed.timestamp
  .src_ip = parsed.client
  .user_name = if parsed.user != "-" { parsed.user } else { null }
  .status = to_int(parsed.status)
  .uri = parsed.path
  .method = parsed.method
  .message = .message
  .host = get_hostname!()
  .service = "nginx"

  # derive level from status code
  status = to_int(parsed.status)
  if status >= 500 {
    .level = "error"
  } else if status >= 400 {
    .level = "warn"
  } else {
    .level = "info"
  }
}

del(.file)
del(.source_type)
'''

[transforms.parse_error]
type = "remap"
inputs = ["nginx_error"]
source = '''
# nginx error logs: YYYY/MM/DD HH:MM:SS [level] PID#TID: *CID message
.host = get_hostname!()
.service = "nginx"
.level = "error"

del(.file)
del(.source_type)
'''

# -- sink: ndjson files partitioned by hour ----------------------------------

[sinks.fleet_ndjson]
type = "file"
inputs = ["parse_access", "parse_error"]
path = "/var/lib/fleet/logs/%Y-%m-%d/%H/nginx.ndjson"
encoding.codec = "json"

[sinks.fleet_ndjson.buffer]
type = "disk"
max_size = 268435456  # 256 MiB

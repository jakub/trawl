[env]
# Development builds and tests use the official DuckDB shared library,
# which includes ICU, JSON, and Parquet. Cargo provides its loader path for
# `cargo run` and tests. Distributions stage a verified library separately.
DUCKDB_DOWNLOAD_LIB = "1"

# `cargo xtask <cmd>` → workspace task runner. The double-dash separates
# cargo args from subcommand args so flags like `--release` reach xtask.
[alias]
xtask = "run --package xtask --quiet --"

[env]
# trawl-core's build script prepares the checksum-verified shared runtime for
# native builds, including its standalone DuckDB parity tests. libduckdb-sys
# only emits bindings and -lduckdb; it must not download or select a host copy.
DUCKDB_DOWNLOAD_LIB = "0"
DUCKDB_NO_PKG_CONFIG = { value = "1", force = true }

# `cargo xtask <cmd>` → workspace task runner. The double-dash separates
# cargo args from subcommand args so flags like `--release` reach xtask.
[alias]
xtask = "run --package xtask --quiet --"

schema = 1
name = "trawl"

[web]
local_port = 8081
tailscale_port = 8444
backend_port = 8090
login_path = "/login"

[database]
name = "trawl_dev"
migration_mode = "application-startup"

[auth]
permissions = [
  "trawl:query",
  "trawl:schema_read",
  "trawl:validate",
  "trawl:saved_query",
  "trawl:export",
  "trawl:stream",
  "trawl:query_cancel",
  "trawl:server_manage",
]

[preparation]
command = ["cargo", "build", "--no-default-features", "-p", "trawl-server", "-p", "trawl-web"]

[[processes]]
name = "trawld"
command = ["bin/trawld-dev"]

[processes.resolved_env]
FLEET_DATABASE_URL = "fleet.database_url"
TRAWL_DATABASE_URL = "app.database_url"

[[processes]]
name = "trawl-web"
command = ["target/debug/trawl-web"]

# Pin the certificate the dev trawld generates in its state directory
# (default config ~/.trawl/trawld.toml, [data] path ~/.trawl/data). Until
# trawld's first start writes it, trawl-web answers 503 and then loads it.
[processes.env]
TRAWL_WEB_UPSTREAM_CA_PATH = "~/.trawl/tls/cert.pem"

[processes.resolved_env]
FLEET_SESSION_AEAD_KEY = "fleet.session_aead_key"

[[processes]]
name = "web-ui"
command = ["trunk", "serve"]
cwd = "crates/trawl-web-ui"

# `.padded()` is chumsky's built-in whitespace padding — it skips
# whitespace and nothing else. trawl's comments are a grammar production
# admitted wherever the grammar skips whitespace (ADR-0014 ruling 4), so a
# `.padded()` site is by construction a place comments do not work. There
# is exactly one padding owner, `parser::comment::Spaced::spaced`, and
# this entry is what makes a missed site — or a new one added later — fail
# the build instead of silently reopening the hole.
#
# Regex construction has one owner too, `trawl_core::pattern` (ADR-0063).
# Its `Preparer` builds under the 1 MiB compiled-size limit, builds each
# pattern once per ledger, and stops after a size failure. A builder called
# anywhere else skips all three. `pattern/mod.rs` holds the one `#[expect]`.
# This rule cannot ban a build through `FromStr` or `TryFrom`: clippy does
# not resolve a path to a trait impl's method, and banning the trait
# methods themselves would ban them for every type. So `disallowed-types`
# below bans naming `regex::Regex` or `regex::bytes::Regex` outside the
# owner, which a typed `.parse()`, a qualified `from_str` or `try_from`, a
# return type and a struct field all do. The owner never lends out a
# `regex::Regex`, so code elsewhere cannot reach the type by inference
# either. `pattern::tests::construction_inventory`
# also scans the sources for those spellings and lists every site it finds:
# `Regex::from_str`, `Regex::try_from`, `parse::<…Regex…>`, a fully
# qualified `<…Regex… as …>::from_str` or `::try_from`, and a `.parse()` in
# a `let` whose type names `Regex`.
disallowed-methods = [
    { path = "chumsky::Parser::padded", reason = "use parser::comment::Spaced::spaced — .padded() skips whitespace only, so comments would not work there (ADR-0014 ruling 4)" },
    { path = "sqlx_core::pool::options::PoolOptions::connect", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "sqlx_core::pool::options::PoolOptions::connect_with", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "sqlx_core::pool::options::PoolOptions::connect_lazy", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "sqlx_core::pool::options::PoolOptions::connect_lazy_with", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "sqlx_core::pool::Pool::connect", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "sqlx_core::pool::Pool::connect_with", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "sqlx_core::pool::Pool::connect_lazy", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "sqlx_core::pool::Pool::connect_lazy_with", reason = "raw pool construction is banned outside the one owner per process (fixture_pool in tests, the named production pool owners) — see ADR-0021 ruling 3" },
    { path = "regex::Regex::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::RegexBuilder::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::RegexSet::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::RegexSetBuilder::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::bytes::Regex::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::bytes::RegexBuilder::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::bytes::RegexSet::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::bytes::RegexSetBuilder::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex_automata::meta::Regex::new", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex_automata::meta::Regex::new_many", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex_automata::meta::Builder::build", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex_automata::meta::Builder::build_many", reason = "build regexes through trawl_core::pattern::Preparer, the one owner, which bounds and counts every build (ADR-0063)" },
]
disallowed-types = [
    { path = "regex::Regex", reason = "build and hold regexes through trawl_core::pattern, the one owner, which bounds and counts every build (ADR-0063)" },
    { path = "regex::bytes::Regex", reason = "build and hold regexes through trawl_core::pattern, the one owner, which bounds and counts every build (ADR-0063)" },
]

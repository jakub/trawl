[package]
name = "fleet-server"
description = "The fleetd daemon — HTTP, Unix socket, and TCP+TLS listeners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fleetd"
path = "src/main.rs"

[dependencies]
fleet-api = { workspace = true }
fleet-core = { workspace = true }
fleet-engine = { workspace = true }
fleet-auth = { workspace = true }

async-stream = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
duckdb = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
governor = { workspace = true }
indexmap = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }
hyper = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
dashmap = { workspace = true }
shellexpand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
hostname = { workspace = true }
ratatui = { workspace = true }
x509-parser = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
fleet-client = { workspace = true }
insta = { workspace = true }
reqwest = { workspace = true }

[package.metadata.deb]
name = "fleetd"
maintainer = "Jakub Burgis <mail@jakub.me>"
copyright = "2025-2026, Jakub Burgis"
depends = "$auto"
section = "net"
priority = "optional"
conf-files = ["/etc/fleet/fleetd.toml", "/etc/default/fleetd"]
systemd-units = { unit-name = "fleetd", enable = true, start = true }
assets = [
    ["target/release/fleetd", "usr/bin/", "755"],
    ["target/release/fleet-admin", "usr/bin/", "755"],
    ["debian/fleetd.toml", "etc/fleet/", "644"],
    ["debian/fleetd.default", "etc/default/fleetd", "644"],
    ["debian/fleet.sysusers.conf", "usr/lib/sysusers.d/fleet.conf", "644"],
]

[lints]
workspace = true

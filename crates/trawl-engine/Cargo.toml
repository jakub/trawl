[package]
name = "trawl-engine"
description = "DuckDB query execution engine for trawl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
trawl-api = { workspace = true }
trawl-core = { workspace = true }
chrono = { workspace = true }
duckdb = { workspace = true }
indexmap = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Self-dependency: enables the bind counter (`executor::prepare_probe`) for
# this crate's own integration tests. Keep production feature selection
# independent of the test-support hook.
trawl-engine = { path = ".", default-features = false, features = ["test-support"] }
insta = { workspace = true }
tempfile = { workspace = true }

[features]
# Exposes `executor::prepare_probe`, the count of statements handed to
# DuckDB, and the phase clock's hold hook and transition log
# (`timing::PhaseClock::hold_on_enter`, `transitions`) to tests: this
# crate's own via the self-dependency above, and trawl-server's through its
# own test-support feature. No production consumer enables it.
test-support = []

[lints]
workspace = true

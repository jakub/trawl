[package]
name = "trawl-engine"
description = "DuckDB query execution engine for trawl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
trawl-api = { workspace = true }
trawl-core = { workspace = true }
chrono = { workspace = true }
duckdb = { workspace = true }
indexmap = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Self-dependency: enables the bind counter (`executor::prepare_probe`) for
# this crate's own integration tests. default-features = false so it cannot
# re-enable `bundled` under CI's --no-default-features run.
trawl-engine = { path = ".", default-features = false, features = ["test-support"] }
insta = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["bundled"]
bundled = ["duckdb/bundled", "duckdb/json", "duckdb/parquet"]
# Exposes `executor::prepare_probe`, the count of statements handed to
# DuckDB, to this crate's own integration tests via the self-dependency
# above. No production consumer enables it.
test-support = []

[lints]
workspace = true

[package]
name = "trawl-mcp"
description = "The MCP server for trawl: a thin client over trawl-client that answers in text first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Never add trawl-server here, not even as a dev-dependency: every call
# must cross trawl-client and the API's guards (ADR-0058). A test holds
# the normal dependency graph free of it.
[dependencies]
trawl-api = { workspace = true }
trawl-client = { workspace = true }
trawl-core = { workspace = true }
trawl-search-url = { workspace = true }

chrono = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }

[lints]
workspace = true

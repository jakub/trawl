[package]
name = "fleet-auth"
description = "Postgres-backed API key store and shared auth types for fleet apps (ADR-0030)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

argon2 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true, features = ["alloc"] }
blake3 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true, features = ["serde"] }
cookie = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# tokio is needed for spawn_blocking — argon2id KDF runs ~200 ms in prod
# params and must not block tokio worker threads. The `rt` feature is the
# minimum surface for spawn_blocking.
tokio = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true }

[features]
# `test-support` is deliberately NOT a default. `cargo build --workspace
# --release` (release.yml / dev-image.yml) builds fleet-auth as a root member
# with its own defaults, and the feature resolver unifies that with
# fleet-auth-as-a-dependency-of-trawl-server into a single rlib. Any default
# feature therefore reaches the shipped trawld/fleet-admin/trawl-web binaries —
# so the pg test fixture must stay off the default path. fleet-auth's own
# integration tests opt in via the self dev-dependency below; production
# consumers already take the crate with `default-features = false`.
default = ["keystore"]
# Postgres-backed KeyStore + token + cache + migration export. Pure types
# (PrincipalKind, RoleAssignment) are always available; future re-export
# consumers that need to stay wasm-clean can disable the default to drop the
# native deps (sqlx, argon2, dashmap, blake3, rand, chrono, tracing).
keystore = [
    "dep:argon2",
    "dep:base64ct",
    "dep:blake3",
    "dep:chrono",
    "dep:dashmap",
    "dep:rand",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
]
# Session cookie AEAD (XChaCha20-Poly1305), SessionConfig, and cookie header
# builders. Independent of `keystore` so consumers that only need the pure
# AEAD/config surface (e.g. a renderer that decodes an unwrapped
# SessionPayload) can take just this feature.
session = [
    "dep:base64ct",
    "dep:chacha20poly1305",
    "dep:chrono",
    "dep:cookie",
    # `http` types (`HeaderMap`/`Uri`) back `request_host` — the shared
    # Host-header → `:authority` derivation both fleet-auth's own handlers and
    # thin session-only proxies (trawl-web) feed into `check_origin`. `http` is
    # a lightweight, wasm-clean types crate, so it stays fine for session-only
    # (e.g. renderer) consumers.
    "dep:http",
    "dep:rand",
    "dep:serde_json",
    # `check_origin` emits the canonical cross-origin-rejection log so the
    # fields/message live in one place; tracing is a lightweight, wasm-clean
    # facade, so this stays fine for session-only (e.g. renderer) consumers.
    "dep:tracing",
]
# Axum middleware (RequireSession, RequireBearer) + login/logout handler
# factories. Pulls keystore (verify_key on the request path) and session
# (cookie AEAD) transitively — there's no middleware without both.
axum = [
    "keystore",
    "session",
    "dep:axum",
    "dep:tracing",
]
# Test-time argon2id with very low cost so the suite doesn't burn CPU on KDF.
fast-hash = []
# Postgres test fixture (ephemeral per-test database + migrations) shared
# with sibling crates' integration tests. Never enable in production builds.
test-support = ["keystore"]

[dev-dependencies]
# Self dev-dependency: enables `test-support` (the pg fixture) for fleet-auth's
# OWN test targets without putting it on the default feature path. dev-deps are
# only built for this crate's tests/examples/benches, so this never leaks into
# the shipped `--workspace --release` binaries. CI enables the fuller
# keystore/axum/fast-hash/test-support set explicitly (ci.yml).
fleet-auth = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true }
# Used by integration tests for `Router::oneshot` — only needed under the
# `axum` feature, but dev-dependencies don't support feature-gating cleanly,
# so it's unconditional here. The test files themselves are gated.
tower = { workspace = true }

[lints]
workspace = true

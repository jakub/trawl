[package]
name = "fleet-auth"
description = "Postgres-backed API key store and shared auth types for fleet apps (ADR-0030)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

argon2 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true, features = ["alloc"] }
blake3 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true, features = ["serde"] }
cookie = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
tracing = { workspace = true, optional = true }

[features]
default = ["keystore"]
keystore = [
    "dep:argon2",
    "dep:base64ct",
    "dep:blake3",
    "dep:chrono",
    "dep:rand",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
]
session = [
    "dep:base64ct",
    "dep:chacha20poly1305",
    "dep:chrono",
    "dep:cookie",
    "dep:http",
    "dep:rand",
    "dep:serde_json",
    "dep:tracing",
]
axum = [
    "keystore",
    "session",
    "dep:axum",
    "dep:tracing",
]
fast-hash = []

[dev-dependencies]
# Self dev-dependency: enables the axum + fast-hash features for fleet-auth's
# OWN test targets without putting them on the default feature path.
fleet-auth = { path = ".", features = ["axum", "fast-hash"] }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true

[package]
name = "fleet-auth"
description = "Postgres-backed API key store and shared auth types for fleet apps (ADR-0030)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

argon2 = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true, features = ["serde"] }
dashmap = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }
# tokio is needed for spawn_blocking — argon2id KDF runs ~200 ms in prod
# params and must not block tokio worker threads. The `rt` feature is the
# minimum surface for spawn_blocking.
tokio = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true }

[features]
default = ["keystore"]
# Postgres-backed KeyStore + token + cache + migration export. Pure types
# (PrincipalKind, RoleAssignment) are always available; future re-export
# consumers that need to stay wasm-clean can disable the default to drop the
# native deps (sqlx, argon2, dashmap, blake3, rand, chrono, tracing).
keystore = [
    "dep:argon2",
    "dep:base64ct",
    "dep:blake3",
    "dep:chrono",
    "dep:dashmap",
    "dep:rand",
    "dep:sqlx-core",
    "dep:sqlx-postgres",
    "dep:tokio",
    "dep:tracing",
]
# Test-time argon2id with very low cost so the suite doesn't burn CPU on KDF.
fast-hash = []

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

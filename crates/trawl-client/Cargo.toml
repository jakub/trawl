[package]
name = "trawl-client"
description = "Shared client library for connecting to trawld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
trawl-api = { workspace = true }
trawl-engine = { workspace = true }

async-stream = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
# `unbounded_depth` lets the ingest preview decode a report that echoes an
# event three containers deep, under its own depth bound (client.rs).
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true

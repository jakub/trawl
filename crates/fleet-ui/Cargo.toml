[package]
name = "fleet-ui"
description = "Shared Leptos 0.8 design tokens + base components for fleet apps (wasm32 target). ADR-0030."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# fleet-ui is a wasm-only library. The lib.rs has `#![cfg(target_arch = "wasm32")]`
# at crate root, so on native it compiles to an empty crate — leptos / web-sys /
# gloo never enter the native dependency graph. This matches the trawl-web-ui
# Cargo.toml gating pattern.
#
# No unconditional [dependencies] block — there is no native surface.

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers  = { version = "0.3", features = ["futures"] }
leptos       = { version = "0.8", features = ["csr"] }
serde_json   = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "KeyboardEvent",
    "MouseEvent",
    "Storage",
    "Window",
] }

[lints]
workspace = true

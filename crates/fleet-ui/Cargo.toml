[package]
name = "fleet-ui"
description = "Shared Leptos 0.8 design tokens + base components for fleet apps (wasm32 target). ADR-0030."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# fleet-ui is primarily wasm-only — leptos / web-sys / gloo only enter the
# graph under cfg(target_arch = "wasm32"), matching the trawl-web-ui gating
# pattern. The exception is the `theme::prefs` submodule: a pure serde_json
# parser that builds and tests natively, so the localStorage JSON contract
# is exercised by `cargo nextest run --workspace`.
[dependencies]
# chrono backs the native-tested `time` module; `wasmbind` only kicks in
# on wasm32, where Utc::now (the calendar fallback + shared clock tick)
# needs the js Date bridge (same shape as trawl-web-ui's dep).
chrono = { workspace = true, features = ["wasmbind"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers   = { version = "0.3", features = ["futures"] }
leptos        = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos-use    = { version = "0.18", default-features = false, features = ["use_event_listener", "use_window"] }
wasm-bindgen  = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Storage",
    "Window",
] }

[lints]
workspace = true

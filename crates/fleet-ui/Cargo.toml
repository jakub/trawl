[package]
name = "fleet-ui"
description = "Shared Leptos 0.8 design tokens + base components for fleet apps (wasm32 target). ADR-0030."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `atmosphere` is default-OFF on purpose (ADR-0012).
[features]
atmosphere = []

[dependencies]
# `wasmbind` only kicks in on wasm32, where Utc::now needs the js Date bridge.
chrono = { workspace = true, features = ["wasmbind"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
sha2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers   = { version = "0.4", features = ["futures"] }
js-sys        = "0.3"
leptos        = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos-use    = { version = "0.19", default-features = false, features = ["use_event_listener", "use_media_query", "use_mutation_observer", "use_resize_observer", "use_window"] }
wasm-bindgen  = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "DomRectList",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Storage",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Window",
] }

[lints]
workspace = true

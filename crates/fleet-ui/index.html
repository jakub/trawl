<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>fleet-ui shell demo</title>

    <!-- fleet-ui owns the self-hosted Albert Sans and Chivo Mono faces
         and their OFL attribution. Copy the whole directory so the demo
         and distributed license files come from the same pinned source
         (ADR-0007 and its amendments). -->
    <link data-trunk rel="copy-dir" href="fonts" data-target-path="fonts"/>

    <!--
      wasm-opt disabled: trunk 0.21 pins binaryen version_123, which
      rejects the bulk-memory ops rustc emits by default on wasm32 since
      rust 1.82 — same workaround as crates/trawl-web-ui/index.html.

      data-cargo-features="atmosphere": the backdrop is behind a
      default-off feature so its 142 KB vendored snippet stays out of
      non-mounting consumers' dists (ADR-0012). The workbench IS the
      mounting consumer — the evidence venue for the WebGL ACs — so it
      opts in here.
    -->
    <link data-trunk rel="rust" data-bin="shell_demo" data-wasm-opt="0" data-cargo-features="atmosphere"/>
    <!-- The design system under test — the exact CSS the demo's Shell,
         Rail, TopBar and Toasts render against. -->
    <link data-trunk rel="css" href="styles/fleet-ui.css"/>
    <!-- No copy-file line for vendor/paper-shaders.js, deliberately:
         `module = "/vendor/paper-shaders.js"` is path-shaped, so
         wasm-bindgen inlines the bundle at COMPILE time and re-emits it
         under dist/snippets/ — a copied dist/vendor/ duplicate would be
         dead bytes nothing imports (ADR-0012). -->
</head>
<body>
</body>
</html>

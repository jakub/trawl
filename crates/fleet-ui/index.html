<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>fleet-ui shell demo</title>

    <!-- Geist for chrome, Geist Mono for data (ADR-0007) — same faces
         the real apps use, so the demo renders with production
         typography. -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap"/>

    <!--
      wasm-opt disabled: trunk 0.21 pins binaryen version_123, which
      rejects the bulk-memory ops rustc emits by default on wasm32 since
      rust 1.82 — same workaround as crates/trawl-web-ui/index.html.
    -->
    <link data-trunk rel="rust" data-bin="shell_demo" data-wasm-opt="0"/>
    <!-- The design system under test — the exact CSS the demo's Shell,
         Rail, TopBar and Toasts render against. -->
    <link data-trunk rel="css" href="styles/fleet-ui.css"/>
    <!-- Vendored JS bundle copied into dist/vendor/ so wasm-bindgen's
         `module = "/vendor/paper-shaders.js"` path resolves at runtime
         (same contract as trawl-web-ui's codemirror/uplot copy-file
         lines). A missing directive is a runtime module-load failure
         with no compile-time signal — the fleet-ui trunk-build CI step
         is the only automated check that this resolves. -->
    <link data-trunk rel="copy-file" href="vendor/paper-shaders.js" data-target-path="vendor"/>
</head>
<body>
</body>
</html>

<html lang="en" data-theme="light" data-density="compact">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>fleet-ui shell demo</title>

    <!-- Inter for chrome, JetBrains Mono for data — same faces the real
         apps use, so the demo renders with production typography. -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"/>

    <!--
      wasm-opt disabled: trunk 0.21 pins binaryen version_123, which
      rejects the bulk-memory ops rustc emits by default on wasm32 since
      rust 1.82 — same workaround as crates/trawl-web-ui/index.html.
    -->
    <link data-trunk rel="rust" data-bin="shell_demo" data-wasm-opt="0"/>
    <!-- The design system under test — the exact CSS the demo's Shell,
         Rail, TopBar and Toasts render against. -->
    <link data-trunk rel="css" href="styles/fleet-ui.css"/>
</head>

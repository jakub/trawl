[package]
name = "trawl-web"
description = "Browser-facing session proxy for trawl (serves the SPA, translates cookie sessions to bearer tokens)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawl-web"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# Session cookie AEAD + cookie builders + origin validation come from the
# shared substrate. `session` only — no pg pool, no keystore, no axum
# handlers (the thin proxy validates keys via upstream /whoami instead).
fleet-auth = { workspace = true, features = ["session"] }
futures = { workspace = true }
mime_guess = { workspace = true }
rust-embed = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
trawl-api = { workspace = true }
trawl-config = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

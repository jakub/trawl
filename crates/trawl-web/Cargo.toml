[package]
name = "trawl-web"
description = "Browser-facing session proxy for trawl (serves the SPA, translates cookie sessions to bearer tokens)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawl-web"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
base64ct = { workspace = true, features = ["alloc"] }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
trawl-api = { workspace = true }
# The workspace dep explicitly sets `default-features = false` so consumers
# like trawl-web that only need the `config` module don't transitively pull
# in bundled DuckDB (trawl-server's default `bundled` feature gates that).
# The trawl-server binary itself builds with its own default features via
# `cargo build -p trawl-server` — only cross-crate deps are affected.
trawl-server = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true

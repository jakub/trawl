<!DOCTYPE html>
<html lang="en" data-theme="light" data-rowstyle="bordered">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>trawl</title>

    <!-- The shared stylesheet references fleet-ui's pinned Albert Sans and
         Chivo Mono assets; copy the faces plus OFL/source/checksum
         attribution into this dist. -->
    <link data-trunk rel="copy-dir" href="../fleet-ui/fonts" data-target-path="fonts"/>

    <!--
      wasm-opt temporarily disabled: trunk 0.21 pins binaryen version_123,
      which rejects bulk-memory ops that rustc emits by default on wasm32
      since rust 1.82. revisit when we pin a newer wasm-opt.
    -->
    <link data-trunk rel="rust" data-bin="trawl-web-ui" data-wasm-opt="0"/>
    <!-- uPlot's own chrome first — it positions the legend, cursor and
         axis layers, and both sheets below need to be able to override
         it. It was previously only `copy-file`d into dist/, i.e. shipped
         but never loaded, which left every chart's legend unstyled. -->
    <link data-trunk rel="css" href="vendor/uplot.css"/>
    <!-- fleet-ui design system next so app-specific selectors in
         main.css keep cascade priority. -->
    <link data-trunk rel="css" href="../fleet-ui/styles/fleet-ui.css"/>
    <link data-trunk rel="css" href="styles/main.css"/>
    <!-- Vendored JS bundles copied into dist/vendor/ so wasm-bindgen's
         `module = "/vendor/codemirror.js"` path resolves at runtime. -->
    <link data-trunk rel="copy-file" href="vendor/codemirror.js" data-target-path="vendor"/>
    <link data-trunk rel="copy-file" href="vendor/uplot.js" data-target-path="vendor"/>
</head>
<body>
</body>
</html>

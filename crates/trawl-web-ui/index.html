<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="compact" data-rowstyle="bordered">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>trawl</title>

    <!-- Inter for chrome, JetBrains Mono for data. Self-hosting is a
         follow-up; CSP is extended in trawl-web to allow Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"/>

    <!--
      wasm-opt temporarily disabled: trunk 0.21 pins binaryen version_123,
      which rejects bulk-memory ops that rustc emits by default on wasm32
      since rust 1.82. revisit when we pin a newer wasm-opt.
    -->
    <link data-trunk rel="rust" data-bin="trawl-web-ui" data-wasm-opt="0"/>
    <link data-trunk rel="css" href="styles/main.css"/>
    <!-- Vendored JS bundles copied into dist/vendor/ so wasm-bindgen's
         `module = "/vendor/codemirror.js"` path resolves at runtime. -->
    <link data-trunk rel="copy-file" href="vendor/codemirror.js" data-target-path="vendor"/>
    <link data-trunk rel="copy-file" href="vendor/cytoscape.js" data-target-path="vendor"/>
    <link data-trunk rel="copy-file" href="vendor/uplot.js" data-target-path="vendor"/>
    <link data-trunk rel="copy-file" href="vendor/uplot.css" data-target-path="vendor"/>
</head>
<body>
</body>
</html>

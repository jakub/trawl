[build]
target = "index.html"
dist = "dist"

# Bind BOTH loopback families: macOS resolves *.localhost to ::1 and
# 127.0.0.1 regardless of /etc/hosts, and IPv6-first clients (curl,
# Safari) would otherwise land on whatever squats [::]:8081.
#
# Port 8081, not the more obvious 8080: code-server owns 8080 on the dev
# box, and trunk aborts rather than sharing the port.
[serve]
addresses = ["127.0.0.1", "::1"]
port = 8081

# Trunk 0.21.14 panics on root-mounted proxies (axum no longer allows
# `nest_service` at "/"). So we proxy *only* `/api/`.
#
# The CLI and env forms of `--proxy-backend` register a SECOND proxy rather
# than replacing this one, and trunk panics on the duplicate `/api/` route.
# `fleet-dev` handles that by generating a private configuration.
[[proxy]]
backend = "http://localhost:8090/api/"

[package]
name = "trawl-web-ui"
description = "Leptos SPA for the trawl web UI (wasm32 target)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawl-web-ui"
path = "src/main.rs"

[dependencies]
trawl-api = { workspace = true }
# `atmosphere` opts into fleet-ui's default-off WebGL backdrop gate (ADR-0012).
fleet-ui = { workspace = true, features = ["atmosphere"] }
trawl-core = { workspace = true }
trawl-search-url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["wasmbind"] }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = "0.8"
leptos-use = { version = "0.19", default-features = false, features = [
    "use_event_listener",
    "use_media_query",
    "use_resize_observer",
    "use_window",
] }
console_error_panic_hook = "0.1"
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "CloseEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventSource",
    "EventTarget",
    "FocusOptions",
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "PageTransitionEvent",
    "MouseEvent",
    "NodeList",
    "Storage",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Url",
    "Window",
] }

[lints]
workspace = true

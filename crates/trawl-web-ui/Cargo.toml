[package]
name = "trawl-web-ui"
description = "Leptos SPA for the trawl web UI (wasm32 target)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawl-web-ui"
path = "src/main.rs"

# trawl-api is used by a handful of pure-logic modules (facets.rs and the
# shared display helpers) that compile on both targets so their tests run
# under plain `cargo test`. It's a zero-dep-beyond-serde workspace crate,
# so importing it on native costs nothing.
#
# chrono is pulled into the native build for the `time_fmt` unit tests.
# The `wasmbind` feature only kicks in on wasm32.
[dependencies]
trawl-api = { workspace = true }
coastwatch-api-types = { workspace = true }
chrono = { workspace = true, features = ["wasmbind"] }

# Wasm-only deps — leptos, web-sys, gloo-net, etc. `cargo check --workspace`
# on native skips these entirely, but the binary compiles against them when
# `trunk build` sets the wasm32 target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = "0.8"
console_error_panic_hook = "0.1"
gloo-net = "0.7"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
thiserror = { workspace = true }
trawl-core = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "CloseEvent",
    "Document",
    "Element",
    "EventSource",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Storage",
    "Url",
    "Window",
] }

[lints]
workspace = true

[package]
name = "trawl-web-ui"
description = "Leptos SPA for the trawl web UI (wasm32 target)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawl-web-ui"
path = "src/main.rs"

# trawl-api is used by a handful of pure-logic modules (facets.rs and the
# shared display helpers) that compile on both targets so their tests run
# under plain `cargo test`. It's a zero-dep-beyond-serde workspace crate,
# so importing it on native costs nothing.
[dependencies]
trawl-api = { workspace = true }
# Unconditional: fleet-ui's pure-native modules
# (theme::prefs, toast::kinds) ride along for host builds; the leptos
# component surface only enters the graph on wasm32.
# `atmosphere` opts into fleet-ui's default-off WebGL backdrop gate
# (ADR-0012): linking the vendored paper-shaders snippet is exactly what
# the feature controls. Enabled dep-level (not Trunk's
# data-cargo-features) so cargo check / clippy / trunk all build one
# feature set across cargo check, clippy, and trunk.
fleet-ui = { workspace = true, features = ["atmosphere"] }
# Unconditional for the same reason as trawl-api: `repin_hint` is a pure
# module whose tests run natively, and the CLI-hint refusal rule it
# mirrors is decided by `trawl_core::sanitize` — mirroring THAT too would
# be a second copy of a security-relevant character set.
trawl-core = { workspace = true }
base64ct = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
# Unconditional for the same reason again: `repin_flow::classify_conflict`
# is the pure half of the repin POST — it decides which of the TWO 409
# bodies arrived by DECODING them — and its table test feeds it real
# bodies, so serde_json has to build on native too. It is already in the
# wasm graph; this only widens where it is available.
serde_json = { workspace = true }
# Unconditional for the same reason once more: `context_query` builds the
# Show-context `_time` window, so its ±30s arithmetic and the canonical
# column name it emits are pinned by native tests. `wasmbind` only kicks
# in on wasm32 (same shape as fleet-ui's dep).
chrono = { workspace = true, features = ["wasmbind"] }

# Wasm-only deps — leptos, web-sys, gloo-net, etc. `cargo check --workspace`
# on native skips these entirely, but the binary compiles against them when
# `trunk build` sets the wasm32 target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = "0.8"
# The date-range dialog binds Escape at the window, exactly as fleet-ui's
# Modal does; leptos-use is already in the wasm graph through fleet-ui, so
# mirroring that wiring costs nothing and avoids a hand-rolled Closure
# with its own cleanup.
leptos-use = { version = "0.19", default-features = false, features = [
    "use_event_listener",
    "use_media_query",
    "use_resize_observer",
    "use_window",
] }
console_error_panic_hook = "0.1"
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
thiserror = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "EventSource",
    "EventTarget",
    # `History` is the Schema page's origin-aware back: an entry the SPA
    # itself pushed is popped, never replaced.
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Storage",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Url",
    "Window",
] }

[lints]
workspace = true

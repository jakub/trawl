[package]
name = "trawl-web-ui"
description = "Leptos SPA for the trawl web UI (wasm32 target)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawl-web-ui"
path = "src/main.rs"

# Deps are target-gated so `cargo check --workspace` passes on native while
# the real app only compiles for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = "0.8"
console_error_panic_hook = "0.1"
gloo-net = "0.7"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
thiserror = { workspace = true }
chrono = { workspace = true, features = ["wasmbind"] }
trawl-core = { workspace = true }
trawl-api = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
] }

[lints]
workspace = true

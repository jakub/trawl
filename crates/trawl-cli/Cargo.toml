[package]
name = "trawl-cli"
description = "CLI tool for querying logs via trawl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawl"
path = "src/main.rs"

[dependencies]
trawl-api = { workspace = true }
trawl-client = { workspace = true }
trawl-config = { workspace = true }
trawl-core = { workspace = true }
trawl-dashboard = { workspace = true }
trawl-engine = { workspace = true }
arboard = { workspace = true, optional = true }
chrono = { workspace = true }
clap = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
futures = { workspace = true }
nix = { workspace = true }
nucleo-matcher = { workspace = true }
ratatui = { workspace = true }
rand = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shellexpand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]

[dev-dependencies]
axum = { workspace = true }
# `tests/preview_ingest.rs` boots a real trawld in-process, as
# trawl-server's own fixture does: the server crate, its keystore, its
# postgres driver and its metrics recorder. All four are already in the
# workspace graph through trawl-server. `fast-hash` is fleet-auth's
# test-cost argon2id, as trawl-server's own tests use it.
fleet-auth = { workspace = true, features = ["fast-hash"] }
insta = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio-rustls = { workspace = true }
trawl-server = { workspace = true }
trawl-web = { workspace = true }

[package.metadata.deb]
maintainer = "Jakub Burgis <mail@jakub.me>"
copyright = "2025-2026, Jakub Burgis"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/trawl", "usr/bin/", "755"],
]

[lints]
workspace = true

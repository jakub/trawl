# Configuration for trawld and trawl-web, installed by trawl-server.
# Package location: /etc/trawl/trawld.toml. These deployment settings
# include package-specific paths and listeners; commented keys are optional.
# Setup: https://trawl.sh/operate/deployment/#install-the-debian-package
# Byte sizes accept human-readable suffixes: K, M, G, T (binary/1024-based).

[server]
# Address to bind the HTTPS listener.
http_addr = "0.0.0.0:5514"

# Query execution timeout (seconds).
# timeout_secs = 30

# Maximum concurrent queries (bounds the DuckDB executor pool).
# Defaults to the number of available CPUs.
# max_concurrent_queries = 4

# Maximum rows a single query can return before being rejected.
# max_result_rows = 100000

# Maximum rows allowed in CSV export responses.
# max_export_rows = 1000000

# Maximum request body size (default: 128K).
# max_request_body_bytes = "128K"

# Maximum concurrent HTTP requests. Returns 503 when exceeded.
# max_concurrent_requests = 256

# Graceful shutdown drain timeout (seconds).
# shutdown_drain_secs = 30

# Maximum concurrent SSE streaming connections. Returns 429 when exceeded.
# max_sse_connections = 32

# TLS certificate and key (PEM format). If omitted, a self-signed
# certificate is auto-generated at startup. Both must be set or both omitted.
# tls_cert_path = "/etc/trawl/cert.pem"
# tls_key_path = "/etc/trawl/key.pem"

# How often to check cert/key files for changes (seconds). 0 = disabled.
# tls_reload_interval_secs = 300

# CORS allowed origins. Empty list = no CORS headers.
# cors_allowed_origins = ["https://trawl.example.com"]

# Schema cache TTL (seconds).
# schema_cache_ttl_secs = 60

# Maximum completed queries kept in the history ring buffer.
# max_query_history = 1000

# Per-key rate limit (requests per minute). Every API key gets an
# independent bucket: default_rpm on the interactive API routes,
# ingest_rpm on /api/v1/ingest; 0 = disabled for that route class.
# ingest_rpm is earned by the ingest permission — every other key stays
# on default_rpm there too.
# The highest rate_rpm set by the key's roles replaces the route-class
# default, including when that default is 0. See
# https://trawl.sh/operate/access/#create-roles-and-keys.
# [server.rate_limit]
# default_rpm = 100
# ingest_rpm = 1000

[data]
# Directory containing parquet files.
path = "/var/lib/trawl/data"

[auth]
# Fleet-auth PostgreSQL URL for API keys and roles. REQUIRED: provision
# the database and apply its schema with `fleet-admin migrate` before
# starting trawld. See https://trawl.sh/operate/deployment/#provision-the-databases.
# The FLEET_DATABASE_URL environment variable takes precedence — set it in
# /etc/default/trawld to keep credentials out of this file.
database_url = "postgres://fleet:CHANGE_ME@db.example.internal:5432/fleet"

# How often to poll the fleet keystore for key changes (seconds).
# audit_interval_secs = 30

[storage]
# Trawl app-state Postgres URL (query history, saved queries, schedules,
# report runs). REQUIRED: a separate database, distinct
# from the fleet keystore; trawld migrates it automatically at boot and
# holds a session advisory lock (sole writer). No fallback to the [auth]
# URL. The TRAWL_DATABASE_URL environment variable takes precedence.
# Provision the database and role as described in
# https://trawl.sh/operate/deployment/#provision-the-databases.
database_url = "postgres://trawl:CHANGE_ME@db.example.internal:5432/trawl"

[ingest]
# Whether the ingest endpoint (POST /api/v1/ingest) is enabled.
# enabled = true

# Maximum request body size for ingest (default: 16M).
# max_body_bytes = "16M"

# WAL directory for buffering ingested events before compaction.
# Defaults to {data.path}/wal/ when omitted.
# wal_dir = "/var/lib/trawl/data/wal"

# How often the compaction task runs (seconds).
# compaction_interval_secs = 10

# Write internal server events to the ingest pipeline as service:trawld.
# internal_telemetry = true

# Consolidate per-service hourly parquet files into daily files.
# daily_rollup = true

# Capacity of the in-memory event bus broadcast channel.
# event_bus_capacity = 4096

# Maximum number of events held in the hot buffer.
# hot_buffer_max_events = 100000

# Maximum estimated memory usage for the hot buffer (default: 100M).
# hot_buffer_max_bytes = "100M"

# How often server stats are emitted as telemetry events (seconds).
# stats_interval_secs = 60

# How often buffered tracing events are flushed to WAL (seconds).
# telemetry_flush_interval_secs = 1

# Wire keys _severity derives from, first MAPPABLE wins. Sources are only
# READ — each stays a queryable column. Empty means "derive nothing".
# severity_from = ["severity", "severity_text", "level"]

# The typed form declares the dialect an entry's NUMERICS read in: "otel"
# (default) or "syslog", which inverts 0-7. Use it for a syslog-over-HTTP
# forwarder that ships the raw PRI numeral:
# severity_from = ["severity", "severity_text", "level", { field = "syslog_severity", dialect = "syslog" }]

# Wire keys _time derives from, first PRESENT wins. Must contain _time
# (the only reserved name allowed here); a dialect is an error.
# time_from = ["_time", "timestamp", "@timestamp"]

# Both are boot-fatal on a bad entry and forward-only on change: nothing
# re-derives stored events.

[retention]
# Delete date directories older than this many days in every env without a
# [retention.env.<name>] entry. 0 disables age-based deletion for those
# envs. An env with its own finite entry still ages out. Disk pressure can
# delete data in any env, including one with a zero age limit.
# max_age_days = 90

# If free disk space drops below this threshold, delete date directories
# regardless of age, highest expiry ratio first (age over that env's
# max_age_days). 0 = disabled.
# min_free_disk_bytes = "1G"

# How often the retention task runs (seconds).
# retention_interval_secs = 3600

# Per-env age override; max_age_days is required, 0 disables age-based
# deletion. That env's data remains eligible for disk-pressure deletion.
# An env with no table keeps the global max_age_days. Disk
# pressure stays install-wide. Keep these tables LAST in [retention]: in
# TOML a scalar written after this header lands inside it.
# [retention.env.prod]
# max_age_days = 365

[web]
# Browser-facing session proxy (trawl-web). Shared config with trawld.
#
# The proxy serves the web UI SPA and translates cookie-authenticated
# browser requests into bearer-token requests to trawld. Runs as a
# separate systemd unit (trawl-web.service).

# Browser-visible origins allowed to carry a session cookie (ADR-0016).
# REQUIRED: trawl-web refuses to start on an empty list, because an empty
# allowlist can only mean "allow everything" or "allow nothing", and both
# are silent failures.
#
# A present Origin header is compared whole against these entries: scheme,
# host and port must all match, after the default port is filled in
# (https://x is https://x:443). Nothing is derived and nothing is guessed,
# which is why both loopback spellings ship below: http://localhost:8090
# and http://127.0.0.1:8090 are two different origins to a browser, and a
# trailing DNS root dot is a third (https://trawl.example.com. is not
# https://trawl.example.com). Behind a TLS-terminating reverse proxy, add
# the origin the BROWSER shows, e.g. "https://trawl.example.com", not the
# loopback address the proxy forwards to. Forwarded and X-Forwarded-* are
# never consulted, so nothing a client or a proxy sends can widen this
# list.
public_origins = ["http://127.0.0.1:8090", "http://localhost:8090"]

# Address to bind the proxy's HTTP listener.
# Default is loopback only — put a TLS-terminating reverse proxy
# (nginx/caddy/traefik) in front for external access.
# bind_addr = "127.0.0.1:8090"

# Upstream trawld URL. Derived from [server].http_addr by default
# (wildcard binds are rewritten to loopback for same-host reach).
# upstream_url = "https://127.0.0.1:5514"

# PEM file of the CA certificates to trust for trawld. The proxy trusts only
# these CAs and still checks the hostname in upstream_url, which must be
# https. The package pins the self-signed certificate that trawld generates
# on its first start, when [server] tls_cert_path is not set. trawl-web
# refuses to start until that file exists, and systemd restarts it every 5s
# until trawld has written it.
# If you set your own tls_cert_path, point upstream_ca_path at the CA that
# issued that certificate. The certificate must name the host in
# upstream_url (127.0.0.1 by default).
# This setting and TRAWL_WEB_INSECURE_UPSTREAM in /etc/default/trawl-web
# cannot both be set: trawl-web refuses to start.
upstream_ca_path = "/var/lib/trawl/tls/cert.pem"

# Path to the 32-byte AEAD cookie-encryption key. The Debian postinst
# script generates one from /dev/urandom on first install.
cookie_secret_path = "/var/lib/trawl/web.cookie"

# Alternative: read the base64-encoded key from an environment
# variable. Takes precedence over cookie_secret_path.
# cookie_secret_env = "TRAWL_WEB_COOKIE_SECRET"

# Session lifetime in seconds (default: 24h).
# session_ttl_secs = 86400

# Drop the Secure flag on session cookies. Set true ONLY when the
# browser connects over HTTP. Keep false for browser HTTPS, including
# when a reverse proxy terminates TLS.
# allow_insecure_cookies = false

# Fleet SSO: parent domain for the shared fleet_session cookie. Set the
# SAME value in every fleet app (mirrors coastwatch's session.shared_domain)
# and provision the SAME session key in all of them. See
# https://trawl.sh/operate/access/#share-a-browser-session-across-fleet-applications.
# The key minted by
# `fleet-admin generate-session-key` is base64; cookie_secret_path expects
# RAW 32 bytes, so decode it when overwriting /var/lib/trawl/web.cookie.
# Unset/empty = standalone mode (origin-scoped cookie, the self-generated
# key keeps working).
# shared_domain = ".fleet.lab.ktle.net"

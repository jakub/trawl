# Grants trawld CAP_SYS_PTRACE so its crash-dump monitor can ptrace the
# main process and write an out-of-process minidump on a fatal signal.
#
# Disabled by default. To enable:
#   install -D -m 0644 /usr/share/doc/trawl-server/examples/crashdump.conf /etc/systemd/system/trawld.service.d/crashdump.conf && systemctl daemon-reload && systemctl restart trawld
#
# WARNING: a minidump is a verbatim copy of process memory, so it can
# contain API tokens, TLS keys, and auth-db rows. Restrict access to the
# dump directory accordingly.
[Service]
AmbientCapabilities=CAP_SYS_PTRACE
Environment=TRAWL_CRASH_DUMP_DIR=/var/lib/trawl/cores
Environment=TRAWL_CRASH_DUMP_RETAIN=10

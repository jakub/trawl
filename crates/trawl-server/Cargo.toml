[package]
name = "trawl-server"
description = "The trawld daemon — HTTP, Unix socket, and TCP+TLS listeners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawld"
path = "src/main.rs"

[dependencies]
trawl-api = { workspace = true }
trawl-core = { workspace = true }
trawl-engine = { workspace = true }
trawl-auth = { workspace = true }

async-stream = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
duckdb = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
governor = { workspace = true }
indexmap = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }
hyper = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
dashmap = { workspace = true }
shellexpand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
hostname = { workspace = true }
ratatui = { workspace = true }
x509-parser = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
trawl-client = { workspace = true }
insta = { workspace = true }
reqwest = { workspace = true }

[package.metadata.deb]
name = "trawld"
maintainer = "Jakub Burgis <mail@jakub.me>"
copyright = "2025-2026, Jakub Burgis"
depends = "$auto"
section = "net"
priority = "optional"
conf-files = ["/etc/trawl/trawld.toml", "/etc/default/trawld"]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "trawld", enable = true, start = true }
assets = [
    ["target/release/trawld", "usr/bin/", "755"],
    ["target/release/trawl-admin", "usr/bin/", "755"],
    ["debian/trawld.toml", "etc/trawl/", "644"],
    ["debian/trawld.default", "etc/default/trawld", "644"],
    ["debian/trawl.sysusers.conf", "usr/lib/sysusers.d/trawl.conf", "644"],
]

[lints]
workspace = true

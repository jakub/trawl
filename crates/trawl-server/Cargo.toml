[package]
name = "trawl-server"
description = "The trawld daemon — HTTP, Unix socket, and TCP+TLS listeners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawld"
path = "src/main.rs"

[dependencies]
trawl-api = { workspace = true }
trawl-config = { workspace = true }
trawl-core = { workspace = true }
trawl-engine = { workspace = true }
trawl-dashboard = { workspace = true }
fleet-auth = { workspace = true, features = ["axum"] }
trawl-crashdump = { workspace = true }

async-stream = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
duckdb = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
governor = { workspace = true }
indexmap = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
hyper = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
dashmap = { workspace = true }
shellexpand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
syslog_loose = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
hostname = { workspace = true }
ratatui = { workspace = true }
x509-parser = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
metrics-process = { workspace = true }
rustix = { workspace = true }

[features]
# Exposes the pool's query-delay hook (`pool::TEST_QUERY_DELAY_MS`) to this
# crate's own integration tests via the self-dev-dependency below. No
# production consumer enables it, so release builds never carry the hook.
test-support = []

[dev-dependencies]
# Self-dependency: enables the test-support hook for this crate's own
# integration tests. Keep production feature selection independent of
# the test-support hook.
trawl-server = { path = ".", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
fleet-auth = { workspace = true, features = ["axum", "fast-hash"] }
trawl-client = { workspace = true }
# The CLI's catalog read commands are driven against a real booted server in
# `tests/catalog_surface.rs`. The workspace dependency disables optional
# CLI features, including clipboard support, for this server-side test.
trawl-cli = { workspace = true }
insta = { workspace = true }
reqwest = { workspace = true }
# `tests/span_context.rs` probes the `log` bridge the way sqlx's statement
# logger does. Already in the graph through sqlx and tracing-log.
log = { workspace = true }

[package.metadata.deb]
name = "trawl-server"
maintainer = "Jakub Burgis <mail@jakub.me>"
copyright = "2025-2026, Jakub Burgis"
depends = "$auto"
section = "net"
priority = "optional"
conf-files = ["/etc/trawl/trawld.toml", "/etc/default/trawld", "/etc/default/trawl-web"]
maintainer-scripts = "debian/"
# Installed disabled and stopped: the shipped trawld.toml holds CHANGE_ME
# database URLs, so a started unit could only fail and restart. postinst tells
# the operator to set the URLs and run `systemctl enable --now trawld trawl-web`.
# With these flags cargo-deb still restarts, on upgrade, a unit the operator
# has already started (see debian/tests/packaging.sh).
systemd-units = [
    { unit-name = "trawld", enable = false, start = false },
    { unit-name = "trawl-web", enable = false, start = false },
]
assets = [
    ["target/release/trawld", "usr/bin/", "755"],
    ["target/release/trawl-admin", "usr/bin/", "755"],
    ["target/release/fleet-admin", "usr/bin/", "755"],
    ["target/release/trawl-web", "usr/bin/", "755"],
    # 0640: these two carry the fleet-auth Postgres DSN (keystore credential).
    # postinst chowns them root:trawl so trawld (User/Group=trawl) can read them
    # while unprivileged local users cannot. See debian/postinst.
    ["debian/trawld.toml", "etc/trawl/", "640"],
    ["debian/trawld.default", "etc/default/trawld", "640"],
    ["debian/trawl-web.default", "etc/default/trawl-web", "644"],
    # The source name has to be the destination name with `.sysusers` in place
    # of `.conf`: cargo-deb >= 3.8.0 generates a `systemd-sysusers <name>` call
    # in postinst, and it derives <name> from THIS path via with_extension("conf"),
    # not from the destination. Spell it `trawl.sysusers.conf` and the generated
    # call asks for a file that was never installed, so dpkg leaves the package
    # half-configured. See debian/tests/crashdump-harness.sh.
    ["debian/trawl.sysusers", "usr/lib/sysusers.d/trawl.conf", "644"],
    # Same naming rule, same reason: cargo-deb runs with_extension("conf") over
    # the source path for tmpfiles.d assets too.
    ["debian/trawl.tmpfiles", "usr/lib/tmpfiles.d/trawl.conf", "644"],
    ["debian/crashdump.conf", "usr/share/doc/trawl-server/examples/crashdump.conf", "644"],
]

[lints]
workspace = true

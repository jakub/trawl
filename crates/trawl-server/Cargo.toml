[package]
name = "trawl-server"
description = "The trawld daemon — HTTP, Unix socket, and TCP+TLS listeners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "trawld"
path = "src/main.rs"

[dependencies]
trawl-api = { workspace = true }
trawl-config = { workspace = true }
trawl-core = { workspace = true }
trawl-engine = { workspace = true }
trawl-dashboard = { workspace = true }
fleet-auth = { workspace = true, features = ["axum"] }
trawl-crashdump = { workspace = true }

async-stream = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
# `trawld --doctor` computes the `SQLx` migrator's lock key as `SQLx` does,
# with the same crate and version (sqlx-postgres 0.9.0 depends on it).
crc = "3.4.0"
duckdb = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
governor = { workspace = true }
indexmap = { workspace = true }
memchr = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
hyper = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
dashmap = { workspace = true }
shellexpand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
syslog_loose = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
hostname = { workspace = true }
ratatui = { workspace = true }
x509-parser = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
metrics-process = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
nix = { workspace = true }

[features]
test-support = ["trawl-engine/test-support"]

[dev-dependencies]
trawl-server = { path = ".", default-features = false, features = ["test-support"] }
trawl-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
fleet-auth = { workspace = true, features = ["axum", "fast-hash"] }
trawl-client = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
trawl-cli = { workspace = true }
insta = { workspace = true }
log = { workspace = true }
regex-automata = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["thread"] }

[package.metadata.deb]
name = "trawl-server"
maintainer = "Jakub Burgis <mail@jakub.me>"
copyright = "2025-2026, Jakub Burgis"
depends = "$auto"
section = "net"
priority = "optional"
conf-files = ["/etc/trawl/trawld.toml", "/etc/default/trawld", "/etc/default/trawl-web"]
maintainer-scripts = "debian/"
# With these flags cargo-deb still restarts, on upgrade, a unit the operator
# has already started.
systemd-units = [
    { unit-name = "trawld", enable = false, start = false },
    { unit-name = "trawl-web", enable = false, start = false },
]
assets = [
    ["target/release/trawld", "usr/bin/", "755"],
    ["target/release/fleet-admin", "usr/bin/", "755"],
    ["target/release/trawl-web", "usr/bin/", "755"],
    # 0640: these two carry the fleet-auth Postgres DSN (keystore credential).
    ["debian/trawld.toml", "etc/trawl/", "640"],
    ["debian/trawld.default", "etc/default/trawld", "640"],
    ["debian/trawl-web.default", "etc/default/trawl-web", "644"],
    # The source name has to be the destination name with `.sysusers` in place
    # of `.conf`: cargo-deb >= 3.8.0 generates a `systemd-sysusers <name>` call
    # in postinst, and it derives <name> from THIS path via with_extension("conf"),
    # not from the destination.
    ["debian/trawl.sysusers", "usr/lib/sysusers.d/trawl.conf", "644"],
    # Same naming rule, same reason: cargo-deb runs with_extension("conf") over
    # the source path for tmpfiles.d assets too.
    ["debian/trawl.tmpfiles", "usr/lib/tmpfiles.d/trawl.conf", "644"],
    ["debian/crashdump.conf", "usr/share/doc/trawl-server/examples/crashdump.conf", "644"],
    # One line each: scripts/release/test-installed-debian.sh lists the same names.
    ["../../config/vector/debian/apache.toml", "usr/share/doc/trawl-server/examples/vector/apache.toml", "644"],
    ["../../config/vector/debian/base.toml", "usr/share/doc/trawl-server/examples/vector/base.toml", "644"],
    ["../../config/vector/debian/docker.toml", "usr/share/doc/trawl-server/examples/vector/docker.toml", "644"],
    ["../../config/vector/debian/fail2ban.toml", "usr/share/doc/trawl-server/examples/vector/fail2ban.toml", "644"],
    ["../../config/vector/debian/mysql.toml", "usr/share/doc/trawl-server/examples/vector/mysql.toml", "644"],
    ["../../config/vector/debian/nginx.toml", "usr/share/doc/trawl-server/examples/vector/nginx.toml", "644"],
    ["../../config/vector/debian/postgresql.toml", "usr/share/doc/trawl-server/examples/vector/postgresql.toml", "644"],
    ["../../config/vector/debian/redis.toml", "usr/share/doc/trawl-server/examples/vector/redis.toml", "644"],
    ["../../config/vector/debian/unifi-syslog.toml", "usr/share/doc/trawl-server/examples/vector/unifi-syslog.toml", "644"],
]

[lints]
workspace = true

name: pg soak

# Flake hunting for the pg-backed suites (ADR-0021). One run executes the
# whole workspace twice, once per feature configuration, exactly as CI's
# `test` job does. Evidence is gathered by pushing a soak branch repeatedly
# and reading the run history, so nothing here counts attempts.
on:
  workflow_dispatch:
  push:
    branches: ['soak/**']

# Read-only, and the checkout keeps no credentials in .git/config: nothing
# here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # As in ci.yml's test build. rust-cache keys on CARGO_* variables, so the
  # soak reads CI's warm `test` cache only while this matches.
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked

# Every job runs on a GitHub-hosted runner, set up as ci.yml's test jobs
# are, so a soak reproduces CI's conditions.
#
# Each job's timeout-minutes is two to three times its slowest normal run,
# so a hung job fails in minutes instead of GitHub's six-hour default.
jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      # Both suites always run: a flake in one says nothing about the other,
      # and cancelling the survivor halves the evidence.
      fail-fast: false
      matrix:
        include:
          - suite: default-features
            features: ""
          - suite: no-default-features
            features: >-
              --no-default-features
              --features fleet-auth/keystore,fleet-auth/axum,fleet-auth/fast-hash
    services:
      postgres:
        # postgres:18's multi-arch index digest. Dependabot can't bump service
        # images (dependabot-core#5819); refresh by hand with
        # `docker buildx imagetools inspect postgres:18`.
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # A TCP health check as in ci.yml, but the data directory stays on
        # disk: ci.yml's tmpfs is RAM, and one server holding the whole
        # workspace's test databases fills it (53100 at about test 7300).
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Turn off postgres durability
        run: ci/postgres-no-durability.sh ${{ job.services.postgres.id }}
      # trawl-config's and trawl-web's packaging contracts render the chart.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      # The trawld_doctor tests that run as root in an unprivileged user
      # namespace need Ubuntu 24.04's AppArmor restriction lifted.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      # Read ci.yml's warm `test` cache, never write it: save-if false keeps
      # ten soak runs from churning the key CI maintains. That key holds the
      # no-default-features build only, so the default-features suite still
      # compiles most of the workspace cold.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest, version-pinned to match ci.yml
        with:
          tool: nextest@0.9.143
      - name: Apply fleet-auth schema migrations
        run: cargo run -p fleet-admin -- migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # `--retries 0` on the command line overrides every retry setting in
      # .config/nextest.toml, including its two named per-test overrides. A
      # soak that retries measures the retry, not the flake.
      # Build and run are separate steps so the step timings say which
      # phase a slow or dying run spent its time in.
      - name: Build test binaries
        run: cargo nextest run --workspace ${{ matrix.features }} --no-run
      - name: Disk after the build
        run: df -h /
      - name: Run suites
        run: cargo nextest run --workspace ${{ matrix.features }} --retries 0
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # A doctor test that needs a user namespace fails here instead of
          # printing SKIPPED, as in ci.yml.
          TRAWL_TEST_REQUIRE_USERNS: "1"
      - name: Record suite outcome
        if: always()
        run: echo "${{ matrix.suite }} -> ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: soak summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [suite]
    if: always()
    steps:
      - name: Report
        run: |
          echo "suite matrix result: ${{ needs.suite.result }}"
          echo "per-suite outcomes are in this run's job summary"
          test "${{ needs.suite.result }}" = "success"

name: pg soak

# Flake hunting for the pg-backed suites (ADR-0021). One run executes the
# whole workspace twice, once per feature configuration, exactly as CI's
# `test` job does. Evidence is gathered by pushing a soak branch repeatedly
# and reading the run history, so nothing here counts attempts.
on:
  workflow_dispatch:
  push:
    branches: ['soak/**']

# Read-only, and the checkout keeps no credentials in .git/config: nothing
# here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: k8s-big
    strategy:
      # Both suites always run: a flake in one says nothing about the other,
      # and cancelling the survivor halves the evidence.
      fail-fast: false
      # ... but one at a time. Unlike ci.yml's single sequential `test` job,
      # a matrix schedules both suites concurrently, and two full workspace
      # builds + two postgres containers co-scheduled on the k8s-big pool
      # OOM the heavier runner pod ~15min in (step stuck in_progress, no
      # logs uploaded, "lost communication"). Every such death so far --
      # the 10 concurrent attempts and the first serial one -- was this,
      # not a test failure.
      max-parallel: 1
      matrix:
        include:
          - suite: default-features
            features: ""
          - suite: no-default-features
            features: >-
              --no-default-features
              --features fleet-auth/keystore,fleet-auth/axum,fleet-auth/fast-hash
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      # Read ci.yml's own warm cache, never write it. The soak's former
      # private per-suite keys were never SAVED for the heavy suite --
      # rust-cache saves in its post step, and a cold full-workspace
      # compile OOMed the pod before post ever ran -- so every attempt
      # rebuilt from scratch and died in the build, not the tests. CI's
      # `test` job compiles both feature configs under this one key on
      # every push, so reading it makes the soak build incremental: the
      # exact memory shape the pool survives daily. save-if false keeps
      # ten soak runs from churning the key CI maintains.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
      - run: cargo clean -p libduckdb-sys 2>/dev/null || true
      - name: Apply fleet-auth schema migrations
        run: cargo run -p fleet-admin -- migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # `--retries 0` on the command line overrides every retry setting in
      # .config/nextest.toml, including its two named per-test overrides. A
      # soak that retries measures the retry, not the flake.
      - run: cargo nextest run --workspace ${{ matrix.features }} --retries 0
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Record suite outcome
        if: always()
        run: echo "${{ matrix.suite }} -> ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: soak summary
    runs-on: k8s-small
    needs: [suite]
    if: always()
    steps:
      - name: Report
        run: |
          echo "suite matrix result: ${{ needs.suite.result }}"
          echo "per-suite outcomes are in this run's job summary"
          test "${{ needs.suite.result }}" = "success"

name: macOS CLI package

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      tooling-sha:
        required: true
        type: string
      release-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      TOOLING_SHA: ${{ inputs.tooling-sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tooling-sha }}
          path: .release-tooling
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-cli-${{ matrix.target }}
      - name: Build CLI with the verified shared runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .release-tooling rev-parse HEAD)" = "$TOOLING_SHA"
          python3 .release-tooling/scripts/release/check-release-source.py . "$RELEASE_TAG" "$SOURCE_SHA"
          bash .release-tooling/scripts/release/build-distribution.sh "$PWD" "$TARGET" "$PWD/runtime" --cli-only
      - name: Package native CLI and relative dylib
        shell: bash
        run: |
          set -euo pipefail
          archive="trawl-${RELEASE_TAG}-${TARGET}"
          python3 .release-tooling/scripts/release/distribution.py stage --source . \
            --binaries "target/$TARGET/release" --runtime runtime --output "$archive" \
            --target "$TARGET" --source-sha "$SOURCE_SHA" --tooling-sha "$TOOLING_SHA" --cli-only
          tar -czf "$archive.tar.gz" "$archive"
          shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            trawl-*.tar.gz
            trawl-*.tar.gz.sha256
          if-no-files-found: error

  verify:
    name: installed CLI (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    # A separate fresh runner receives the archive and verification tooling.
    # No Rust setup, source build, or DuckDB installation is performed here.
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      TOOLING_SHA: ${{ inputs.tooling-sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tooling-sha }}
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.target }}
          path: incoming
      - name: Relocate and execute the archive
        shell: bash
        run: |
          set -euo pipefail
          (cd incoming && shasum -a 256 -c ./*.sha256)
          mkdir installed
          tar -xzf incoming/*.tar.gz -C installed --strip-components=1
          python3 scripts/release/verify-distribution.py installed --target "$TARGET" \
            --source-sha "$SOURCE_SHA" --tooling-sha "$TOOLING_SHA" --expected-version "${RELEASE_TAG#v}"

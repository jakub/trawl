name: Distribution preflight

# A pull request builds and checks the release artifacts without publishing
# them. A push to main runs the same checks after the merge, on the same
# hosted runners, and is the only run that saves the rust caches: the
# release builds on k8s-big save to the in-cluster cache server, which
# hosted runners cannot read, so without this every pull request built the
# release binaries from a cold cache.
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/linux-distribution.yml'
      - '.github/workflows/macos-cli.yml'
      - '.github/workflows/distribution-preflight.yml'
      - 'scripts/release/**'
      - 'Dockerfile'
      - 'Cargo.lock'
      - 'Cargo.toml'
      # The trial job runs the CLI, the browser proxy, and the Debian units
      # from these crates, and follows the trial tutorial. It also reads the
      # web UI and the shared fleet UI (sign-in form, range dialog) by
      # selector, and the admin tools by their output text.
      - 'crates/trawl-cli/**'
      - 'crates/trawl-web/**'
      - 'crates/trawl-server/debian/**'
      - 'crates/trawl-web-ui/**'
      - 'crates/fleet-ui/**'
      - 'crates/fleet-admin/**'
      - 'crates/trawl-admin/**'
      - 'docs/src/content/docs/getting-started/first-query.md'
      - 'crates/trawl-core/Cargo.toml'
      - 'crates/trawl-core/build.rs'
      - 'crates/trawl-core/build_support/**'
      - 'crates/trawl-engine/Cargo.toml'
      - 'crates/trawl-server/Cargo.toml'

  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/linux-distribution.yml'
      - '.github/workflows/macos-cli.yml'
      - '.github/workflows/distribution-preflight.yml'
      - 'scripts/release/**'
      - 'Dockerfile'
      - 'Cargo.lock'
      - 'Cargo.toml'
      # The trial job runs the CLI, the browser proxy, and the Debian units
      # from these crates, and follows the trial tutorial. It also reads the
      # web UI and the shared fleet UI (sign-in form, range dialog) by
      # selector, and the admin tools by their output text.
      - 'crates/trawl-cli/**'
      - 'crates/trawl-web/**'
      - 'crates/trawl-server/debian/**'
      - 'crates/trawl-web-ui/**'
      - 'crates/fleet-ui/**'
      - 'crates/fleet-admin/**'
      - 'crates/trawl-admin/**'
      - 'docs/src/content/docs/getting-started/first-query.md'
      - 'crates/trawl-core/Cargo.toml'
      - 'crates/trawl-core/build.rs'
      - 'crates/trawl-core/build_support/**'
      - 'crates/trawl-engine/Cargo.toml'
      - 'crates/trawl-server/Cargo.toml'

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main gets
# its own group, so each merge finishes and saves its caches (a shared group
# would still cancel a pending main run; see ci.yml).
concurrency:
  group: distribution-preflight-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Each job's timeout-minutes is two to three times its slowest normal run,
# so a hung job fails in minutes instead of GitHub's six-hour default.
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      release-tag: ${{ steps.source.outputs.release-tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the checked-out source identity and version
        id: source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if sha != os.environ['EXPECTED_SHA']:
              raise SystemExit('preflight checkout does not match the PR commit')
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if not isinstance(version, str) or not version or any(c.isspace() for c in version):
              raise SystemExit('invalid committed workspace version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nrelease-tag=v{version}\n')
          PY

  linux:
    needs: metadata
    uses: ./.github/workflows/linux-distribution.yml
    with:
      source-sha: ${{ needs.metadata.outputs.sha }}
      tooling-sha: ${{ needs.metadata.outputs.sha }}
      release-tag: ${{ needs.metadata.outputs.release-tag }}

  macos:
    needs: metadata
    uses: ./.github/workflows/macos-cli.yml
    with:
      source-sha: ${{ needs.metadata.outputs.sha }}
      tooling-sha: ${{ needs.metadata.outputs.sha }}
      release-tag: ${{ needs.metadata.outputs.release-tag }}

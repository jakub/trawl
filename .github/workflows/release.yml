name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1)"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            cross: false
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            cross: true
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            arch: arm64
            cross: true
            os: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set version from tag
        run: |
          version="${RELEASE_TAG#v}"
          echo "Setting workspace version to ${version}"
          sed -i "0,/^version = \".*\"/s//version = \"${version}\"/" Cargo.toml
          grep '^version' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install zig (cross-compile)
        if: matrix.cross
        uses: mlugg/setup-zig@v2

      - name: Install cross-arch dpkg libs (Linux cross-compile)
        if: matrix.cross && contains(matrix.target, 'linux')
        run: |
          sudo dpkg --add-architecture arm64
          # Pin existing sources to amd64 — noble runners use DEB822 .sources
          # files, so patch both formats. Without this, apt tries to fetch
          # arm64 from mirrors that only carry amd64 and gets 404s.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sudo sed -i '/^Architectures:/!s/^Types: deb/Architectures: amd64\nTypes: deb/' "$f"
          done
          for f in /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] && sudo sed -i '/\[arch=/!s/^deb /deb [arch=amd64] /' "$f"
          done
          # Add arm64 from ports.ubuntu.com (the only mirror that carries it)
          codename="$(lsb_release -cs)"
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ %s %s\n' \
            "$codename"          "main universe" \
            "$codename-updates"  "main universe" \
            "$codename-security" "main universe" \
            | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y libc6-arm64-cross dpkg-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Linux cross)
        if: matrix.cross && contains(matrix.target, 'linux')
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.31

      - name: Build (macOS cross)
        if: matrix.cross && contains(matrix.target, 'apple')
        run: cargo zigbuild --release --target ${{ matrix.target }} -p trawl-cli --no-default-features
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

      - name: Build .deb packages
        if: contains(matrix.target, 'linux')
        run: |
          cargo deb -p trawl-server --no-build --no-strip --target ${{ matrix.target }}
          cargo deb -p trawl-cli --no-build --no-strip --target ${{ matrix.target }}

      - name: Create tarball
        run: |
          tag="${RELEASE_TAG}"
          staging="trawl-${tag}-${{ matrix.target }}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/trawl" "${staging}/"
          # trawld and trawl-admin are linux-only (not built for macOS)
          if [ -f "target/${{ matrix.target }}/release/trawld" ]; then
            cp "target/${{ matrix.target }}/release/trawld" "${staging}/"
            cp "target/${{ matrix.target }}/release/trawl-admin" "${staging}/"
          fi
          tar czf "${staging}.tar.gz" "${staging}"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: trawl-*.tar.gz
          if-no-files-found: error

      - name: Upload .deb packages
        if: contains(matrix.target, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.deb

  publish-apt:
    name: publish APT repository
    needs: [build, release]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
        continue-on-error: true
        id: checkout-pages

      - name: Initialize gh-pages branch
        if: steps.checkout-pages.outcome == 'failure'
        run: |
          git init
          git checkout --orphan gh-pages
          git commit --allow-empty -m "init: gh-pages branch"

      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import || true
          # Verify the key was actually imported (gpg exits 2 on armor
          # header warnings from github secrets newline mangling)
          gpg --list-secret-keys --keyid-format long | grep -q '^sec' \
            || { echo "::error::GPG secret key not found after import"; exit 1; }
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail

          # Collect .deb files into pool
          mkdir -p apt/pool
          find incoming -name '*.deb' -exec cp {} apt/pool/ \;
          ls -la apt/pool/

          # All apt operations run from inside apt/ so that
          # dpkg-scanpackages produces Filename: pool/... (not apt/pool/...)
          cd apt

          # Generate per-arch Packages indices
          for arch in amd64 arm64; do
            dir="dists/stable/main/binary-${arch}"
            mkdir -p "${dir}"
            dpkg-scanpackages --arch "${arch}" pool /dev/null > "${dir}/Packages"
            gzip -9c "${dir}/Packages" > "${dir}/Packages.gz"
          done

          # Generate Release file
          cd dists/stable
          cat > Release <<'RELEASE'
          Origin: Trawl
          Label: Trawl
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          RELEASE
          # Add dynamic date field
          echo "Date: $(date -Ru)" >> Release
          # Strip leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' Release
          # Add hashes
          apt-ftparchive release . >> Release

          # Sign
          gpg_key="$(gpg --list-secret-keys --keyid-format long 2>/dev/null \
            | grep '^sec' | head -1 | awk '{print $2}' | cut -d/ -f2)"
          gpg --batch --yes --default-key "${gpg_key}" --detach-sign --armor -o Release.gpg Release
          gpg --batch --yes --default-key "${gpg_key}" --clearsign -o InRelease Release
          cd "$GITHUB_WORKSPACE"

          # Export public key
          gpg --batch --yes --armor --export "${gpg_key}" > gpg.key

      - name: Clean up incoming artifacts
        run: rm -rf incoming

      - name: Commit and push
        run: |
          git add -A
          git commit -m "apt: update repository for ${RELEASE_TAG}"
          git push origin gh-pages

  docker:
    name: container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*-unknown-linux-gnu
          merge-multiple: true

      - name: Extract binaries by arch
        run: |
          for arch in amd64 arm64; do
            case $arch in
              amd64) target="x86_64-unknown-linux-gnu" ;;
              arm64) target="aarch64-unknown-linux-gnu" ;;
            esac
            mkdir -p "docker-ctx/${arch}"
            tar xzf dist/trawl-*-${target}.tar.gz
            cp trawl-*-${target}/trawld "docker-ctx/${arch}/"
            cp trawl-*-${target}/trawl-admin "docker-ctx/${arch}/"
            chmod +x "docker-ctx/${arch}/trawld" "docker-ctx/${arch}/trawl-admin"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm-package:
    name: helm chart
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package and push chart
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          version="${VERSION#v}"
          helm package chart/trawl --version "${version}" --app-version "${version}"
          helm push trawl-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

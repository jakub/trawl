name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1)"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-source:
    name: resolve release source
    runs-on: k8s-small
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      # The resolver belongs to the workflow revision. Product source below
      # always comes from the single immutable commit it resolves.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve exact release tag
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 scripts/release/resolve-source.py "$EVENT_NAME" "$EVENT_REF" "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  build-chart:
    name: prepare and validate release chart
    needs: resolve-source
    runs-on: k8s-small
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-tags: ${{ steps.meta.outputs.tags }}
      image-labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      # Metadata normalization and chart construction finish before any
      # registry write. Docker consumes these exact tags and labels later.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Check out chart tooling at the workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Package and validate selected chart
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir chart-artifact
          bash .release-tooling/scripts/release/package-chart.sh "$RELEASE_TAG" "$IMAGE_TAG" chart/trawl chart-artifact
          helm lint chart-artifact/trawl-*.tgz --strict \
            --set auth.database.existingSecret=fleet-db \
            --set storage.database.existingSecret=trawl-db --set web.enabled=false
          helm template release-proof chart-artifact/trawl-*.tgz \
            --set auth.database.existingSecret=fleet-db \
            --set storage.database.existingSecret=trawl-db --set web.enabled=false >/dev/null
          (cd chart-artifact && sha256sum ./*.tgz > SHA256SUMS)

      - name: Keep the exact validated chart
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-chart
          path: chart-artifact/
          if-no-files-found: error

  build-linux:
    needs: resolve-source
    uses: ./.github/workflows/linux-distribution.yml
    with:
      source-sha: ${{ needs.resolve-source.outputs.sha }}
      tooling-sha: ${{ github.sha }}
      release-tag: ${{ needs.resolve-source.outputs.tag }}

  build-macos:
    needs: resolve-source
    uses: ./.github/workflows/macos-cli.yml
    with:
      source-sha: ${{ needs.resolve-source.outputs.sha }}
      tooling-sha: ${{ github.sha }}
      release-tag: ${{ needs.resolve-source.outputs.tag }}

  build-docs:
    needs: resolve-source
    uses: ./.github/workflows/docs.yml
    with:
      source-sha: ${{ needs.resolve-source.outputs.sha }}
      release-tag: ${{ needs.resolve-source.outputs.tag }}

  release:
    name: github release
    needs: [resolve-source, docker, publish-helm]
    env:
      RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
    runs-on: k8s-small
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Download Debian packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.deb
            dist/**/*.sha256

  publish-docs:
    needs: [resolve-source, build-docs, release]
    runs-on: k8s-small
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation-site
          path: docs/dist
      - name: Deploy selected release documentation
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: docs/dist
          clean: true
          clean-exclude: |
            apt/
            gpg.key
            symbols/

  publish-apt:
    name: publish APT repository
    needs: [resolve-source, build-linux, release]
    env:
      RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
    runs-on: k8s-small
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Self-hosted runner image is minimal; apt-ftparchive lives in apt-utils,
      # dpkg-scanpackages in dpkg-dev, and gpg may not be preinstalled.
      - name: Install APT tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: gh-pages
          fetch-depth: 1
        continue-on-error: true
        id: checkout-pages

      - name: Initialize gh-pages branch
        if: steps.checkout-pages.outcome == 'failure'
        run: |
          git init
          git checkout --orphan gh-pages
          git commit --allow-empty -m "init: gh-pages branch"

      - name: Download .deb artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Only the .deb artifacts — without this filter download-artifact
          # also tries to fetch the buildx `.dockerbuild` build-record (and the
          # dist tarballs), and the dockerbuild artifact reliably fails to
          # download, wedging the whole APT publish.
          pattern: deb-*
          path: incoming
          merge-multiple: true

      - name: Download breakpad symbols
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # merge amd64 + arm64 stores into one tree; DEBUG_IDs differ per arch
          # so there are no path collisions.
          pattern: symbols-*
          path: symbols-incoming
          merge-multiple: true

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import || true
          gpg --list-secret-keys --keyid-format long | grep -q '^sec' \
            || { echo "::error::GPG secret key not found after import"; exit 1; }
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      # Publisher tooling belongs to the workflow revision, like the resolver.
      # Older product tags may predate it; product builds use the resolved tag commit.
      - name: Load APT index builder from workflow source
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git show "${WORKFLOW_SHA}:scripts/release/build-apt-index.py" > "$RUNNER_TEMP/build-apt-index.py"

      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/build-apt-index.py" incoming apt
          cd apt

          cd dists/stable
          cat > Release <<'RELEASE'
          Origin: Trawl
          Label: Trawl
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          RELEASE
          echo "Date: $(date -Ru)" >> Release
          sed -i 's/^[[:space:]]*//' Release
          apt-ftparchive release . >> Release

          gpg_key="$(gpg --list-secret-keys --keyid-format long 2>/dev/null \
            | grep '^sec' | head -1 | awk '{print $2}' | cut -d/ -f2)"
          gpg --batch --yes --default-key "${gpg_key}" --detach-sign --armor -o Release.gpg Release
          gpg --batch --yes --default-key "${gpg_key}" --clearsign -o InRelease Release
          cd "$GITHUB_WORKSPACE"

          gpg --batch --yes --armor --export "${gpg_key}" > gpg.key

      # Publish the breakpad symbol store at the gh-pages root so it serves at
      # https://trawl.sh/symbols/<module>/<DEBUG_ID>/<module>.sym — the URL
      # `minidump-stackwalk --symbols-url https://trawl.sh/symbols/` resolves
      # against. Merged into the existing tree (per-arch DEBUG_IDs don't clash);
      # the shared `git add -A` + commit + push below picks it up.
      - name: Publish breakpad symbols
        run: |
          set -euo pipefail
          mkdir -p symbols
          cp -a symbols-incoming/. symbols/
          find symbols -type f -name '*.sym' | sort

      - name: Clean up incoming artifacts
        run: rm -rf incoming symbols-incoming

      - name: Commit and push
        run: |
          git add -A
          git commit -m "apt: update repository for ${RELEASE_TAG}"
          git push origin gh-pages

  docker:
    name: container image
    outputs:
      image-tag: ${{ needs.build-chart.outputs.image-tag }}
    needs: [resolve-source, build-linux, build-macos, build-docs, build-chart]
    env:
      RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download Linux tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: dist-*-unknown-linux-gnu
          merge-multiple: true

      - name: Extract verified artifact layout by arch
        run: |
          for arch in amd64 arm64; do
            case $arch in
              amd64) target="x86_64-unknown-linux-gnu" ;;
              arm64) target="aarch64-unknown-linux-gnu" ;;
            esac
            mkdir -p "docker-ctx/$arch"
            tar xzf "dist/trawl-${RELEASE_TAG}-${target}.tar.gz" -C "docker-ctx/$arch" --strip-components=1
          done

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.build-chart.outputs.image-tags }}
          labels: ${{ needs.build-chart.outputs.image-labels }}

  publish-helm:
    name: publish validated Helm chart
    needs: [build-chart, docker]
    runs-on: k8s-small
    steps:
      - name: Download the validated chart artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-chart
          path: chart-artifact

      - name: Verify the chart bytes before publication
        run: (cd chart-artifact && sha256sum -c SHA256SUMS)

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Login to GHCR for Helm
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Publish the exact prebuilt chart
        run: helm push chart-artifact/trawl-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

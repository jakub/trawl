name: runner-probe

# Minimal probe to validate the self-hosted k8s-big scale set picks up
# jobs. Mirrors the shape of the fmt job (cheap, fast, no DuckDB) but
# targets k8s-big only. Delete this workflow once the scale set is
# confirmed serving jobs.

on:
  push:
    branches: [chore/ci-self-hosted-fmt]
  workflow_dispatch:

jobs:
  probe:
    name: probe k8s-big pickup
    runs-on: k8s-big
    steps:
      - name: Show runner identity
        run: |
          echo "hostname: $(hostname)"
          echo "uname: $(uname -a)"
          echo "whoami: $(whoami)"
          echo "runner name: ${RUNNER_NAME:-unset}"
          echo "runner os: ${RUNNER_OS:-unset}"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

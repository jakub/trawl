name: Crash-dump image

on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/release/build-distribution.sh
      - scripts/release/distribution.py
      - scripts/release/duckdb-runtime.json
      - scripts/release/duckdb-LICENSE
      - crates/trawl-core/build.rs
      - crates/trawl-core/build_support/**
      - crates/trawl-crashdump/**
      - crates/trawl-server/src/main.rs
      - Cargo.lock
      - .github/workflows/crashdump-image.yml
      - ci/crashdump-image.sh
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/release/build-distribution.sh
      - scripts/release/distribution.py
      - scripts/release/duckdb-runtime.json
      - scripts/release/duckdb-LICENSE
      - crates/trawl-core/build.rs
      - crates/trawl-core/build_support/**
      - crates/trawl-crashdump/**
      - crates/trawl-server/src/main.rs
      - Cargo.lock
      - .github/workflows/crashdump-image.yml
      - ci/crashdump-image.sh

# Each push to main gets its own group, so every merge gets a
# verdict (a shared group would still cancel a pending main run; see ci.yml).
concurrency:
  group: crashdump-image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crash-dump-image:
    name: capability transition + readiness verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu, wasm32-unknown-unknown

      # Own cache entry, so this job neither evicts nor is evicted by
      # release-<target>.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: crashdump-amd64-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # zig is here because the glibc floor (.2.31) is what the shipped image
      # is built against, and cargo-zigbuild is how the workspace sets it.
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        # No zig cache: its key contains the run id, so each job saved a new
        # ~20 MB entry every run that only crowded the rust caches out of the
        # repository's 10 GB.
        with:
          use-cache: false

      - uses: taiki-e/install-action@d858f8113943481093e02986a7586a4819a3bfd6 # v2
        with:
          tool: cargo-zigbuild,trunk,wasm-bindgen-cli

      # The SPA has to exist before trawl-web compiles: rust-embed bakes dist/
      # into the binary at build time. Same ordering as release.yml.
      - name: Build web UI SPA
        working-directory: crates/trawl-web-ui
        run: trunk build --release
      - name: Precompress SPA + enforce wire-size budgets
        run: cargo xtask compress-web

      - name: Build the image binaries
        run: |
          bash scripts/release/build-distribution.sh "$PWD" x86_64-unknown-linux-gnu "$PWD/runtime" --image-only

      - name: Stage image binaries and shared runtime
        run: |
          python3 scripts/release/distribution.py stage --source . \
            --binaries target/x86_64-unknown-linux-gnu/release --runtime runtime \
            --output docker-ctx/amd64 --target x86_64-unknown-linux-gnu --image-only \
            --source-sha "$(git rev-parse HEAD)" --tooling-sha "$(git rev-parse HEAD)"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The image has to land in the local docker store because the proof below
      # runs containers from it.
      - name: Build the image
        run: docker build --platform linux/amd64 --load -t trawl-crashdump-ci:${{ github.sha }} .

      - name: Prove the capability transition and the verdict
        run: bash ci/crashdump-image.sh trawl-crashdump-ci:${{ github.sha }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: crashdump-image-logs
          path: crashdump-ci-logs/
          retention-days: 7
          if-no-files-found: warn

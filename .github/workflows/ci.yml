name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
      # Force build script re-run so it re-downloads the prebuilt library.
      # rust-cache cleans non-standard target dirs (including duckdb-download/)
      # but preserves stale build script output, causing linker failures.
      - run: cargo clean -p libduckdb-sys 2>/dev/null || true
      - run: cargo clippy --workspace --all-targets --no-default-features
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

  test:
    name: test
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
      - run: cargo clean -p libduckdb-sys 2>/dev/null || true
      - run: cargo nextest run --workspace --no-default-features
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

  fleet-auth-tests:
    # Postgres-backed integration tests for fleet-auth's KeyStore.
    # Each test creates and drops an ephemeral per-test database, so the
    # role must have CREATEDB. CI uses a throwaway postgres:18 container
    # (the default `postgres` superuser has CREATEDB); local-dev and the
    # homelab dev/prod environments use CNPG.
    name: fleet-auth (postgres)
    runs-on: k8s-big
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: fleet-auth-tests
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
        with:
          tool: nextest
      - run: cargo nextest run -p fleet-auth --features "fast-hash,axum"
        env:
          FLEET_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Hard-fail if the env var didn't inject — otherwise the per-test
          # PgFixture would skip every integration test and the job would
          # report a misleading green.
          FLEET_TESTS_REQUIRED: "1"

  msrv:
    name: msrv check
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@98e1b82157cd469e843cb7f524c1313b4ad9492c # 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv
      - run: cargo clean -p libduckdb-sys 2>/dev/null || true
      - run: cargo check --workspace --no-default-features
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

  deny:
    name: cargo-deny
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Binary install instead of EmbarkStudios/cargo-deny-action because
      # that action is Docker-based and k8s-small is unprivileged (no dind).
      # cargo-deny shells out to `cargo metadata`, so we need a toolchain.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # cargo-deny
        with:
          tool: cargo-deny
      - run: cargo deny check

  wasm-check:
    name: wasm32 check (web UI)
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wasm-check
      - run: cargo check -p trawl-web-ui --target wasm32-unknown-unknown

  vendor-drift:
    name: web UI vendor bundle drift
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
      - name: Rebuild vendor bundles
        working-directory: crates/trawl-web-ui/vendor
        run: bash build.sh
      - name: Fail if committed bundles drifted
        run: |
          git diff --exit-code \
            crates/trawl-web-ui/vendor/codemirror.js \
            crates/trawl-web-ui/vendor/uplot.js \
            crates/trawl-web-ui/vendor/uplot.css

  trunk-build:
    name: web UI release build (trunk)
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trunk-build
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      - name: Build SPA
        working-directory: crates/trawl-web-ui
        run: trunk build --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist/
          retention-days: 7

  trawl-web-tests:
    name: trawl-web tests
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-tests
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
        with:
          tool: nextest
      - run: cargo nextest run -p trawl-web

  trawl-web-release:
    name: trawl-web release build (SPA embedded)
    runs-on: k8s-big
    needs: trunk-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-release
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist
      - name: Verify SPA was baked in
        run: test -f crates/trawl-web-ui/dist/index.html
      - run: cargo build --release -p trawl-web

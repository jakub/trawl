name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  helm-template:
    name: helm template
    runs-on: k8s-small
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: bash chart/trawl/tests/render.sh

  fmt:
    name: rustfmt
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
      # Force build script re-run so it re-downloads the prebuilt library.
      # rust-cache cleans non-standard target dirs (including duckdb-download/)
      # but preserves stale build script output, causing linker failures.
      - run: cargo clean -p libduckdb-sys 2>/dev/null || true
      - run: cargo clippy --workspace --all-targets --no-default-features
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

  test:
    # The single workspace test job. Postgres backs the pg-based integration
    # tests in fleet-auth, fleet-admin, AND trawl-server: every pg test runs
    # under #[sqlx::test] (per-test ephemeral database off DATABASE_URL, so
    # the role must have CREATEDB), and trawl-server's harness additionally
    # creates a sibling trawl app-state database that trawld's real boot
    # path migrates. CI uses a throwaway postgres:18 container (the default
    # `postgres` superuser has CREATEDB); local-dev and the homelab dev/prod
    # environments use CNPG. An explicit `fleet-admin migrate` step (below)
    # applies the embedded fleet schema to the service container — it spells
    # out the migration step and exercises the exact deploy-time command the
    # helm init container runs. The trawl app-state database needs no CI
    # migrate step: trawld auto-migrates it at boot (sole writer).
    #
    # Connection budget: nextest is process-per-test and sqlx pools are
    # process-local, so unbounded parallelism can exceed the server's
    # max_connections (default 100 — GH service containers can't override
    # the postgres command line). The `pg` nextest group in
    # .config/nextest.toml bounds pg-heavy test parallelism instead.
    name: test
    runs-on: k8s-big
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
      - run: cargo clean -p libduckdb-sys 2>/dev/null || true
      # Explicit migration step: run the operational `fleet-admin migrate`
      # command against the service container. Spells out AC10's migration
      # step and exercises the exact deploy-time command the helm init
      # container runs (AC11) against a live postgres. fleet-admin has no
      # duckdb dependency, so no DUCKDB_DOWNLOAD_LIB is needed here.
      - name: Apply fleet-auth schema migrations
        run: cargo run -p fleet-admin -- migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # FEATURE TRAP: --no-default-features also strips fleet-auth's default
      # `keystore` feature when it is built as a selected workspace package,
      # silently compiling out its pg test files. The explicit fleet-auth/*
      # features below re-enable them deterministically. Do NOT drop them.
      # There is no skip mode: #[sqlx::test] panics loudly when DATABASE_URL
      # is unset or unreachable, so "pg tests silently skipped" cannot
      # produce a misleading green (the FLEET_TESTS_REQUIRED backstop died
      # with the PgFixture in ADR-0004 slice 3 / issue #12).
      - run: >-
          cargo nextest run --workspace --no-default-features
          --features fleet-auth/keystore,fleet-auth/axum,fleet-auth/fast-hash
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
          # DATABASE_URL, not FLEET_DATABASE_URL: trawld's [auth] resolution
          # treats FLEET_DATABASE_URL as its highest-precedence keystore
          # override (ADR-0004 slice 3), so setting it process-wide would
          # silently repoint every fixture's per-test keystore DSN at the
          # shared service container. The #[sqlx::test] harness hardwires
          # DATABASE_URL.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Smoke-test downloaded DuckDB development launcher
        run: |
          cargo build -p trawl-server --no-default-features
          bin/trawld-dev --version
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

  msrv:
    name: msrv check
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv
      - run: cargo clean -p libduckdb-sys 2>/dev/null || true
      - run: cargo check --workspace --no-default-features
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

  deny:
    name: cargo-deny
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Binary install instead of EmbarkStudios/cargo-deny-action because
      # that action is Docker-based and k8s-small is unprivileged (no dind).
      # cargo-deny shells out to `cargo metadata`, so we need a toolchain.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # cargo-deny
        with:
          tool: cargo-deny
      - run: cargo deny check

  wasm-check:
    name: wasm32 check (web UI + fleet-ui)
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wasm-check
      - run: cargo check -p trawl-web-ui --target wasm32-unknown-unknown
      # Both sides of the default-off `atmosphere` feature: the bare run is
      # the shape non-mounting consumers compile (and the one that must NOT
      # link the vendored snippet), the second covers the backdrop itself.
      - run: cargo check -p fleet-ui --target wasm32-unknown-unknown
      - run: cargo check -p fleet-ui --target wasm32-unknown-unknown --features atmosphere

  vendor-drift:
    name: web UI vendor bundle drift
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
      - name: Rebuild vendor bundles
        working-directory: crates/trawl-web-ui/vendor
        run: bash build.sh
      - name: Rebuild fleet-ui vendor bundle
        working-directory: crates/fleet-ui/vendor
        run: bash build.sh
      - name: Fail if committed bundles drifted
        run: |
          git diff --exit-code \
            crates/trawl-web-ui/vendor/codemirror.js \
            crates/trawl-web-ui/vendor/uplot.js \
            crates/trawl-web-ui/vendor/uplot.css \
            crates/fleet-ui/vendor/paper-shaders.js

  trunk-build:
    name: web UI release build (trunk)
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trunk-build
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      # The SPA mounts Atmosphere on /login (dep-level `atmosphere` feature,
      # ADR-0012), so exactly one emitted shader snippet must ship — zero
      # means the feature fell off (the mount would be a compile error, but
      # the emission path is wasm-bindgen's, so pin it), more than one means
      # stale staging leaked into dist.
      - name: Build SPA
        working-directory: crates/trawl-web-ui
        run: |
          # wasm-bindgen appends to its output dir and never prunes it, and
          # rust-cache restores that dir — so an orphaned snippet from an
          # earlier build would be copied into dist and miscount below.
          # Purge the staging snippets so the assertion sees only what THIS
          # build emitted.
          rm -rf ../../target/wasm-bindgen/release/snippets
          trunk build --release
          count=$(ls dist/snippets/fleet-ui-*/vendor/paper-shaders.js 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one fleet-ui shader snippet in trawl-web-ui dist, found $count (ADR-0012)"
            exit 1
          fi
      # The workbench is the only wasm-target build of the Atmosphere
      # backdrop (it opts in via `data-cargo-features` in index.html).
      # wasm-bindgen inlines `module = "/vendor/paper-shaders.js"` as a
      # compile-time snippet, so a missing bundle already fails the build;
      # the assertion pins the emission path the generated shim imports
      # (ADR-0012).
      - name: Build fleet-ui workbench
        working-directory: crates/fleet-ui
        run: |
          trunk build
          test -f dist/snippets/*/vendor/paper-shaders.js
      - name: Precompress SPA + enforce wire-size budgets
        run: cargo xtask compress-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist/
          retention-days: 7

  trawl-web-tests:
    name: trawl-web tests
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-tests
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
        with:
          tool: nextest
      - run: cargo nextest run -p trawl-web

  trawl-web-release:
    name: trawl-web release build (SPA embedded)
    runs-on: k8s-big
    needs: trunk-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-release
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist
      - name: Verify SPA was baked in
        run: test -f crates/trawl-web-ui/dist/index.html
      - run: cargo build --release -p trawl-web

  web-ui-e2e:
    name: web UI browser tests (playwright)
    runs-on: k8s-small
    needs: trunk-build
    timeout-minutes: 10
    # This job executes third-party code (npm packages, a CDN-fetched
    # browser): read-only token, and no credentials persisted into
    # .git/config for that code to read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/trawl-web-ui/e2e/package-lock.json
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist
      - name: Verify dist artifact
        run: test -f crates/trawl-web-ui/dist/index.html
      - run: npm ci --no-audit --no-fund
        working-directory: crates/trawl-web-ui/e2e
      # The browser binary cache is keyed on the lockfile: bumping
      # @playwright/test invalidates it, so the installed Chromium always
      # matches the pinned package version.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/trawl-web-ui/e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: crates/trawl-web-ui/e2e
      # retries=0 lives in playwright.config.ts (flake policy: fix or
      # quarantine loudly, never retry past it).
      - run: npm run test
        working-directory: crates/trawl-web-ui/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-traces
          path: crates/trawl-web-ui/e2e/test-results/
          retention-days: 7

  fuzz-smoke:
    name: pin-aware fuzz smoke (parse_emit)
    # A bounded gating run of the pin-aware parse/emit fuzz target: parse
    # arbitrary DSL, invent a catalog pin for every field it binds, emit SQL
    # under those pins, and assert the differential oracle in the target.
    # It links no DuckDB and needs no postgres, so the small runner is
    # enough and ten minutes is generous (the measured run is ~25s of build
    # plus ~10s of fuzzing).
    runs-on: k8s-small
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Pinned by DATE. cargo-fuzz needs a nightly compiler (-Zsanitizer),
      # and a floating `nightly` is the one input that can redden a merge
      # gate with no code change in the PR: a compiler published overnight
      # can add a lint, change a codegen flag or break libfuzzer-sys, and
      # the failure lands on whoever opens a PR that morning. Bump this
      # line deliberately, on its own, so the bump is what gets reviewed.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: nightly-2026-08-24
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Its own key and its own workspace: a different compiler, a
          # different RUSTFLAGS (see below) and a different target dir than
          # every stable job here, so sharing a key would make the two sides
          # evict each other's artifacts on every run.
          shared-key: fuzz-smoke
          workspaces: crates/trawl-core/fuzz
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # cargo-fuzz
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz parse_emit
        working-directory: crates/trawl-core
        env:
          # RUSTFLAGS is overridden, and this is not cosmetic. The
          # workflow-level `RUSTFLAGS: -D warnings` is inherited by every
          # job, cargo-fuzz APPENDS its sanitizer flags to whatever it
          # inherits, and nightly 1.100 deprecates
          # `AtomicU64::fetch_update` (renamed `try_update`), which
          # crates/trawl-core/src/stream.rs uses. So the inherited flag
          # turns that warning into an error and the fuzz build dies before
          # a single input runs. Renaming the method is NOT the fix:
          # `try_update` does not exist on stable 1.98, so adopting it would
          # break every other job in this file. The deprecation is
          # unresolvable until the MSRV moves, and until then this job
          # compiles trawl-core without `-D warnings`. The stable clippy job
          # is what actually gates warnings.
          RUSTFLAGS: ""
        run: |
          # A writable scratch corpus FIRST, the committed inputs after:
          # libFuzzer writes new coverage-increasing units into the first
          # directory only, so the committed seeds and the parse corpus stay
          # read-only and CI never produces a dirty tree.
          mkdir -p "$RUNNER_TEMP/corpus"
          # -runs counts corpus REPLAY first, and the committed inputs are
          # 3842 parse-corpus files plus 6 seeds. Measured here: libFuzzer
          # reaches `#3849 INITED` before it mutates anything, so any -runs
          # below ~3850 is a load test wearing a fuzzing costume: it exits
          # 0 having explored nothing new. 25000 leaves ~21k mutation runs
          # (measured: 628 new coverage units, ~3100 exec/s, ~8s), roughly
          # 5.5x the replay floor. Raise it freely; never lower it below the
          # floor, or the job stops fuzzing without ever going red.
          #
          # -seed=114 is deliberate. libFuzzer's mutation sequence is a pure
          # function of (seed, binary, corpus), so a gating job stays
          # reproducible: a new crash means THIS PR made a previously
          # explored path panic, rather than the job being a lottery that
          # reddens an unrelated PR and goes green on re-run.
          #
          # The input paths are relative to THIS step's working directory,
          # crates/trawl-core: cargo-fuzz does not chdir into fuzz/ before
          # exec'ing the target, so `seeds/parse_emit` would resolve to
          # nothing and libFuzzer exits 1 with "No such file or directory"
          # (verified, not assumed).
          cargo +nightly-2026-08-24 fuzz run parse_emit \
            "$RUNNER_TEMP/corpus" fuzz/seeds/parse_emit fuzz/corpus/parse \
            -- -runs=25000 -seed=114 -max_len=65536 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1
      # A crash must arrive with the input that reproduces it, because the
      # bytes are the whole bug report. `if: failure()` only, so this never
      # affects job status; the job fails on the fuzzer's nonzero exit and
      # on nothing else.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-parse-emit-artifacts
          path: crates/trawl-core/fuzz/artifacts/
          retention-days: 7
          if-no-files-found: ignore

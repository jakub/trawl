name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels its older run. Each push to main gets
# its own group, so no main run is ever cancelled: a merge landing shortly
# after another would otherwise leave the first merge with no verdict, and
# rust-cache saves only from a finished main run. A shared group would not
# do, even without cancel-in-progress: GitHub keeps one pending run per
# group and cancels the older pending one when a third arrives.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Every job runs on a GitHub-hosted runner, and they share the repository's
# 10 GB Actions cache. Each rust-cache step below saves only on main: pull
# requests restore main's entries and never evict them with per-PR copies.
# Jobs that compile the same thing share a key.
#
# Each job's timeout-minutes is two to three times its slowest normal run,
# so a hung job fails in minutes instead of GitHub's six-hour default.

jobs:
  changes:
    # Decides which path-gated jobs this run needs; see ci/changed-scopes.py.
    # A push to main runs every job, so main stays fully verified and keeps
    # the caches that pull requests restore warm.
    name: changed scopes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web_mutations: ${{ steps.scopes.outputs.web_mutations }}
      server_mutations: ${{ steps.scopes.outputs.server_mutations }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, and HEAD^1 is the
          # base it merges into, so HEAD^1..HEAD is exactly what the PR adds.
          fetch-depth: 2
      - run: python3 -m unittest ci/test_changed_scopes.py
      - id: scopes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 ci/changed-scopes.py HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            python3 ci/changed-scopes.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  repo-checks:
    # Seven checks that each do under a minute of work, run as steps of one
    # job. As separate jobs, each paid for its own runner, checkout and tool
    # setup, and took one of the account's 40 concurrent job slots; a pull
    # request that touches crates starts about 30 jobs at once. Every check
    # step runs even when an earlier one fails (`!cancelled()`), and each has
    # its own timeout, so one hung check cannot hide the others' results.
    name: repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # openssl for the collector TLS fixtures, dpkg-dev for the release
      # source tests' Debian package checks.
      - name: Install Debian test tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssl dpkg-dev
      # The release source tests compile the actual Cargo helper, then exercise
      # its target and integrity boundaries with cached fixtures and no
      # downloader on PATH. cargo-deny shells out to `cargo metadata`.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          components: rustfmt
      # Binary install instead of EmbarkStudios/cargo-deny-action, which is a
      # Docker container action; install-action is already pinned here.
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # cargo-deny
        with:
          tool: cargo-deny
      # Publication DAG tests use Helm's YAML parser, avoiding another YAML
      # dependency, and the chart render test runs Helm itself.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
      - name: Install checksum-verified promtool 3.14.0 (CI only)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/prometheus-3.14.0.linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz \
            --output "$archive"
          echo "f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" prometheus-3.14.0.linux-amd64/promtool

      - name: rustfmt
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: cargo fmt --all --check
      - name: cargo-deny
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: cargo deny check
      - name: deb crash-dump packaging assertions
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash crates/trawl-server/debian/tests/packaging.sh
      - name: release source resolution
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      # render.sh finishes in about a minute.
      - name: helm template
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash chart/trawl/tests/render.sh
        env:
          PROMTOOL: ${{ runner.temp }}/prometheus-3.14.0.linux-amd64/promtool
      - name: Vector collector delivery (Debian collector with Vector 0.57.0)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          curl --fail --location --retry 3 \
            https://github.com/vectordotdev/vector/releases/download/v0.57.0/vector-0.57.0-x86_64-unknown-linux-gnu.tar.gz \
            --output "$fixture_dir/vector.tar.gz"
          echo "4d156e6859e235b366f5b77121ae59d5440c93acab215c45f30f3fc839d20f65  $fixture_dir/vector.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/vector.tar.gz" -C "$fixture_dir"
          VECTOR_BIN="$fixture_dir/vector-x86_64-unknown-linux-gnu/bin/vector" \
            python3 scripts/test-vector-collector.py
      # Last, because the rebuild writes node_modules into the vendor
      # directories, which the checks above never expect to see.
      - name: web UI vendor bundle drift
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          (cd crates/trawl-web-ui/vendor && bash build.sh)
          (cd crates/fleet-ui/vendor && bash build.sh)
          git diff --exit-code \
            crates/trawl-web-ui/vendor/codemirror.js \
            crates/trawl-web-ui/vendor/uplot.js \
            crates/trawl-web-ui/vendor/uplot.css \
            crates/fleet-ui/vendor/paper-shaders.js

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --no-default-features

  test-build:
    # The workspace tests run in three stages so that neither compiling nor
    # testing waits for the other's leftovers:
    #   test-build   compiles every test binary once and archives them;
    #   test (N/3)   three jobs, each extracting that archive beside a fresh
    #                checkout and running one slice of the tests against its
    #                own postgres;
    #   test-guards  runs, beside the other two, the checks that need a cargo
    #                build but no test results: fleet-admin migrate, the
    #                postgres admission guard and the DuckDB launcher smoke.
    # One job used to do all of it: 3m29s of warm compile, then 5m29s of
    # tests on four threads, then 49s of guard, on the critical path.
    #
    # Every compile-time path the tests bake in with env!() (CARGO_MANIFEST_DIR,
    # CARGO_BIN_EXE_*, CARGO) points into /home/runner/work/trawl/trawl, the
    # same checkout path on every hosted runner. The test jobs extract the
    # archive into that checkout, so target/ lands where the binaries expect.
    name: test build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The linker skips the DWARF: it stays in .dwo files beside the
      # objects instead of being copied into each of about 130 test
      # binaries. The debuginfo level stays full, so the generated code and
      # its stack frames are unchanged. Keep it full: trawl-core's 2 MiB
      # parser stack test is calibrated against the unoptimized,
      # full-debuginfo build (crates/trawl-core/src/parser/mod.rs), and CI
      # is the only place that build runs. The archive carries the binaries
      # but not the .dwo files, so a backtrace in a test job names functions
      # without file and line.
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # nextest is pinned by VERSION, not just by the action sha: the action
      # manifest at this sha ships 0.9.132, whose filterset grammar predates
      # the `group()` predicate pg-admission-guard queries with -- the guard
      # step failed on every run while local 0.9.143 parsed it fine. Pin the
      # version the local gates validate.
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079
        with:
          tool: nextest@0.9.143
      # FEATURE TRAP: --no-default-features also strips fleet-auth's default
      # `keystore` feature when it is built as a selected workspace package,
      # silently compiling out its pg test files. The explicit fleet-auth/*
      # features below re-enable them deterministically. Do NOT drop them.
      # test-guards builds with the same selection. The archive records it,
      # so the test jobs cannot run a different one.
      - name: Build and archive the test binaries
        run: >-
          cargo nextest archive --workspace --no-default-features
          --features fleet-auth/keystore,fleet-auth/axum,fleet-auth/fast-hash
          --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      - name: Disk and archive size
        run: df -h / && ls -l "$RUNNER_TEMP/nextest-archive.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          # Already zstd; a second compression pass only costs time.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test:
    # Postgres backs the pg-based integration tests in fleet-auth,
    # fleet-admin, AND trawl-server: every pg test runs under #[sqlx::test]
    # (per-test ephemeral database off DATABASE_URL, so the role must have
    # CREATEDB), and trawl-server's harness additionally creates a sibling
    # trawl app-state database that trawld's real boot path migrates. CI
    # uses a throwaway postgres:18 container (the default `postgres`
    # superuser has CREATEDB); local-dev and the homelab dev/prod
    # environments use CNPG. No test reads the service's own `postgres`
    # database, so the migration of it runs in test-guards.
    #
    # Connection budget: nextest is process-per-test and sqlx pools are
    # process-local, so unbounded parallelism can exceed the server's
    # max_connections (default 100 — GH service containers can't override
    # the postgres command line). The `postgres` nextest group in
    # .config/nextest.toml bounds pg-heavy test parallelism instead, and
    # the admission guard in test-guards proves nothing escaped it. Each
    # slice has its own server, so the budget holds per job.
    name: test (${{ matrix.partition }}/3)
    runs-on: ubuntu-24.04
    needs: test-build
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Every slice reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # tmpfs data directory, as in docker-compose.dev.yml. The health
        # check asks over TCP: the image's init-time server listens only on
        # the unix socket and is stopped before the real one starts.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Turn off postgres durability
        run: ci/postgres-no-durability.sh ${{ job.services.postgres.id }}
      # Exercise real chart rendering in trawl-config's and trawl-web's
      # packaging contracts.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      # build_provenance.rs runs the cargo that compiled it, at the path
      # env!("CARGO") baked in, so the same toolchain must be installed here.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      # Same pinned nextest as test-build, for the same filterset reason.
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079
        with:
          tool: nextest@0.9.143
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # trawld_doctor's doctor_writes_nothing and doctor_root_run_is_incomplete
      # run the doctor as root in an unprivileged user namespace. Ubuntu
      # 24.04's AppArmor leaves such a namespace without capabilities, so
      # lift that restriction for this job; the key is absent where AppArmor
      # does not restrict user namespaces.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # slice:N/3 deals the tests out one at a time in order, so each job
      # gets a similar share of the slow postgres tests.
      - name: Run test slice ${{ matrix.partition }}/3
        run: >-
          cargo nextest run
          --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
          --workspace-remap . --extract-to .
          --partition slice:${{ matrix.partition }}/3
        env:
          # DATABASE_URL, not FLEET_DATABASE_URL: trawld's [auth] resolution
          # treats FLEET_DATABASE_URL as its highest-precedence keystore
          # override (ADR-0004 slice 3), so setting it process-wide would
          # silently repoint every fixture's per-test keystore DSN at the
          # shared service container. The #[sqlx::test] harness hardwires
          # DATABASE_URL. There is no skip mode: #[sqlx::test] panics loudly
          # when DATABASE_URL is unset or unreachable, so "pg tests silently
          # skipped" cannot produce a misleading green (the
          # FLEET_TESTS_REQUIRED backstop died with the PgFixture in ADR-0004
          # slice 3 / issue #12).
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # A doctor test that needs a user namespace fails here instead of
          # printing SKIPPED, so a skip is never counted as a pass.
          TRAWL_TEST_REQUIRE_USERNS: "1"

  test-guards:
    # Checks that need the workspace test build but no test results, run
    # beside test-build and the test slices instead of after them. This job
    # compiles the same test binaries again from the same cache, which costs
    # runner time but no wall time.
    name: test guards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Same build settings as test-build, so both restore one cache key and
      # the nested cargo in pg-admission-guard builds what test-build does.
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      # test-build owns the cache and saves it; this job only reads it.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
          save-if: false
      # Same pinned nextest as test-build, for the same filterset reason.
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079
        with:
          tool: nextest@0.9.143
      # Explicit migration step: run the operational `fleet-admin migrate`
      # command against the service container. Spells out AC10's migration
      # step and exercises the exact deploy-time command the helm init
      # container runs (AC11) against a live postgres. The trawl app-state
      # database needs no CI migrate step: trawld auto-migrates it at boot
      # (sole writer).
      - name: Apply fleet-auth schema migrations
        run: cargo run -p fleet-admin -- migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Membership in the `postgres` group is hand-written in
      # .config/nextest.toml; this recomputes it from the sources and fails
      # if a pg-touching test runs outside the group. Same feature selection
      # as test-build, because a feature can compile a pg test file out.
      - name: Guard the postgres admission group
        if: ${{ !cancelled() }}
        run: >-
          cargo xtask pg-admission-guard --
          --no-default-features
          --features fleet-auth/keystore,fleet-auth/axum,fleet-auth/fast-hash
      # The launcher runs whatever target/debug/trawld exists, and the guard
      # above already built it, so this proves the loader path without a
      # second trawld build in another feature set (about a minute).
      - name: Smoke-test verified DuckDB development launcher
        if: ${{ !cancelled() }}
        run: bin/trawld-dev --version

  server-mutations:
    # Each crates/trawl-server/mutations/*.patch removes one guard. The
    # script runs every patch's tests on the pristine tree first (the
    # control), then applies each patch, requires nextest exit 100 (a
    # kill), and reverts it. A build failure or a filter that matches no
    # test fails the job; it never counts as a kill. The nets patch boots
    # real servers, hence the same postgres service and DATABASE_URL as
    # the test job. The workflow-level RUSTFLAGS makes every mutant compile
    # under -D warnings.
    # It skips when the pull request cannot change what trawl-server
    # compiles or how nextest runs it (ci/changed-scopes.py).
    name: Server guard mutations
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.server_mutations == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Each mutant relinks the trawl-server test binaries; see `test`.
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # tmpfs data directory, as in docker-compose.dev.yml. The health
        # check asks over TCP: the image's init-time server listens only on
        # the unix socket and is stopped before the real one starts.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Turn off postgres durability
        run: ci/postgres-no-durability.sh ${{ job.services.postgres.id }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: server-mutations
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same pinned nextest as the test job, for the same filterset reason.
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079
        with:
          tool: nextest@0.9.143
      - name: Kill the server guard mutations
        run: crates/trawl-server/mutations/mutation-check.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  msrv:
    name: msrv check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --no-default-features

  wasm-check:
    name: wasm32 clippy (web UI + fleet-ui)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wasm-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p trawl-web-ui --target wasm32-unknown-unknown
      # Both sides of the default-off `atmosphere` feature: the bare run is
      # the shape non-mounting consumers compile (and the one that must NOT
      # link the vendored snippet), the second covers the backdrop itself.
      - run: cargo clippy -p fleet-ui --target wasm32-unknown-unknown
      - run: cargo clippy -p fleet-ui --target wasm32-unknown-unknown --features atmosphere

  trunk-build:
    name: web UI release build (trunk)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trunk-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      # The SPA mounts Atmosphere on /login (dep-level `atmosphere` feature,
      # ADR-0012), so exactly one emitted shader snippet must ship — zero
      # means the feature fell off (the mount would be a compile error, but
      # the emission path is wasm-bindgen's, so pin it), more than one means
      # stale staging leaked into dist.
      - name: Build SPA
        working-directory: crates/trawl-web-ui
        run: |
          # wasm-bindgen appends to its output dir and never prunes it, and
          # rust-cache restores that dir — so an orphaned snippet from an
          # earlier build would be copied into dist and miscount below.
          # Purge the staging snippets so the assertion sees only what THIS
          # build emitted.
          rm -rf ../../target/wasm-bindgen/release/snippets
          trunk build --release
          count=$(ls dist/snippets/fleet-ui-*/vendor/paper-shaders.js 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one fleet-ui shader snippet in trawl-web-ui dist, found $count (ADR-0012)"
            exit 1
          fi
      # The workbench is the only wasm-target build of the Atmosphere
      # backdrop (it opts in via `data-cargo-features` in index.html).
      # wasm-bindgen inlines `module = "/vendor/paper-shaders.js"` as a
      # compile-time snippet, so a missing bundle already fails the build;
      # the assertion pins the emission path the generated shim imports
      # (ADR-0012).
      - name: Build fleet-ui workbench
        working-directory: crates/fleet-ui
        run: |
          trunk build
          test -f dist/snippets/*/vendor/paper-shaders.js
      - name: Precompress SPA + enforce wire-size budgets
        run: cargo xtask compress-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-ui-workbench-dist
          path: crates/fleet-ui/dist/
          retention-days: 7

  trawl-web-tests:
    name: trawl-web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # See `test`.
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Exercise real chart rendering in the packaging contract tests.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
        with:
          tool: nextest@0.9.143
      - run: cargo nextest run -p trawl-web

  trawl-web-release:
    name: trawl-web release build (SPA embedded)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: trunk-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist
      - name: Verify SPA was baked in
        run: test -f crates/trawl-web-ui/dist/index.html
      - run: cargo build --release -p trawl-web

  web-ui-mutations:
    # Each patch in crates/trawl-web-ui/e2e/mutations plants one regression.
    # mutation-check.sh builds each mutant SPA, requires its target spec to
    # fail and its routing control to pass, then reverts. A kill only counts
    # next to a green baseline on the same commit, and the workflow gives
    # that by requiring web-ui-e2e too. Two legs of six patches each run in
    # parallel. Each leg builds its own debug (wasm-dev) SPAs, so neither
    # waits on trunk-build. The legs skip when the pull request cannot
    # change what the SPA compiles (ci/changed-scopes.py).
    name: web UI mutations (${{ matrix.set }})
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.web_mutations == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: overlays, Health, pagination
            patches: >-
              17-range-dialog-no-layer.patch
              23-range-close-on-refusal.patch
              24-palette-overlay-gate.patch
              25-palette-toggle.patch
              20-health-admin-gate.patch
              22-runs-filtered-window.patch
          - set: search, live, schedules
            patches: >-
              26-save-editor-snapshot.patch
              27-stop-live-replace.patch
              28-live-snapshot-query.patch
              29-schedule-lag-leak.patch
              30-preview-known-total.patch
              32-rail-choice-from-toggle.patch
    # Six apply/build/run cycles after browser and package setup.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: web-mutations
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/trawl-web-ui/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: crates/trawl-web-ui/e2e
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/trawl-web-ui/e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: crates/trawl-web-ui/e2e
      - name: Validate Save mutation report attribution
        if: contains(matrix.patches, '26-save-editor-snapshot.patch')
        run: node --test crates/trawl-web-ui/e2e/scripts/check-save-mutation.test.mjs
      # NO_COLOR is unset because Trunk parses it as a boolean and rejects an
      # inherited value of 1.
      - name: Kill the mutations
        env:
          PATCHES: ${{ matrix.patches }}
        run: |
          read -ra patch_files <<<"$PATCHES"
          env -u NO_COLOR crates/trawl-web-ui/e2e/scripts/mutation-check.sh "${patch_files[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: web-ui-mutations-${{ strategy.job-index }}
          path: e2e-artifacts/mutations/
          retention-days: 7

  web-ui-e2e:
    name: web UI browser tests (playwright ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: trunk-build
    # CI runs one worker per job (see playwright.config.ts), so the suite
    # is split across jobs instead, each with its own stub server.
    # fullyParallel lets the split fall between tests of one file. fail-fast is off so one red shard still lets
    # the others report their results.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Include package installation, both bounded browser suites and evidence upload.
    timeout-minutes: 40
    # This job executes third-party code (npm packages, a CDN-fetched
    # browser): read-only token, and no credentials persisted into
    # .git/config for that code to read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/trawl-web-ui/e2e/package-lock.json
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist
      - name: Verify dist artifact
        run: test -f crates/trawl-web-ui/dist/index.html
      - run: npm ci --no-audit --no-fund
        working-directory: crates/trawl-web-ui/e2e
      # The browser binary cache is keyed on the lockfile: bumping
      # @playwright/test invalidates it, so the installed Chromium always
      # matches the pinned package version.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/trawl-web-ui/e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: crates/trawl-web-ui/e2e
      # retries=0 lives in playwright.config.ts (flake policy: fix or
      # quarantine loudly, never retry past it).
      # A shard runs about a quarter of the suite. The aggregate bound keeps
      # the full-suite headroom, so an unbalanced shard on a busy shared
      # runner is not cut off. Per-test timeouts stay unchanged.
      - run: npm run test -- --shard=${{ matrix.shard }}/4 --global-timeout=1500000
        working-directory: crates/trawl-web-ui/e2e
        env:
          # Preserve browser process exits and stderr alongside test results.
          DEBUG: pw:browser
      - name: Authentication history restores with BFCache enabled
        if: matrix.shard == 1
        run: npm run test -- --config=playwright.bfcache.config.ts --global-timeout=300000
        working-directory: crates/trawl-web-ui/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.shard == 1
        with:
          name: auth-bfcache-evidence
          path: |
            e2e-artifacts/bfcache/
            e2e-artifacts/bfcache-report/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: e2e-artifacts/test-results/
          retention-days: 7

      # Only the shard that runs theme-preference.spec.ts writes captures.
      # The theme-menu-captures job fails when no shard uploaded any.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: theme-menu-captures-${{ matrix.shard }}
          path: e2e-artifacts/test-results/**/system-*.png
          if-no-files-found: ignore
          retention-days: 30

  theme-menu-captures:
    name: theme menu captures
    runs-on: ubuntu-24.04
    needs: web-ui-e2e
    # Runs even when a shard fails, so a missing capture is reported next to
    # the failure. It only reads the shards' artifacts and uploads nothing,
    # so a re-run of failed jobs repeats the same check without an artifact
    # name conflict.
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          pattern: theme-menu-captures-*
          path: theme-menu-captures
          merge-multiple: true
      - name: Require the selected-System captures
        run: |
          find theme-menu-captures -name 'system-*.png' -print | grep -q . || {
            echo "no shard uploaded a theme-menu-captures-N artifact with system-*.png" >&2
            exit 1
          }


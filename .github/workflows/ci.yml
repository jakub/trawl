name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  vector-collector:
    name: Vector collector delivery
    runs-on: k8s-small
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install collector TLS test tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssl
      - name: Validate and exercise the Debian collector with Vector 0.57.0
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          curl --fail --location --retry 3 \
            https://github.com/vectordotdev/vector/releases/download/v0.57.0/vector-0.57.0-x86_64-unknown-linux-gnu.tar.gz \
            --output "$fixture_dir/vector.tar.gz"
          echo "4d156e6859e235b366f5b77121ae59d5440c93acab215c45f30f3fc839d20f65  $fixture_dir/vector.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/vector.tar.gz" -C "$fixture_dir"
          VECTOR_BIN="$fixture_dir/vector-x86_64-unknown-linux-gnu/bin/vector" \
            python3 scripts/test-vector-collector.py

  release-source:
    name: release source resolution
    runs-on: k8s-small
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Debian package test tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev
      # Runtime tests compile the actual Cargo helper, then exercise its target
      # and integrity boundaries with cached fixtures and no downloader on PATH.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      # Publication DAG tests use Helm's YAML parser, avoiding another YAML dependency.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  helm-template:
    name: helm template
    runs-on: k8s-small
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: bash chart/trawl/tests/render.sh

  deb-packaging:
    name: deb crash-dump packaging assertions
    runs-on: k8s-small
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: bash crates/trawl-server/debian/tests/packaging.sh

  fmt:
    name: rustfmt
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --no-default-features

  test:
    # The single workspace test job. Postgres backs the pg-based integration
    # tests in fleet-auth, fleet-admin, AND trawl-server: every pg test runs
    # under #[sqlx::test] (per-test ephemeral database off DATABASE_URL, so
    # the role must have CREATEDB), and trawl-server's harness additionally
    # creates a sibling trawl app-state database that trawld's real boot
    # path migrates. CI uses a throwaway postgres:18 container (the default
    # `postgres` superuser has CREATEDB); local-dev and the homelab dev/prod
    # environments use CNPG. An explicit `fleet-admin migrate` step (below)
    # applies the embedded fleet schema to the service container — it spells
    # out the migration step and exercises the exact deploy-time command the
    # helm init container runs. The trawl app-state database needs no CI
    # migrate step: trawld auto-migrates it at boot (sole writer).
    #
    # Connection budget: nextest is process-per-test and sqlx pools are
    # process-local, so unbounded parallelism can exceed the server's
    # max_connections (default 100 — GH service containers can't override
    # the postgres command line). The `postgres` nextest group in
    # .config/nextest.toml bounds pg-heavy test parallelism instead, and
    # the pg-admission-guard step below proves nothing escaped it.
    name: test
    runs-on: k8s-big
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Exercise real chart rendering in trawl-config's packaging contracts.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
      # nextest is pinned by VERSION, not just by the action sha: the action
      # manifest at this sha ships 0.9.132, whose filterset grammar predates
      # the `group()` predicate pg-admission-guard queries with -- the guard
      # step failed on every run while local 0.9.143 parsed it fine. Pin the
      # version the local gates validate.
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079
        with:
          tool: nextest@0.9.143
      # Explicit migration step: run the operational `fleet-admin migrate`
      # command against the service container. Spells out AC10's migration
      # step and exercises the exact deploy-time command the helm init
      # container runs (AC11) against a live postgres.
      - name: Apply fleet-auth schema migrations
        run: cargo run -p fleet-admin -- migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # FEATURE TRAP: --no-default-features also strips fleet-auth's default
      # `keystore` feature when it is built as a selected workspace package,
      # silently compiling out its pg test files. The explicit fleet-auth/*
      # features below re-enable them deterministically. Do NOT drop them.
      # There is no skip mode: #[sqlx::test] panics loudly when DATABASE_URL
      # is unset or unreachable, so "pg tests silently skipped" cannot
      # produce a misleading green (the FLEET_TESTS_REQUIRED backstop died
      # with the PgFixture in ADR-0004 slice 3 / issue #12).
      - run: >-
          cargo nextest run --workspace --no-default-features
          --features fleet-auth/keystore,fleet-auth/axum,fleet-auth/fast-hash
        env:
          # DATABASE_URL, not FLEET_DATABASE_URL: trawld's [auth] resolution
          # treats FLEET_DATABASE_URL as its highest-precedence keystore
          # override (ADR-0004 slice 3), so setting it process-wide would
          # silently repoint every fixture's per-test keystore DSN at the
          # shared service container. The #[sqlx::test] harness hardwires
          # DATABASE_URL.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Membership in the `postgres` group is hand-written in
      # .config/nextest.toml; this recomputes it from the sources and fails
      # if a pg-touching test runs outside the group. It runs after the
      # suite on purpose: the test binaries are already built, so the guard
      # only pays for `cargo nextest list`. Same feature selection as the
      # run above, because a feature can compile a pg test file out.
      - name: Guard the postgres admission group
        run: >-
          cargo xtask pg-admission-guard --
          --no-default-features
          --features fleet-auth/keystore,fleet-auth/axum,fleet-auth/fast-hash
      - name: Smoke-test verified DuckDB development launcher
        run: |
          cargo build -p trawl-server --no-default-features
          bin/trawld-dev --version

  msrv:
    name: msrv check
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv
      - run: cargo check --workspace --no-default-features

  deny:
    name: cargo-deny
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Binary install instead of EmbarkStudios/cargo-deny-action because
      # that action is Docker-based and k8s-small is unprivileged (no dind).
      # cargo-deny shells out to `cargo metadata`, so we need a toolchain.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # cargo-deny
        with:
          tool: cargo-deny
      - run: cargo deny check

  wasm-check:
    name: wasm32 clippy (web UI + fleet-ui)
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wasm-check
      - run: cargo clippy -p trawl-web-ui --target wasm32-unknown-unknown
      # Both sides of the default-off `atmosphere` feature: the bare run is
      # the shape non-mounting consumers compile (and the one that must NOT
      # link the vendored snippet), the second covers the backdrop itself.
      - run: cargo clippy -p fleet-ui --target wasm32-unknown-unknown
      - run: cargo clippy -p fleet-ui --target wasm32-unknown-unknown --features atmosphere

  vendor-drift:
    name: web UI vendor bundle drift
    runs-on: k8s-small
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
      - name: Rebuild vendor bundles
        working-directory: crates/trawl-web-ui/vendor
        run: bash build.sh
      - name: Rebuild fleet-ui vendor bundle
        working-directory: crates/fleet-ui/vendor
        run: bash build.sh
      - name: Fail if committed bundles drifted
        run: |
          git diff --exit-code \
            crates/trawl-web-ui/vendor/codemirror.js \
            crates/trawl-web-ui/vendor/uplot.js \
            crates/trawl-web-ui/vendor/uplot.css \
            crates/fleet-ui/vendor/paper-shaders.js

  trunk-build:
    name: web UI release build (trunk)
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trunk-build
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      # The SPA mounts Atmosphere on /login (dep-level `atmosphere` feature,
      # ADR-0012), so exactly one emitted shader snippet must ship — zero
      # means the feature fell off (the mount would be a compile error, but
      # the emission path is wasm-bindgen's, so pin it), more than one means
      # stale staging leaked into dist.
      - name: Build SPA
        working-directory: crates/trawl-web-ui
        run: |
          # wasm-bindgen appends to its output dir and never prunes it, and
          # rust-cache restores that dir — so an orphaned snippet from an
          # earlier build would be copied into dist and miscount below.
          # Purge the staging snippets so the assertion sees only what THIS
          # build emitted.
          rm -rf ../../target/wasm-bindgen/release/snippets
          trunk build --release
          count=$(ls dist/snippets/fleet-ui-*/vendor/paper-shaders.js 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one fleet-ui shader snippet in trawl-web-ui dist, found $count (ADR-0012)"
            exit 1
          fi
      # The workbench is the only wasm-target build of the Atmosphere
      # backdrop (it opts in via `data-cargo-features` in index.html).
      # wasm-bindgen inlines `module = "/vendor/paper-shaders.js"` as a
      # compile-time snippet, so a missing bundle already fails the build;
      # the assertion pins the emission path the generated shim imports
      # (ADR-0012).
      - name: Build fleet-ui workbench
        working-directory: crates/fleet-ui
        run: |
          trunk build
          test -f dist/snippets/*/vendor/paper-shaders.js
      - name: Precompress SPA + enforce wire-size budgets
        run: cargo xtask compress-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist/
          retention-days: 7

  trawl-web-tests:
    name: trawl-web tests
    runs-on: k8s-big
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Exercise real chart rendering in the packaging contract tests.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-tests
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # nextest
        with:
          tool: nextest@0.9.143
      - run: cargo nextest run -p trawl-web

  trawl-web-release:
    name: trawl-web release build (SPA embedded)
    runs-on: k8s-big
    needs: trunk-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1; pinned via toolchain input
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: trawl-web-release
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: trawl-web-ui-dist
          path: crates/trawl-web-ui/dist
      - name: Verify SPA was baked in
        run: test -f crates/trawl-web-ui/dist/index.html
      - run: cargo build --release -p trawl-web

  web-ui-health-mutation:
    name: Health page request-gate mutation
    runs-on: k8s-big
    needs: web-ui-e2e
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: health-mutation
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/trawl-web-ui/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: crates/trawl-web-ui/e2e
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/trawl-web-ui/e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: crates/trawl-web-ui/e2e
      - name: Kill the Health admin-request gate mutation
        run: crates/trawl-web-ui/e2e/scripts/mutation-check.sh 20-health-admin-gate.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: health-mutation-traces
          path: crates/trawl-web-ui/e2e/test-results/
          retention-days: 7

  web-ui-palette-mutations:
    name: Command palette admission and toggle mutations
    runs-on: k8s-big
    needs: web-ui-e2e
    # Browser system packages can take 15 minutes before the SPA rebuilds.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: palette-mutations
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/trawl-web-ui/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: crates/trawl-web-ui/e2e
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/trawl-web-ui/e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: crates/trawl-web-ui/e2e
      - name: Kill command palette admission and toggle mutations
        run: env -u NO_COLOR crates/trawl-web-ui/e2e/scripts/mutation-check.sh 24-palette-overlay-gate.patch 25-palette-toggle.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: palette-mutation-traces
          path: crates/trawl-web-ui/e2e/test-results/
          retention-days: 7

  web-ui-save-snapshot-mutation:
    name: Save editor snapshot mutation
    runs-on: k8s-big
    needs: web-ui-e2e
    # Allow package setup plus pristine, mutated, and restored SPA checks.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: save-snapshot-mutation
      - uses: taiki-e/install-action@ad7375e0bba1919d6e57488597dede2841199079 # trunk
        with:
          tool: trunk
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/trawl-web-ui/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: crates/trawl-web-ui/e2e
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/trawl-web-ui/e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: crates/trawl-web-ui/e2e
      - name: Validate Save mutation report attribution
        run: node --test crates/trawl-web-ui/e2e/scripts/check-save-mutation.test.mjs
      - name: Build pristine SPA
        run: env -u NO_COLOR trunk build
        working-directory: crates/trawl-web-ui
      - name: Verify pristine Settings and Save behavior
        run: npx playwright test tests/settings-disposition.spec.ts
        working-directory: crates/trawl-web-ui/e2e
      - name: Kill the Save editor snapshot mutation and restore pristine SPA
        run: env -u NO_COLOR crates/trawl-web-ui/e2e/scripts/mutation-check.sh 26-save-editor-snapshot.patch
      - name: Verify restored Settings and Save behavior
        run: npx playwright test tests/settings-disposition.spec.ts
        working-directory: crates/trawl-web-ui/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: save-snapshot-mutation-traces
          path: crates/trawl-web-ui/e2e/test-results/
          retention-days: 7

  web-ui-pagination-range-mutations:

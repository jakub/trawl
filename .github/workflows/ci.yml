          THEME_WORKBENCH_DIST: ${{ github.workspace }}/crates/fleet-ui/dist
        run: npx playwright test --config playwright.theme.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4

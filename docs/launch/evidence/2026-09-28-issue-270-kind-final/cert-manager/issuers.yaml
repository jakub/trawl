# A self-signed Issuer signs a CA Certificate; a CA Issuer backed by that
# CA's Secret signs trawld's certificate, so the leaf Secret carries ca.crt.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trawl-ca
spec:
  isCA: true
  commonName: trawl-270 kind proof CA
  secretName: trawl-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: trawl-ca-issuer
spec:
  ca:
    secretName: trawl-ca

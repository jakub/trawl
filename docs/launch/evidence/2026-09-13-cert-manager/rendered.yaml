apiVersion: v1
kind: Pod
metadata:
  name: l06-trawl-test-connection
  labels:
    helm.sh/chart: trawl-0.1.0
    app.kubernetes.io/name: trawl
    app.kubernetes.io/instance: l06
    app.kubernetes.io/version: "0.1.18"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:stable
      command:
        - wget
        - --no-check-certificate
        - -qO-
        - https://l06-trawl:5514/api/v1/health
  restartPolicy: Never


apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: l06-trawl-tls
  namespace: l06-cert-manager
  labels:
    helm.sh/chart: trawl-0.1.0
    app.kubernetes.io/name: trawl
    app.kubernetes.io/instance: l06
    app.kubernetes.io/version: "0.1.18"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: l06-trawl-tls
  issuerRef:
    name: "l06-selfsigned"
    kind: Issuer
    group: "cert-manager.io"
  dnsNames:
    - l06-trawl.l06-cert-manager.svc
    - trawl.l06.example.test
---

# trawl helm chart values
#
# trawl is single-node only — replicas are hardcoded to 1.
# multiple replicas would corrupt the transitional SQLite app-state store
# (query history, saved queries, schedules — moves to postgres in a later
# ADR-0004 slice). API keys already live in the external fleet-auth
# postgres keystore.

image:
  repository: ghcr.io/jakub/trawl
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Kubernetes Service
service:
  type: ClusterIP
  port: 5514
  # Web UI (trawl-web session proxy) — only published when .Values.web.enabled.
  webPort: 8090
  # Optional annotations (e.g. for cloud load balancers).
  annotations: {}
  # Native syslog listener ports (requires config.syslog.enabled).
  syslog:
    enabled: false
    udpPort: 1514
    tcpPort: 1514

# -- Ingress (disabled by default)
# When ingress.backend is "web" (default) the ingress targets the trawl-web
# sidecar — browser users get the SPA, cookie-authed sessions translate to
# bearer tokens under the hood. Switch to "trawld" to expose the raw HTTPS
# API directly (for bearer-token API clients), at which point you must set
# the nginx backend-protocol annotation to HTTPS.
ingress:
  enabled: false
  # "web"    — browser UI via trawl-web sidecar (default)
  # "trawld" — raw HTTPS API (requires backend-protocol: HTTPS annotation)
  backend: web
  className: ""
  annotations: {}
  # For ingress.backend=trawld, add:
  #   nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  hosts:
    - host: trawl.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: trawl-tls
  #    hosts:
  #      - trawl.local

# -- Gateway API HTTPRoute (alternative to Ingress)
# trawld speaks HTTPS natively — configure BackendTLSPolicy if your
# gateway controller needs to trust the backend certificate.
httpRoute:
  enabled: false
  parentRef:
    name: ""
    namespace: ""
    sectionName: websecure
  hostnames: []

# -- Persistent storage
# Single PVC for parquet data, WAL, the transitional app-state store, and
# auto-generated TLS certs.
persistence:
  enabled: true
  storageClass: ""
  size: 50Gi
  accessModes:
    - ReadWriteOnce

# -- Crash-dump (minidump) capture
# When enabled, trawld re-execs itself as a separate minidump *monitor* process
# and installs a fatal-signal handler. On SIGSEGV/SIGABRT/SIGBUS the handler asks
# the monitor to write a minidump to a dedicated PVC, then re-raises so the
# process still exits and is restarted. The monitor ptraces the crashed trawld
# (a process can't ptrace its own thread group), so the trawld container is
# granted CAP_SYS_PTRACE — only when this is enabled, and only on trawld
# (init-auth and trawl-web are untouched). The dump PVC is separate from the data
# PVC, so dumps stay out of data backups and survive container restarts, pod
# reschedules, and node reboots. Off by default.
# Requires persistence.enabled=true; rendering fails instead of silently using
# pod-local storage when crash dumps are enabled without persistent data.
#
# trawld reads the contract below from the environment:
#   TRAWL_CRASH_DUMP_DIR    <- mountPath
#   TRAWL_CRASH_DUMP_RETAIN <- retain (keep at most N dumps)
crashDump:
  enabled: false
  size: 2Gi
  storageClass: ""
  # Nested mount under the data dir (which is itself a mount), so it does not
  # collide with compaction's scan of /var/lib/trawl/data, and is writable
  # despite readOnlyRootFilesystem.
  mountPath: /var/lib/trawl/cores
  retain: 10

# -- trawld configuration
# Either use the structured values below (templated into trawld.toml),
# or set config.raw to provide your own TOML verbatim.
config:
  # Set to a complete trawld.toml string to bypass structured templating.
  raw: ""

  server:
    httpAddr: "0.0.0.0:5514"
    timeoutSecs: 30
    # Defaults to CPU count when empty.
    maxConcurrentQueries: ""
    maxResultRows: 100000
    maxExportRows: 1000000
    maxRequestBodyBytes: "128K"
    maxConcurrentRequests: 256
    shutdownDrainSecs: 30
    maxSseConnections: 32
    # How often to check for rotated TLS certs (seconds). Default: 300.
    # Lower values improve cert-manager rotation responsiveness.
    tlsReloadIntervalSecs: 300
    corsAllowedOrigins: []
    schemaCacheTtlSecs: 60
    maxQueryHistory: 1000
    # Per-key rate limit (requests/minute): every API key gets an
    # independent bucket — defaultRpm on the interactive API routes,
    # ingestRpm on /api/v1/ingest. 0 = disabled for that route class.
    # The per-role keys (admin/analyst/reader/ingest) were removed in
    # ADR-0006 slice 0 — a values file still carrying them fails at render.
    rateLimit:
      defaultRpm: 100
      ingestRpm: 1000

  data:
    path: "/var/lib/trawl/data"

  auth:
    auditIntervalSecs: 30

  ingest:
    enabled: true
    maxBodyBytes: "16M"
    # Defaults to {data.path}/wal when empty.
    walDir: ""
    compactionIntervalSecs: 10
    internalTelemetry: true
    dailyRollup: true
    eventBusCapacity: 4096
    hotBufferMaxEvents: 100000
    hotBufferMaxBytes: "100M"
    statsIntervalSecs: 60
    telemetryFlushIntervalSecs: 1
    # Wire keys _severity derives from, first MAPPABLE wins. Sources are
    # only READ, so each stays a queryable column. Empty derives nothing.
    # An entry may be a bare name or {field, dialect}, where the dialect
    # ("otel" default, "syslog" inverts 0-7) governs NUMERICS only — the
    # syslog-over-HTTP forwarder knob:
    #   - { field: syslog_severity, dialect: syslog }
    severityFrom:
      - severity
      - severity_text
      - level
    # Wire keys _time derives from, first PRESENT wins. Must contain
    # _time (the only reserved name allowed); a dialect here is an error.
    timeFrom:
      - _time
      - timestamp
      - "@timestamp"

  retention:
    maxAgeDays: 90
    minFreeDiskBytes: "1G"
    retentionIntervalSecs: 3600
    # Per-env age overrides: env name -> max_age_days. An env with no
    # entry keeps maxAgeDays above; 0 keeps that env's data forever.
    # Disk pressure stays install-wide and deletes by expiry ratio: the
    # date directory that has used up the largest fraction of its env's
    # age limit goes first.
    #   envs:
    #     prod: 365
    #     lab: 7
    envs: {}

  syslog:
    enabled: false
    udpAddr: "0.0.0.0:1514"
    udpEnabled: true
    tcpAddr: "0.0.0.0:1514"
    tcpEnabled: true
    maxTcpConnections: 256
    batchIntervalMs: 500
    batchMaxEvents: 1000
    defaultService: "syslog"
    tcpIdleTimeoutSecs: 60
    maxEventsPerConnection: 100000
    consecutiveSendFailuresLimit: 100
    allowCidrs: []
    # allowCidrs:
    #   - "192.168.0.0/16"
    #   - "10.0.0.0/8"
    sourceServiceMap: {}
    # sourceServiceMap:
    #   "10.0.0.1": "unifi-gateway"
    #   "10.0.0.2": "unifi-ap"
    channelCapacity: 10000

  scheduler:
    enabled: true
    pollIntervalSecs: 10
    reportMaxRows: 10000
    maxRunsPerSchedule: 100
    reportRetentionDays: 30

# -- TLS configuration
# "auto"        — trawld generates a self-signed cert (default, zero-config)
# "secret"      — mount an existing Kubernetes TLS Secret
# "certManager" — create a cert-manager Certificate resource
tls:
  mode: auto
  # For mode=secret: name of the existing TLS Secret.
  secretName: ""
  # For mode=certManager:
  certManager:
    issuerRef:
      name: ""
      kind: ClusterIssuer

# -- Fleet-auth postgres keystore (ADR-0004)
# API keys are verified against an EXTERNAL postgres database shared across
# fleet apps. The connection string is injected from an existing Secret
# into the init-auth container (as DATABASE_URL, what fleet-admin reads)
# and into trawld (as FLEET_DATABASE_URL — the bare DATABASE_URL override
# was removed from trawld in ADR-0004 slice 3). It is never rendered into
# the ConfigMap or config.raw. Provision keys with fleet-admin (see the
# cutover runbook); expect vector ingest to buffer to disk during the
# cutover window (size buffers accordingly, e.g. 1 GiB).
auth:
  database:
    # Name of an existing Secret holding the postgres URL. REQUIRED.
    existingSecret: ""
    # Key within that Secret (the SECRET key name, not the env var name —
    # existing Secrets keep working unchanged across the slice-3 upgrade).
    existingSecretKey: "DATABASE_URL"

# -- Trawl app-state database (ADR-0004 slice 3)
# Query history, saved queries, schedules, and report runs live in a
# DEDICATED postgres database owned by trawld: boot-migrated automatically
# and guarded by a session advisory lock (sole writer). The connection
# string is injected as the TRAWL_DATABASE_URL env var from an existing
# Secret — never rendered into the ConfigMap. There is NO fallback to the
# auth URL; provision a separate database whose role owns the schema (see
# the fleet-auth cutover runbook for the exact role/grants).
storage:
  database:
    # Name of an existing Secret holding the postgres URL. REQUIRED.
    existingSecret: ""
    # Key within that Secret.
    existingSecretKey: "TRAWL_DATABASE_URL"

# -- Auth schema migration
# An init container runs `fleet-admin migrate` against the fleet keystore
# on every pod start (idempotent by construction — sqlx tracks applied
# migrations). Key minting moved to the cutover runbook: with a shared
# fleet keystore, keys may already exist from sibling-app provisioning, so
# the chart no longer auto-mints per-install tokens.
initAuth:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- Container resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    # No CPU limit — DuckDB benefits from burst capacity.
    memory: 2Gi

# -- Extra environment variables for the trawld container.
# Example:
#   extraEnv:
#     - name: RUST_BACKTRACE
#       value: "1"
extraEnv: []

# -- Browser-facing web UI (trawl-web session proxy)
# Runs as a sidecar container in the same pod as trawld. Serves the SPA
# and translates cookie-authenticated requests to bearer-token requests
# against the local trawld.
#
# API clients that use bearer tokens directly (CLI, trawl-client library,
# vector log ingest) must talk to the trawld HTTPS service on port 5514,
# NOT to the trawl-web port — the proxy rejects non-cookie auth and blocks
# /api/v1/ingest outright.
web:
  enabled: true
  # Must bind to a pod-IP-reachable address (not loopback), so the
  # Service's `web` port can route to it.
  bindAddr: "0.0.0.0:8090"
  sessionTtlSecs: 86400
  # Drop the Secure cookie flag. Enable ONLY if a TLS-terminating ingress
  # sits in front and strips it.
  allowInsecureCookies: false
  # Fleet SSO: parent domain for the shared fleet_session cookie, e.g.
  # ".fleet.lab.ktle.net". Set the SAME value in every fleet app (mirrors
  # coastwatch's session.shared_domain) AND point cookieSecret.existingSecret
  # at the shared session key so every app can decrypt the cookie — see the
  # fleet-auth cutover runbook, "Fleet SSO" section. Empty = standalone mode
  # (origin-scoped cookie, chart-generated key keeps working).
  sharedDomain: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraEnv: []

  # -- Log level (RUST_LOG) for the trawl-web sidecar ONLY. The proxy emits
  # its session, origin, upstream and startup diagnostics under trawl_web,
  # and the shared session/origin primitives under fleet_auth — neither of
  # which the trawld `logLevel` names, so the sidecar gets its own filter
  # rather than inheriting a target-only filter that would silence it.
  # Matches trawl_web::DEFAULT_LOG_FILTER; keep both targets when
  # customizing, or proxy and auth failures become invisible.
  logLevel: "trawl_web=info,fleet_auth=info"

  # Cookie secret — a 32-byte AEAD key.
  #
  # When existingSecret is empty the chart generates a Secret on first
  # install and preserves the value on helm upgrade via a lookup shim.
  # Supply your own Secret (e.g. from an external secrets manager) by
  # setting existingSecret to its name.
  cookieSecret:
    existingSecret: ""
    existingSecretKey: "cookie.key"

# -- Log level (RUST_LOG) for the trawld container. The default enumerates
# every target trawld emits under — trawl_server (library), trawld (binary:
# startup banner, config warnings), fleet_auth (auth middleware), the
# deliberately-overridden auth.backend / storage.backend alarm targets, and
# preauth.transport (accept-loop TLS handshake / connection diagnostics).
# Keep them all when customizing, or backend and transport errors become
# invisible. The trawl-web sidecar has its own filter (see web.logLevel).
logLevel: "trawl_server=info,trawld=info,fleet_auth=info,auth.backend=info,storage.backend=info,preauth.transport=info"

# -- Prometheus ServiceMonitor (requires prometheus-operator CRDs)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Install into a specific namespace (e.g. monitoring). Empty = release namespace.
  namespace: ""

# -- Pod configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

{{- if and .Values.web.enabled (not .Values.web.cookieSecret.existingSecret) }}
{{- $name := printf "%s-web" (include "trawl.fullname" .) -}}
{{- /*
  Preserve the cookie key across helm upgrades: if the Secret already
  exists in the cluster, read its current value and re-emit it. Only
  generate a new random key on first install.
  Note: `lookup` returns empty during `helm template` (no cluster); that's
  fine — template rendering always produces a fresh key in that mode.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing (hasKey (default dict $existing.data) "cookie.key") -}}
{{-   $key = index $existing.data "cookie.key" -}}
{{- else -}}
{{-   $key = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
type: Opaque
data:
  cookie.key: {{ $key }}
{{- end }}

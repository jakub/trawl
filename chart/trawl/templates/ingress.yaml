{{- if .Values.ingress.enabled -}}
{{- $backend := .Values.ingress.backend | default "web" -}}
{{- /*
  Ingress target port:
   - "web"    → trawl-web sidecar on plain HTTP (port name: web).
                Cookie sessions; /api/v1/ingest is blocked by the proxy.
   - "trawld" → raw HTTPS API (port name: https).
                Users MUST set nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
                (or their controller's equivalent) via ingress.annotations.
*/ -}}
{{- if and (eq $backend "web") (not .Values.web.enabled) -}}
{{-   fail "ingress.backend=web requires web.enabled=true; set ingress.backend to \"trawld\" or enable the web sidecar" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trawl.fullname" . }}
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "trawl.fullname" $ }}
                port:
                  name: {{ if eq $backend "web" }}web{{ else }}https{{ end }}
          {{- end }}
    {{- end }}
{{- end }}

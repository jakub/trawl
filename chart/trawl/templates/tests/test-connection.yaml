apiVersion: v1
kind: Pod
metadata:
  name: {{ include "trawl.fullname" . }}-test-connection
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:stable
      command:
        - wget
        - --no-check-certificate
        - -qO-
        - https://{{ include "trawl.fullname" . }}:{{ .Values.service.port }}/api/v1/health
  restartPolicy: Never

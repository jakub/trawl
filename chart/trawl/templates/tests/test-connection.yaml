apiVersion: v1
kind: Pod
metadata:
  name: {{ include "trawl.fullname" . }}-test-connection
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  # Pod Security Restricted, so `helm test` runs in the same namespace as the
  # release. busybox's nobody uid, because the image has no non-root default.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:stable
      command:
        - wget
        - --no-check-certificate
        - -qO-
        - https://{{ include "trawl.fullname" . }}:{{ .Values.service.port }}/api/v1/health
      # -qO- writes the response to stdout, so the root filesystem stays
      # read-only with no writable volume.
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
  restartPolicy: Never

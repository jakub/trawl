{{- if and .Values.crashDump.enabled (not .Values.persistence.enabled) -}}
{{- fail "crashDump.enabled=true requires persistence.enabled=true so crash dumps and trawld data survive pod replacement; enable persistence.enabled or disable crashDump.enabled" -}}
{{- end }}
{{- /* ADR-0016: the CSRF guard compares a browser's Origin against origins
     the operator states. There is no default worth having, so the chart
     refuses here rather than shipping a proxy that 403s every browser.
     This template always renders when web.enabled, unlike the ingress. */ -}}
{{- if and .Values.web.enabled (not .Values.web.publicOrigins) -}}
{{- fail "web.enabled=true requires web.publicOrigins: list the browser-visible origins of this deployment (scheme, host and port, matched whole), e.g. --set-string 'web.publicOrigins[0]=https://trawl.example.com'. It is never derived from ingress hosts or httpRoute hostnames." -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trawl.fullname" . }}
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
spec:
  # Single-node by design: trawld owns its parquet data dir and in-memory
  # hot buffer outright (no shared/clustered storage model), and it holds a
  # session advisory lock on the trawl app-state database — a second
  # replica would fail startup rather than split-brain.
  replicas: 1
  serviceName: {{ include "trawl.fullname" . }}
  selector:
    matchLabels:
      {{- include "trawl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "trawl.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trawl.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.config.server.shutdownDrainSecs }}
      {{- if .Values.initAuth.enabled }}
      initContainers:
        # Apply fleet-auth keystore schema migrations. Idempotent by
        # construction (sqlx tracks applied migrations), so it runs on every
        # pod start — no sentinel file. Key minting moved to the cutover
        # runbook (fleet-admin against the shared keystore).
        - name: init-auth
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fleet-admin", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.database.existingSecret is required (Secret holding the fleet keystore DATABASE_URL)" .Values.auth.database.existingSecret }}
                  key: {{ .Values.auth.database.existingSecretKey }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.initAuth.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: trawld
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/trawl/trawld.toml", "--no-monitor"]
          ports:
            - name: https
              containerPort: 5514
              protocol: TCP
            {{- if .Values.config.syslog.enabled }}
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 1514
              protocol: TCP
            {{- end }}
          env:
            - name: HOME
              value: /var/lib/trawl
            # Fleet keystore DSN — from the Secret, never the ConfigMap.
            # FLEET_DATABASE_URL since ADR-0004 slice 3: the bare
            # DATABASE_URL override was removed from trawld (that variable
            # is ceded to the sqlx test harness). fleet-admin (init
            # container above) still reads DATABASE_URL.
            - name: FLEET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.database.existingSecret is required (Secret holding the fleet keystore DSN)" .Values.auth.database.existingSecret }}
                  key: {{ .Values.auth.database.existingSecretKey }}
            # Trawl app-state DSN (history/saved/schedules/runs) — a
            # DEDICATED database, boot-migrated and advisory-locked by
            # trawld. No fallback to the auth URL.
            - name: TRAWL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "storage.database.existingSecret is required (Secret holding the trawl app-state DSN)" .Values.storage.database.existingSecret }}
                  key: {{ .Values.storage.database.existingSecretKey }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.crashDump.enabled }}
            - name: TRAWL_CRASH_DUMP_DIR
              value: {{ .Values.crashDump.mountPath | quote }}
            - name: TRAWL_CRASH_DUMP_RETAIN
              value: {{ .Values.crashDump.retain | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            {{- include "trawl.trawldSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/trawl
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/trawl/trawld.toml
              subPath: trawld.toml
              readOnly: true
            {{- if ne .Values.tls.mode "auto" }}
            - name: tls
              mountPath: /etc/trawl/tls
              readOnly: true
            {{- end }}
            {{- if .Values.crashDump.enabled }}
            - name: cores
              mountPath: {{ .Values.crashDump.mountPath | quote }}
            {{- end }}
        {{- if .Values.web.enabled }}
        - name: trawl-web
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["trawl-web"]
          args: ["--config", "/etc/trawl/trawld.toml"]
          ports:
            - name: web
              containerPort: 8090
              protocol: TCP
          env:
            - name: HOME
              value: /var/lib/trawl
            # trawld serves HTTPS with a self-signed cert by default;
            # loopback-within-pod is the only traffic path, so TLS
            # verification buys us nothing here.
            - name: TRAWL_WEB_INSECURE_UPSTREAM
              value: "1"
            # The proxy's own filter — trawld's logLevel names neither
            # trawl_web nor the proxy's fleet_auth events.
            - name: RUST_LOG
              value: {{ .Values.web.logLevel | quote }}
            # The browser-origin allowlist. The same list the configmap
            # renders into [web] public_origins, passed again here so a
            # config.raw that replaces the generated TOML still carries it.
            # The environment wins on read, and because the two lists are
            # identical trawl-web logs one info line saying so; it warns
            # only when they differ, which means something replaced one
            # half and not the other.
            - name: FLEET_SESSION_PUBLIC_ORIGINS
              value: {{ join "," .Values.web.publicOrigins | quote }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
              scheme: HTTP
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: web
              scheme: HTTP
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/trawl/trawld.toml
              subPath: trawld.toml
              readOnly: true
            - name: web-cookie
              mountPath: /etc/trawl/web.cookie
              subPath: cookie.key
              readOnly: true
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: config
          configMap:
            name: {{ include "trawl.fullname" . }}
        {{- if eq .Values.tls.mode "secret" }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- else if eq .Values.tls.mode "certManager" }}
        - name: tls
          secret:
            secretName: {{ include "trawl.fullname" . }}-tls
        {{- end }}
        {{- if .Values.web.enabled }}
        - name: web-cookie
          secret:
            secretName: {{ if .Values.web.cookieSecret.existingSecret }}{{ .Values.web.cookieSecret.existingSecret }}{{ else }}{{ printf "%s-web" (include "trawl.fullname" .) }}{{ end }}
            defaultMode: 0400
            items:
              - key: {{ .Values.web.cookieSecret.existingSecretKey | default "cookie.key" }}
                path: cookie.key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or .Values.persistence.enabled .Values.crashDump.enabled }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: data
        labels:
          {{- include "trawl.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- end }}
    {{- if .Values.crashDump.enabled }}
    - metadata:
        name: cores
        labels:
          {{- include "trawl.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.crashDump.storageClass }}
        storageClassName: {{ .Values.crashDump.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.crashDump.size }}
    {{- end }}
  {{- end }}

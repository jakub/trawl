apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trawl.fullname" . }}
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
spec:
  # Single-node only — multiple replicas would corrupt the transitional
  # SQLite app-state store (history/saved/schedules).
  replicas: 1
  serviceName: {{ include "trawl.fullname" . }}
  selector:
    matchLabels:
      {{- include "trawl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "trawl.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trawl.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.config.server.shutdownDrainSecs }}
      {{- if .Values.initAuth.enabled }}
      initContainers:
        # Apply fleet-auth keystore schema migrations. Idempotent by
        # construction (sqlx tracks applied migrations), so it runs on every
        # pod start — no sentinel file. Key minting moved to the cutover
        # runbook (fleet-admin against the shared keystore).
        - name: init-auth
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fleet-admin", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.database.existingSecret is required (Secret holding the fleet keystore DATABASE_URL)" .Values.auth.database.existingSecret }}
                  key: {{ .Values.auth.database.existingSecretKey }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.initAuth.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: trawld
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/trawl/trawld.toml", "--no-monitor"]
          ports:
            - name: https
              containerPort: 5514
              protocol: TCP
            {{- if .Values.config.syslog.enabled }}
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 1514
              protocol: TCP
            {{- end }}
          env:
            - name: HOME
              value: /var/lib/trawl
            # Fleet keystore DSN — from the Secret, never the ConfigMap.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.database.existingSecret is required (Secret holding the fleet keystore DATABASE_URL)" .Values.auth.database.existingSecret }}
                  key: {{ .Values.auth.database.existingSecretKey }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.crashDump.enabled }}
            - name: TRAWL_CRASH_DUMP_DIR
              value: {{ .Values.crashDump.mountPath | quote }}
            - name: TRAWL_CRASH_DUMP_RETAIN
              value: {{ .Values.crashDump.retain | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
          securityContext:
            {{- include "trawl.trawldSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/trawl
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/trawl/trawld.toml
              subPath: trawld.toml
              readOnly: true
            {{- if ne .Values.tls.mode "auto" }}
            - name: tls
              mountPath: /etc/trawl/tls
              readOnly: true
            {{- end }}
            {{- if .Values.crashDump.enabled }}
            - name: cores
              mountPath: {{ .Values.crashDump.mountPath | quote }}
            {{- end }}
        {{- if .Values.web.enabled }}
        - name: trawl-web
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["trawl-web"]
          args: ["--config", "/etc/trawl/trawld.toml"]
          ports:
            - name: web
              containerPort: 8090
              protocol: TCP
          env:
            - name: HOME
              value: /var/lib/trawl
            # trawld serves HTTPS with a self-signed cert by default;
            # loopback-within-pod is the only traffic path, so TLS
            # verification buys us nothing here.
            - name: TRAWL_WEB_INSECURE_UPSTREAM
              value: "1"
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
              scheme: HTTP
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: web
              scheme: HTTP
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/trawl/trawld.toml
              subPath: trawld.toml
              readOnly: true
            - name: web-cookie
              mountPath: /etc/trawl/web.cookie
              subPath: cookie.key
              readOnly: true
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: config
          configMap:
            name: {{ include "trawl.fullname" . }}
        {{- if eq .Values.tls.mode "secret" }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- else if eq .Values.tls.mode "certManager" }}
        - name: tls
          secret:
            secretName: {{ include "trawl.fullname" . }}-tls
        {{- end }}
        {{- if .Values.web.enabled }}
        - name: web-cookie
          secret:
            secretName: {{ if .Values.web.cookieSecret.existingSecret }}{{ .Values.web.cookieSecret.existingSecret }}{{ else }}{{ printf "%s-web" (include "trawl.fullname" .) }}{{ end }}
            defaultMode: 0400
            items:
              - key: {{ .Values.web.cookieSecret.existingSecretKey | default "cookie.key" }}
                path: cookie.key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or .Values.persistence.enabled .Values.crashDump.enabled }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: data
        labels:
          {{- include "trawl.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- end }}
    {{- if .Values.crashDump.enabled }}
    - metadata:
        name: cores
        labels:
          {{- include "trawl.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.crashDump.storageClass }}
        storageClassName: {{ .Values.crashDump.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.crashDump.size }}
    {{- end }}
  {{- end }}

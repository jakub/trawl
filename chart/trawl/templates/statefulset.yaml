{{- if and .Values.crashDump.enabled (not .Values.persistence.enabled) -}}
{{- fail "crashDump.enabled=true requires persistence.enabled=true so crash dumps and trawld data survive pod replacement; enable persistence.enabled or disable crashDump.enabled" -}}
{{- end }}
{{- /* ADR-0016: the CSRF guard compares a browser's Origin against origins
     the operator states. There is no default worth having, so the chart
     refuses here rather than shipping a proxy that 403s every browser.
     This template always renders when web.enabled, unlike the ingress. */ -}}
{{- if and .Values.web.enabled (not .Values.web.publicOrigins) -}}
{{- fail "web.enabled=true requires web.publicOrigins: list the browser-visible origins of this deployment (scheme, host and port, matched whole), e.g. --set-string 'web.publicOrigins[0]=https://trawl.example.com'. It is never derived from ingress hosts or httpRoute hostnames." -}}
{{- end }}
{{- /* How the sidecar verifies trawld (ADR-0048), resolved and validated in
     _tls.tpl. The ConfigMap reads the same helper for its [web] keys. */ -}}
{{- $trust := include "trawl.upstreamTrust" . | fromJson }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trawl.fullname" . }}
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
spec:
  # Single-node by design: trawld owns its parquet data dir and in-memory
  # hot buffer outright (no shared/clustered storage model), and it holds a
  # session advisory lock on the trawl app-state database — a second
  # replica would fail startup rather than split-brain.
  replicas: 1
  serviceName: {{ include "trawl.fullname" . }}
  selector:
    matchLabels:
      {{- include "trawl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "trawl.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trawl.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.config.server.shutdownDrainSecs }}
      {{- if or .Values.initAuth.enabled $trust.dataSubPath }}
      initContainers:
      {{- end }}
      {{- if .Values.initAuth.enabled }}
        # Apply Fleet-auth schema migrations on every pod start when enabled.
        # sqlx tracks applied migrations. Create keys with fleet-admin as
        # described in https://trawl.sh/operate/access/#create-roles-and-keys.
        - name: init-auth
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fleet-admin", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.database.existingSecret is required (Secret holding the fleet keystore DATABASE_URL)" .Values.auth.database.existingSecret }}
                  key: {{ .Values.auth.database.existingSecretKey }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.initAuth.resources | nindent 12 }}
      {{- end }}
      {{- if $trust.dataSubPath }}
        # tls.mode=auto with the sidecar: create the directory trawl-web
        # mounts by subPath before either app container starts. kubelet
        # creates a missing subPath directory itself, as root, when it sets
        # up trawl-web's mounts. Containers start in spec order without
        # waiting for each other, so trawld may not have made it yet, and a
        # root-owned tls/ leaves trawld unable to publish cert.pem into it.
        # Init containers finish before kubelet prepares any app container.
        #
        # The shared securityContext gives this container trawld's uid and
        # gid. It cannot take ownership of a directory another uid owns
        # (that needs root or CAP_CHOWN), so it fails the pod here, naming
        # the owner, rather than letting trawld crash-loop on it. Nothing
        # else in the pod runs yet, so nothing races the check.
        - name: init-tls-dir
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              dir=$1
              uid=$(id -u)
              if [ ! -e "$dir" ] && [ ! -L "$dir" ]; then
                mkdir -p -m 0755 -- "$dir"
              fi
              if [ -L "$dir" ] || [ ! -d "$dir" ]; then
                echo "$0: $dir is not a directory. trawld publishes its generated certificate there; remove it so this container creates the directory." >&2
                exit 1
              fi
              owner=$(stat -c %u -- "$dir")
              if [ "$owner" != "$uid" ]; then
                echo "$0: $dir is owned by uid $owner, not trawld's uid $uid, so trawld cannot publish its generated certificate there. Change its owner to $uid, or remove it so this container creates it." >&2
                exit 1
              fi
              if [ ! -w "$dir" ] || [ ! -x "$dir" ]; then
                echo "$0: $dir is not writable by trawld's uid $uid, so trawld cannot publish its generated certificate there. Grant the owner write and search permission." >&2
                exit 1
              fi
              # An older trawld kept its private key beside the certificate.
              # The fsGroup walk can make it readable by trawl-web, so it goes
              # before any app container starts. Only a regular file is
              # trawld's; anything else is refused and never followed.
              key=$dir/key.pem
              if [ -L "$key" ] || { [ -e "$key" ] && [ ! -f "$key" ]; }; then
                echo "$0: $key is not a regular file. trawl-web mounts $dir, where no private key may be; remove it." >&2
                exit 1
              fi
              rm -f -- "$key"
              if [ -e "$key" ] || [ -L "$key" ]; then
                echo "$0: could not remove the private key $key from $dir, which trawl-web mounts." >&2
                exit 1
              fi
            - init-tls-dir
            - {{ $trust.dataMountPath | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: {{ include "trawl.dataMountPath" . }}
      {{- end }}
      containers:
        - name: trawld
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/trawl/trawld.toml", "--no-monitor"]
          ports:
            - name: https
              containerPort: 5514
              protocol: TCP
            {{- if .Values.config.syslog.enabled }}
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 1514
              protocol: TCP
            {{- end }}
          env:
            - name: HOME
              value: /var/lib/trawl
            # Fleet keystore DSN — from the Secret, never the ConfigMap.
            # trawld reads FLEET_DATABASE_URL. fleet-admin in the init
            # container reads DATABASE_URL. See
            # https://trawl.sh/operate/deployment/#provision-the-databases.
            - name: FLEET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.database.existingSecret is required (Secret holding the fleet keystore DSN)" .Values.auth.database.existingSecret }}
                  key: {{ .Values.auth.database.existingSecretKey }}
            # Trawl app-state DSN (history/saved/schedules/runs) — a
            # DEDICATED database, boot-migrated and advisory-locked by
            # trawld. No fallback to the auth URL.
            - name: TRAWL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "storage.database.existingSecret is required (Secret holding the trawl app-state DSN)" .Values.storage.database.existingSecret }}
                  key: {{ .Values.storage.database.existingSecretKey }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.crashDump.enabled }}
            - name: TRAWL_CRASH_DUMP_DIR
              value: {{ .Values.crashDump.mountPath | quote }}
            - name: TRAWL_CRASH_DUMP_RETAIN
              value: {{ .Values.crashDump.retain | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            {{- include "trawl.trawldSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ include "trawl.dataMountPath" . }}
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/trawl/trawld.toml
              subPath: trawld.toml
              readOnly: true
            {{- if ne .Values.tls.mode "auto" }}
            - name: tls
              mountPath: /etc/trawl/tls
              readOnly: true
            {{- end }}
            {{- if .Values.crashDump.enabled }}
            - name: cores
              mountPath: {{ .Values.crashDump.mountPath | quote }}
            {{- end }}
        {{- if .Values.web.enabled }}
        - name: trawl-web
          image: {{ include "trawl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["trawl-web"]
          args: ["--config", "/etc/trawl/trawld.toml"]
          ports:
            - name: web
              containerPort: 8090
              protocol: TCP
          env:
            - name: HOME
              value: /var/lib/trawl
            # The proxy's own filter — trawld's logLevel names neither
            # trawl_web nor the proxy's fleet_auth events.
            - name: RUST_LOG
              value: {{ .Values.web.logLevel | quote }}
            # The browser-origin allowlist. The same list the configmap
            # renders into [web] public_origins. The environment wins on
            # read, and because the two lists are identical trawl-web logs
            # one info line saying so; it warns only when they differ, which
            # means something replaced one half and not the other.
            - name: FLEET_SESSION_PUBLIC_ORIGINS
              value: {{ join "," .Values.web.publicOrigins | quote }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
              scheme: HTTP
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: web
              scheme: HTTP
            periodSeconds: 10
          securityContext:
            {{- include "trawl.webSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/trawl/trawld.toml
              subPath: trawld.toml
              readOnly: true
            - name: web-cookie
              mountPath: /etc/trawl/web.cookie
              subPath: cookie.key
              readOnly: true
            {{- if $trust.dataSubPath }}
            # tls.mode=auto: the directory holding trawld's generated
            # certificate, pinned by [web] upstream_ca_path. Never a file
            # subPath: that binds one inode at container start, so kubelet
            # would create a directory where a not-yet-written cert.pem
            # belongs, and a certificate replaced by rename would never
            # reach the sidecar. Read-only. It holds only cert.pem: trawld's
            # key.pem is in tls-key/, outside this mount.
            - name: data
              mountPath: {{ $trust.dataMountPath | quote }}
              subPath: {{ $trust.dataSubPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $trust.caSecretName }}
            # tls.upstreamCa=secret: only ca.crt, as a directory mount so a
            # renewed CA reaches trawl-web's re-read without a restart.
            - name: upstream-ca
              mountPath: {{ $trust.caMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: config
          configMap:
            name: {{ include "trawl.fullname" . }}
        {{- if ne .Values.tls.mode "auto" }}
        - name: tls
          secret:
            secretName: {{ include "trawl.tlsSecretName" . }}
        {{- end }}
        {{- if .Values.web.enabled }}
        - name: web-cookie
          secret:
            secretName: {{ if .Values.web.cookieSecret.existingSecret }}{{ .Values.web.cookieSecret.existingSecret }}{{ else }}{{ printf "%s-web" (include "trawl.fullname" .) }}{{ end }}
            defaultMode: 0400
            items:
              - key: {{ .Values.web.cookieSecret.existingSecretKey | default "cookie.key" }}
                path: cookie.key
        {{- if $trust.caSecretName }}
        # The TLS Secret again, projecting ca.crt alone so tls.key never
        # reaches the sidecar. Optional: an issuer that writes no ca.crt
        # leaves the directory empty and trawl-web answers 503 rather than
        # the pod failing to start.
        - name: upstream-ca
          secret:
            secretName: {{ $trust.caSecretName }}
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- with .Values.web.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or .Values.persistence.enabled .Values.crashDump.enabled }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: data
        labels:
          {{- include "trawl.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- end }}
    {{- if .Values.crashDump.enabled }}
    - metadata:
        name: cores
        labels:
          {{- include "trawl.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.crashDump.storageClass }}
        storageClassName: {{ .Values.crashDump.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.crashDump.size }}
    {{- end }}
  {{- end }}

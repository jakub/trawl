apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trawl.fullname" . }}
  labels:
    {{- include "trawl.labels" . | nindent 4 }}
data:
  trawld.toml: |
    {{- /* config.raw was removed (ADR-0048): ignoring a leftover would
         silently drop every setting it carried, so fail the render. */}}
    {{- if hasKey .Values.config "raw" }}
    {{- fail "config.raw was removed: the chart always generates trawld.toml. Move its settings into the structured config values and delete config.raw." }}
    {{- end }}
    [server]
    http_addr = {{ .Values.config.server.httpAddr | quote }}
    timeout_secs = {{ .Values.config.server.timeoutSecs | int }}
    {{- if .Values.config.server.maxConcurrentQueries }}
    max_concurrent_queries = {{ .Values.config.server.maxConcurrentQueries }}
    {{- end }}
    max_result_rows = {{ .Values.config.server.maxResultRows | int }}
    max_export_rows = {{ .Values.config.server.maxExportRows | int }}
    max_request_body_bytes = {{ .Values.config.server.maxRequestBodyBytes | quote }}
    max_concurrent_requests = {{ .Values.config.server.maxConcurrentRequests | int }}
    shutdown_drain_secs = {{ .Values.config.server.shutdownDrainSecs | int }}
    max_sse_connections = {{ .Values.config.server.maxSseConnections | int }}
    schema_cache_ttl_secs = {{ .Values.config.server.schemaCacheTtlSecs | int }}
    max_query_history = {{ .Values.config.server.maxQueryHistory | int }}
    {{- /* Scratch must land on the data volume: the root filesystem is
         read-only and the /tmp emptyDir is evicted past its sizeLimit.
         trawld's default is the sibling <data.path>.query-scratch, which is
         on the volume exactly when data.path is below its mount. */}}
    {{- $mount := include "trawl.dataMountPath" . }}
    {{- $scratch := toString .Values.config.server.queryScratchDir }}
    {{- /* A crash-dump mount nested at, under, or above scratch wins the
         longest-mount match, so scratch would fill the small crash-dump PVC
         that holds the cores instead of the data volume. Compare the
         effective path trawld resolves: the key, or <data.path>.query-scratch. */}}
    {{- if .Values.crashDump.enabled }}
    {{- $effective := ternary (clean $scratch) (printf "%s.query-scratch" (clean (toString .Values.config.data.path))) (ne $scratch "") }}
    {{- $cores := clean (toString .Values.crashDump.mountPath) }}
    {{- if or (eq $effective $cores) (hasPrefix (printf "%s/" $cores) $effective) (hasPrefix (printf "%s/" $effective) $cores) }}
    {{- fail (printf "crashDump.mountPath %q must not be at, under, or above the query scratch directory %q (config.server.queryScratchDir, or <config.data.path>.query-scratch when it is empty): the crash-dump volume would shadow scratch and a spilling query would fill the volume that holds the cores; move one of them" $cores $effective) }}
    {{- end }}
    {{- end }}
    {{- if $scratch }}
    {{- if not (hasPrefix (printf "%s/" $mount) (clean $scratch)) }}
    {{- fail (printf "config.server.queryScratchDir must be an absolute path below %s so scratch lands on the data volume; got %q" $mount $scratch) }}
    {{- end }}
    query_scratch_dir = {{ clean $scratch | quote }}
    {{- else if not (hasPrefix (printf "%s/" $mount) (clean (toString .Values.config.data.path))) }}
    {{- fail (printf "config.data.path %q is not below %s, so trawld's default scratch directory <data.path>.query-scratch would sit off the data volume: set config.server.queryScratchDir to a directory below %s" (toString .Values.config.data.path) $mount $mount) }}
    {{- end }}
    {{- /* The results root (ADR-0057) follows the same rules as scratch: it
         must land on the data volume, apart from the effective scratch
         directory and the crash-dump mount. trawld's default is the sibling
         <data.path>.results, which is on the volume exactly when data.path
         is below its mount. Compare the effective paths trawld resolves. */}}
    {{- $results := toString .Values.config.server.resultsDir }}
    {{- $effectiveScratch := ternary (clean $scratch) (printf "%s.query-scratch" (clean (toString .Values.config.data.path))) (ne $scratch "") }}
    {{- $effectiveResults := ternary (clean $results) (printf "%s.results" (clean (toString .Values.config.data.path))) (ne $results "") }}
    {{- if $results }}
    {{- if not (hasPrefix (printf "%s/" $mount) (clean $results)) }}
    {{- fail (printf "config.server.resultsDir must be an absolute path below %s so captured results land on the data volume; got %q" $mount $results) }}
    {{- end }}
    {{- else if not (hasPrefix (printf "%s/" $mount) (clean (toString .Values.config.data.path))) }}
    {{- fail (printf "config.data.path %q is not below %s, so trawld's default results directory <data.path>.results would sit off the data volume: set config.server.resultsDir to a directory below %s" (toString .Values.config.data.path) $mount $mount) }}
    {{- end }}
    {{- if or (eq $effectiveResults $effectiveScratch) (hasPrefix (printf "%s/" $effectiveScratch) $effectiveResults) (hasPrefix (printf "%s/" $effectiveResults) $effectiveScratch) }}
    {{- fail (printf "config.server.resultsDir %q (effective; config.server.resultsDir, or <config.data.path>.results when it is empty) must not be at, under, or above the query scratch directory %q (config.server.queryScratchDir, or <config.data.path>.query-scratch when it is empty): trawld refuses to start when the two overlap; move one of them" $effectiveResults $effectiveScratch) }}
    {{- end }}
    {{- if .Values.crashDump.enabled }}
    {{- $cores := clean (toString .Values.crashDump.mountPath) }}
    {{- if or (eq $effectiveResults $cores) (hasPrefix (printf "%s/" $cores) $effectiveResults) (hasPrefix (printf "%s/" $effectiveResults) $cores) }}
    {{- fail (printf "crashDump.mountPath %q must not be at, under, or above the results directory %q (config.server.resultsDir, or <config.data.path>.results when it is empty): the crash-dump volume would shadow captured results and fill the volume that holds the cores; move one of them" $cores $effectiveResults) }}
    {{- end }}
    {{- end }}
    {{- if $results }}
    results_dir = {{ clean $results | quote }}
    {{- end }}
    query_spill_max_bytes = {{ .Values.config.server.querySpillMaxBytes | quote }}
    query_memory_limit = {{ .Values.config.server.queryMemoryLimit | quote }}
    query_threads = {{ .Values.config.server.queryThreads | int }}
    {{- if .Values.config.server.corsAllowedOrigins }}
    cors_allowed_origins = [{{ range $i, $o := .Values.config.server.corsAllowedOrigins }}{{ if $i }}, {{ end }}{{ $o | quote }}{{ end }}]
    {{- end }}
    {{- if ne .Values.tls.mode "auto" }}
    tls_cert_path = "/etc/trawl/tls/tls.crt"
    tls_key_path = "/etc/trawl/tls/tls.key"
    tls_reload_interval_secs = {{ .Values.config.server.tlsReloadIntervalSecs | int }}
    {{- end }}

    {{- /* The per-role knobs died in ADR-0006 slice 0. A stale user values
         file carrying them would merge cleanly with the chart defaults and
         silently drop the operator's tuned quotas — fail the render instead
         so the operator migrates to defaultRpm/ingestRpm deliberately. */}}
    {{- if or (hasKey .Values.config.server.rateLimit "admin") (hasKey .Values.config.server.rateLimit "analyst") (hasKey .Values.config.server.rateLimit "reader") (hasKey .Values.config.server.rateLimit "ingest") }}
    {{- fail "config.server.rateLimit.{admin,analyst,reader,ingest} were removed in ADR-0006 slice 0: rate limiting is now per API key. Replace them with config.server.rateLimit.defaultRpm (interactive API routes) and config.server.rateLimit.ingestRpm (/api/v1/ingest); requests/minute per key, 0 disables." }}
    {{- end }}
    [server.rate_limit]
    default_rpm = {{ .Values.config.server.rateLimit.defaultRpm | int }}
    ingest_rpm = {{ .Values.config.server.rateLimit.ingestRpm | int }}

    [data]
    path = {{ .Values.config.data.path | quote }}

    {{- /* [capture] (ADR-0057) renders only when config.capture is set. Every
         key is emitted verbatim, strings quoted: trawld's boot-time
         validation is the one validator, and a chart that cherry-picked
         known keys would silently drop a typo'd one. */}}
    {{- if .Values.config.capture }}

    [capture]
    {{- range $key, $value := .Values.config.capture }}
    {{ $key }} = {{ if kindIs "string" $value }}{{ $value | quote }}{{ else }}{{ $value | toJson }}{{ end }}
    {{- end }}
    {{- end }}

    [auth]
    # database_url deliberately absent: the fleet keystore DSN is injected
    # as the FLEET_DATABASE_URL env var from a Secret (never rendered here).
    audit_interval_secs = {{ .Values.config.auth.auditIntervalSecs | int }}

    # [storage] database_url deliberately absent too: the trawl app-state
    # DSN is injected as the TRAWL_DATABASE_URL env var from a Secret.

    [ingest]
    enabled = {{ .Values.config.ingest.enabled }}
    max_body_bytes = {{ .Values.config.ingest.maxBodyBytes | quote }}
    {{- if .Values.config.ingest.walDir }}
    wal_dir = {{ .Values.config.ingest.walDir | quote }}
    {{- end }}
    compaction_interval_secs = {{ .Values.config.ingest.compactionIntervalSecs | int }}
    compaction_memory_limit = {{ .Values.config.ingest.compactionMemoryLimit | quote }}
    internal_telemetry = {{ .Values.config.ingest.internalTelemetry }}
    daily_rollup = {{ .Values.config.ingest.dailyRollup }}
    event_bus_capacity = {{ .Values.config.ingest.eventBusCapacity | int }}
    hot_buffer_max_events = {{ .Values.config.ingest.hotBufferMaxEvents | int }}
    hot_buffer_max_bytes = {{ .Values.config.ingest.hotBufferMaxBytes | quote }}
    stats_interval_secs = {{ .Values.config.ingest.statsIntervalSecs | int }}
    telemetry_flush_interval_secs = {{ .Values.config.ingest.telemetryFlushIntervalSecs | int }}
    {{- /* Derivation sources (ADR-0013 slice 2): each entry is a bare
         name or a {field, dialect} map. Rendered rather than defaulted
         away, because these lists are a packaging contract — the chart,
         the Debian example, the code default and the docs state one
         list (crates/trawl-config/tests/derivation_packaging_contract.rs).
         Map entries render EVERY key verbatim: trawld's boot-fatal
         validation is the one validator, and a chart that cherry-picked
         known keys would silently launder a typo'd or misplaced dialect
         into default OTel semantics instead of a refused boot. */}}
    severity_from = [{{ range $i, $s := .Values.config.ingest.severityFrom }}{{ if $i }}, {{ end }}{{ if kindIs "map" $s }}{{ $parts := list }}{{ range $k, $v := $s }}{{ $parts = append $parts (printf "%s = %s" $k ($v | toJson)) }}{{ end }}{ {{ join ", " $parts }} }{{ else }}{{ $s | quote }}{{ end }}{{ end }}]
    time_from = [{{ range $i, $s := .Values.config.ingest.timeFrom }}{{ if $i }}, {{ end }}{{ if kindIs "map" $s }}{{ $parts := list }}{{ range $k, $v := $s }}{{ $parts = append $parts (printf "%s = %s" $k ($v | toJson)) }}{{ end }}{ {{ join ", " $parts }} }{{ else }}{{ $s | quote }}{{ end }}{{ end }}]

    [retention]
    max_age_days = {{ .Values.config.retention.maxAgeDays | int }}
    min_free_disk_bytes = {{ .Values.config.retention.minFreeDiskBytes | quote }}
    retention_interval_secs = {{ .Values.config.retention.retentionIntervalSecs | int }}
    {{- /* Per-env age overrides. These sub-tables must follow the three
         scalars above: in TOML a scalar after a sub-table header lands
         inside that sub-table. Helm ranges a map in key order, so the
         rendered config is stable across upgrades.
         Key and value render through toJson, never `int`: this is a
         deletion policy, and trawld's boot-fatal validation is the one
         validator. `int` would launder `1.9` into a one-day limit and
         `"typo"` into 0 (keep forever), and a raw key such as `prod] #`
         would end the table header early and read as an override for
         `prod`. As a quoted key and a typed value, every one of those is
         a refused boot instead.
         The shape is checked here because trawld cannot: `range` walks a
         list as happily as a map, and a list's indexes `0`, `1` are
         valid env names, so `envs: [7, 365]` would boot with two
         overrides nobody wrote. nil (an override file unsetting it) is
         an empty map. */}}
    {{- $envs := .Values.config.retention.envs }}
    {{- if and (not (kindIs "invalid" $envs)) (not (kindIs "map" $envs)) }}
    {{- fail (printf "config.retention.envs must be a map of env name to max_age_days, got %s" (kindOf $envs)) }}
    {{- end }}
    {{- range $name, $days := $envs }}

    [retention.env.{{ $name | toJson }}]
    max_age_days = {{ $days | toJson }}
    {{- end }}

    [syslog]
    enabled = {{ .Values.config.syslog.enabled }}
    {{- if .Values.config.syslog.enabled }}
    udp_addr = {{ .Values.config.syslog.udpAddr | quote }}
    udp_enabled = {{ .Values.config.syslog.udpEnabled }}
    tcp_addr = {{ .Values.config.syslog.tcpAddr | quote }}
    tcp_enabled = {{ .Values.config.syslog.tcpEnabled }}
    max_tcp_connections = {{ .Values.config.syslog.maxTcpConnections | int }}
    batch_interval_ms = {{ .Values.config.syslog.batchIntervalMs | int }}
    batch_max_events = {{ .Values.config.syslog.batchMaxEvents | int }}
    default_service = {{ .Values.config.syslog.defaultService | quote }}
    tcp_idle_timeout_secs = {{ .Values.config.syslog.tcpIdleTimeoutSecs | int }}
    max_events_per_connection = {{ .Values.config.syslog.maxEventsPerConnection | int }}
    channel_capacity = {{ .Values.config.syslog.channelCapacity | int }}
    {{- if .Values.config.syslog.allowCidrs }}
    allow_cidrs = [{{ range $i, $cidr := .Values.config.syslog.allowCidrs }}{{ if $i }}, {{ end }}{{ $cidr | quote }}{{ end }}]
    {{- end }}
    {{- if .Values.config.syslog.defaultTimezone }}
    default_timezone = {{ .Values.config.syslog.defaultTimezone | quote }}
    {{- end }}
    {{- if .Values.config.syslog.sourceServiceMap }}

    [syslog.source_service_map]
    {{- range $ip, $service := .Values.config.syslog.sourceServiceMap }}
    {{ $ip | quote }} = {{ $service | quote }}
    {{- end }}
    {{- end }}
    {{- if .Values.config.syslog.senderTimezones }}

    [syslog.sender_timezones]
    {{- range $ip, $zone := .Values.config.syslog.senderTimezones }}
    {{ $ip | quote }} = {{ $zone | quote }}
    {{- end }}
    {{- end }}
    {{- end }}

    [scheduler]
    enabled = {{ .Values.config.scheduler.enabled }}
    poll_interval_secs = {{ .Values.config.scheduler.pollIntervalSecs | int }}
    max_runs_per_schedule = {{ .Values.config.scheduler.maxRunsPerSchedule | int }}
    report_retention_days = {{ .Values.config.scheduler.reportRetentionDays | int }}
    max_catchup_intervals = {{ .Values.config.scheduler.maxCatchupIntervals | int }}
    {{- if .Values.web.enabled }}

    [web]
    bind_addr = {{ .Values.web.bindAddr | quote }}
    {{- /* The browser-origin allowlist (ADR-0016). The statefulset refuses
         to render an enabled web sidecar without one, so by the time this
         renders the list is non-empty; trawl-web refuses to start on an
         empty one too, and states the same knob. */}}
    public_origins = [{{ range $i, $o := .Values.web.publicOrigins }}{{ if $i }}, {{ end }}{{ $o | quote }}{{ end }}]
    cookie_secret_path = "/etc/trawl/web.cookie"
    session_ttl_secs = {{ .Values.web.sessionTtlSecs | int }}
    allow_insecure_cookies = {{ .Values.web.allowInsecureCookies }}
    {{- if .Values.web.sharedDomain }}
    shared_domain = {{ .Values.web.sharedDomain | quote }}
    {{- end }}
    {{- /* How trawl-web verifies trawld (ADR-0048), resolved and validated
         in _tls.tpl; the statefulset mounts what these keys name. auto
         renders only the pin and leaves upstream_url to trawl-web, which
         derives https://127.0.0.1:<port> from [server] http_addr. */}}
    {{- $trust := include "trawl.upstreamTrust" . | fromJson }}
    {{- with $trust.url }}
    upstream_url = {{ . | toJson }}
    {{- end }}
    {{- with $trust.connectAddr }}
    upstream_connect_addr = {{ . | toJson }}
    {{- end }}
    {{- with $trust.caPath }}
    upstream_ca_path = {{ . | toJson }}
    {{- end }}
    {{- end }}

{{- if .Values.prometheusRule.enabled }}
{{- $any := false }}
{{- range .Values.prometheusRule.alerts }}
{{- if .enabled }}{{- $any = true }}{{- end }}
{{- end }}
{{- $labels := include "trawl.labels" . | fromYaml }}
{{- range $key, $value := .Values.prometheusRule.additionalLabels }}
{{- $parts := splitList "/" $key }}
{{- if gt (len $parts) 2 }}
{{- fail (printf "prometheusRule.additionalLabels key %q is an invalid Kubernetes label key: at most one '/' is allowed" $key) }}
{{- end }}
{{- $name := last $parts }}
{{- if or (gt (len $name) 63) (not (regexMatch `^[A-Za-z0-9]([-_.A-Za-z0-9]*[A-Za-z0-9])?$` $name)) }}
{{- fail (printf "prometheusRule.additionalLabels key %q is an invalid Kubernetes label key: name must be 1-63 ASCII characters, start and end with an alphanumeric character, and contain only alphanumeric characters, '-', '_', or '.'" $key) }}
{{- end }}
{{- if eq (len $parts) 2 }}
{{- $prefix := first $parts }}
{{- /* Kubernetes IsDNS1123Subdomain limits the whole prefix, not each segment. */}}
{{- if or (gt (len $prefix) 253) (not (regexMatch `^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$` $prefix)) }}
{{- fail (printf "prometheusRule.additionalLabels key %q is an invalid Kubernetes label key: prefix must be a nonempty lowercase DNS subdomain of at most 253 bytes" $key) }}
{{- end }}
{{- end }}
{{- if and (hasKey $labels $key) (ne (get $labels $key) $value) }}
{{- fail (printf "prometheusRule.additionalLabels.%s conflicts with the chart resource label" $key) }}
{{- end }}
{{- $_ := set $labels $key $value }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "trawl.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.prometheusRule.namespace | quote }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  groups:
    - name: trawl.operational
      rules:{{ if not $any }} []{{ end }}
        {{- if .Values.prometheusRule.alerts.TrawlSyslogQueueDiscard.enabled }}
        - alert: TrawlSyslogQueueDiscard
          expr: increase(trawl_syslog_events_dropped_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }}}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlSyslogQueueDiscard.severity | quote }}
          annotations:
            summary: "Syslog queue discarded events on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: The receive queue abandoned events. This does not measure packets lost before receipt. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#syslog-queue-discard"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlSyslogWalDiscard.enabled }}
        - alert: TrawlSyslogWalDiscard
          expr: increase(trawl_syslog_wal_events_discarded_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }}}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlSyslogWalDiscard.severity | quote }}
          annotations:
            summary: "Syslog WAL write abandoned events on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: A failed WAL group was abandoned from normal ingestion. Temporary bytes or sender copies may remain. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#syslog-wal-discard"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlTelemetryCapacityDiscard.enabled }}
        - alert: TrawlTelemetryCapacityDiscard
          expr: increase(trawl_telemetry_events_dropped_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }},reason=~"preinit_cap|buffer_cap"}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlTelemetryCapacityDiscard.severity | quote }}
          annotations:
            summary: "Telemetry capacity discarded events on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: Capacity exhausted for reason {{ `{{ $labels.reason }}` }}. Drops before recorder installation are not recorded. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#telemetry-capacity-discard"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlSyslogWriteOutcomeUncertain.enabled }}
        - alert: TrawlSyslogWriteOutcomeUncertain
          expr: increase(trawl_syslog_write_tasks_failed_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }}}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlSyslogWriteOutcomeUncertain.severity | quote }}
          annotations:
            summary: "Syslog write task failed on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: A write task failed with uncertain outcome. Earlier groups may already be durable; do not infer batch loss or replay blindly. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#syslog-write-outcome-uncertain"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlTelemetryWriteOutcomeUncertain.enabled }}
        - alert: TrawlTelemetryWriteOutcomeUncertain
          expr: increase(trawl_telemetry_events_dropped_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }},reason="write_crashed"}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlTelemetryWriteOutcomeUncertain.severity | quote }}
          annotations:
            summary: "Telemetry write outcome is uncertain on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: The in-memory batch was consumed for reason {{ `{{ $labels.reason }}` }}. WAL bytes may already exist; this also counts as a failed attempt. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#telemetry-write-outcome-uncertain"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlHttpPersistenceRejection.enabled }}
        - alert: TrawlHttpPersistenceRejection
          expr: increase(trawl_ingest_events_rejected_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }},reason="wal_failure"}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlHttpPersistenceRejection.severity | quote }}
          annotations:
            summary: "HTTP persistence rejected events on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: The server rejected persistence for reason {{ `{{ $labels.reason }}` }}. The sender may retry; permanent loss is not established. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#http-persistence-rejection"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlTelemetryWalWriteFailure.enabled }}
        - alert: TrawlTelemetryWalWriteFailure
          expr: increase(trawl_telemetry_wal_write_failures_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }}}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlTelemetryWalWriteFailure.severity | quote }}
          annotations:
            summary: "Telemetry WAL attempt failed on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: A WAL attempt failed, including retained retries and crashed tasks. Crashes can also fire the uncertain-outcome alert; attempts are not event losses. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#telemetry-wal-write-failure"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlWalDurabilityDegraded.enabled }}
        - alert: TrawlWalDurabilityDegraded
          expr: increase(trawl_wal_durability_failures_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }},operation="parent_directory_sync"}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlWalDurabilityDegraded.severity | quote }}
          annotations:
            summary: "WAL directory sync rejected a write on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: Operation {{ `{{ $labels.operation }}` }} failed, so the WAL write was rejected: HTTP answers 500, syslog discards the group, and telemetry retains the batch for retry. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#wal-durability-degraded"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlCompactionOperationFailure.enabled }}
        - alert: TrawlCompactionOperationFailure
          expr: increase(trawl_compaction_operation_failures_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }}}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlCompactionOperationFailure.severity | quote }}
          annotations:
            summary: "Compaction operation failed on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: Operation {{ `{{ $labels.operation }}` }} failed. This includes best-effort failures; it does not establish permanent event loss or a stalled backlog. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#compaction-operation-failure"
        {{- end }}
        {{- if .Values.prometheusRule.alerts.TrawlFileQuarantine.enabled }}
        - alert: TrawlFileQuarantine
          expr: increase(trawl_files_quarantined_total{namespace={{ .Release.Namespace | quote }},service={{ include "trawl.fullname" . | quote }}}[10m]) > 0
          labels:
            severity: {{ .Values.prometheusRule.alerts.TrawlFileQuarantine.severity | quote }}
          annotations:
            summary: "Files were quarantined on {{ `{{ $labels.instance }}` }}"
            description: "Target {{ `{{ $labels.job }}` }}/{{ `{{ $labels.instance }}` }}: Files of kind {{ `{{ $labels.kind }}` }} were isolated with bytes retained. Source files may remain intact; do not delete or replay automatically. An increase was observed in the last 10 minutes; resolution does not establish recovery."
            runbook_url: "https://trawl.sh/operate/operational-alerts/#file-quarantine"
        {{- end }}
{{- end }}

pre-commit:
  parallel: true
  commands:
    fmt-check:
      glob: "*.rs"
      run: source "$HOME/.cargo/env" && cargo fmt --check
    clippy:
      glob: "*.rs"
      run: source "$HOME/.cargo/env" && cargo clippy --workspace --all-targets -- -D warnings

pre-push:
  # Parallel is safe again: each suite gets its own logical database
  # (docker-compose.dev.yml + dev/pg-init.sql), so the sqlx test-database
  # setup/cleanup race that used to force serialization is gone.
  # The glob keeps doc-only pushes from paying for the full suites — tests
  # run only when the push touches code, manifests, or migrations.
  parallel: true
  commands:
    test:
      glob:
        - "*.rs"
        - "*.toml"
        - "Cargo.lock"
        - "crates/*/migrations/*.sql"
      run: source "$HOME/.cargo/env" && cargo nextest run --workspace
    test-no-defaults:
      glob:
        - "*.rs"
        - "*.toml"
        - "Cargo.lock"
        - "crates/*/migrations/*.sql"
      # Scoped to the crates that declare features — the featureless rest
      # resolves identically under --no-default-features and is already
      # covered by `test`. The http_api/hot_query binaries are excluded:
      # trawl-server's only no-defaults delta is duckdb linkage (exercised by
      # the store/engine tests), and double-booting full trawld instances
      # across two parallel suites starves the wall-clock-sensitive
      # integration tests into flaking.
      run: source "$HOME/.cargo/env" && DATABASE_URL="${DATABASE_URL%/*}/fleet_test_nd" cargo nextest run -p fleet-auth -p trawl-web -p trawl-engine -p trawl-server -p trawl-cli --no-default-features -E 'not (binary(http_api) | binary(hot_query))'

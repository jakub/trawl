# Portability: hooks run under POSIX `sh`, on both Linux and macOS dev boxes.
# `. "$HOME/.cargo/env"` (POSIX dot, not the bash-only `source`) loads a
# rustup PATH if present and is silently skipped otherwise (system-package
# rust puts cargo on PATH already). CPU count is `nproc` (Linux) falling back
# to `sysctl -n hw.ncpu` (macOS).
pre-commit:
  parallel: true
  commands:
    fmt-check:
      glob: "*.rs"
      run: if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi; cargo fmt --check
    clippy:
      glob: "*.rs"
      run: if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi; cargo clippy --workspace --all-targets -- -D warnings
    wasm-clippy:
      # The host clippy job never sees the cfg(target_arch = "wasm32")
      # component tree; this does. Glob-gated so a backend-only commit
      # pays nothing. One sequential command: three parallel cargo
      # processes would contend for one target dir. Two patterns per
      # crate because lefthook's matcher reads `**/` as "at least one
      # directory", so `crates/x/**/*` alone misses the crate root and
      # a Cargo.toml-only commit (a wasm feature flip) would slip past.
      glob:
        - "crates/trawl-web-ui/*"
        - "crates/trawl-web-ui/**/*"
        - "crates/fleet-ui/*"
        - "crates/fleet-ui/**/*"
      run: if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi; cargo clippy -p trawl-web-ui --target wasm32-unknown-unknown -- -D warnings && cargo clippy -p fleet-ui --target wasm32-unknown-unknown -- -D warnings && cargo clippy -p fleet-ui --target wasm32-unknown-unknown --features atmosphere -- -D warnings

pre-push:
  # Parallel is safe because each suite gets its own postgres CLUSTER
  # (5433/5434, docker-compose.dev.yml). Separate logical databases are NOT
  # enough: sqlx derives its per-test database name from the test path alone,
  # so identical tests running in both suites collide cluster-wide and race
  # dropdb against the other suite's live connections (SQLSTATE 55006).
  # Defaults name the two local development clusters. Agents can provide
  # dedicated clusters through TRAWL_TEST_DATABASE_URL and
  # TRAWL_TEST_ND_DATABASE_URL; ambient DATABASE_URL is still ignored.
  # Inline defaults keep pushes independent of direnv, which does not run
  # in these non-interactive hook shells.
  # The glob keeps doc-only pushes from paying for the full suites — tests
  # run only when the push touches code, manifests, or migrations.
  parallel: true
  commands:
    test:
      glob:
        - "*.rs"
        - "*.toml"
        - "Cargo.lock"
        - "crates/*/migrations/*.sql"
      # Half the cores each: two parallel suites at full test-thread counts
      # oversubscribe the machine 2x and flake every wall-clock-sensitive test.
      run: if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi; DATABASE_URL="${TRAWL_TEST_DATABASE_URL:-postgres://fleet:fleet@localhost:5433/fleet_test}" cargo nextest run --workspace --test-threads="$(( $(nproc 2>/dev/null || sysctl -n hw.ncpu) / 2 ))"
    test-no-defaults:
      glob:
        - "*.rs"
        - "*.toml"
        - "Cargo.lock"
        - "crates/*/migrations/*.sql"
      # Scoped to the crates that declare features — the featureless rest
      # resolves identically under --no-default-features and is already
      # covered by `test`. The http_api/hot_query binaries are excluded:
      # trawl-server's only no-defaults delta is duckdb linkage (exercised by
      # the store/engine tests), and double-booting full trawld instances
      # across two parallel suites starves the wall-clock-sensitive
      # integration tests into flaking.
      run: if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi; DATABASE_URL="${TRAWL_TEST_ND_DATABASE_URL:-postgres://fleet:fleet@localhost:5434/fleet_test_nd}" cargo nextest run -p fleet-auth -p trawl-web -p trawl-engine -p trawl-server -p trawl-cli --no-default-features --test-threads="$(( $(nproc 2>/dev/null || sysctl -n hw.ncpu) / 2 ))" -E 'not (binary(http_api) | binary(hot_query) | binary(timestamp_repair))'

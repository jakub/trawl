# cargo-deny configuration
# run with: cargo deny check

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste 1.0.15 is flagged unmaintained (RUSTSEC-2024-0436). It is a
    # compile-time proc-macro with no runtime attack surface, pulled transitively
    # by parquet; there is no replacement until parquet drops it upstream.
    "RUSTSEC-2024-0436",
    # zip 6.0.0 is a build dependency of libduckdb-sys 1.10505.0, which pins
    # zip "6"; the fixes are in zip >= 9. libduckdb-sys extracts an archive
    # only when it downloads the DuckDB library itself, and .cargo/config.toml
    # sets DUCKDB_DOWNLOAD_LIB=0, so no build here extracts a zip. Delete
    # these once libduckdb-sys moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extract; libduckdb-sys download path disabled" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract; libduckdb-sys download path disabled" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract; libduckdb-sys download path disabled" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # prefer rustls over openssl for TLS
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# cargo-deny configuration
# run with: cargo deny check

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste 1.0.15 is flagged unmaintained (RUSTSEC-2024-0436). It is a
    # compile-time proc-macro with no runtime attack surface, pulled transitively
    # by parquet; there is no replacement until parquet drops it upstream.
    "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # prefer rustls over openssl for TLS
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

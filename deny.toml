# cargo-deny configuration
# run with: cargo deny check

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste 1.0.15 is flagged unmaintained (RUSTSEC-2024-0436). It is a
    # compile-time proc-macro with no runtime attack surface, pulled transitively
    # by parquet; there is no replacement until parquet drops it upstream.
    "RUSTSEC-2024-0436",
    # zip 6.0.0 is a build dependency of libduckdb-sys 1.10505.0, which pins
    # zip "6"; the fixes are in zip >= 9. libduckdb-sys extracts an archive
    # only when it downloads the DuckDB library itself, and .cargo/config.toml
    # sets DUCKDB_DOWNLOAD_LIB=0, so no build here extracts a zip. Delete
    # these once libduckdb-sys moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extract; libduckdb-sys download path disabled" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract; libduckdb-sys download path disabled" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract; libduckdb-sys download path disabled" },
    # ctutils 0.4.2, fixed in 0.4.4 (published 2026-10-23). The fix is younger
    # than the 3-day minimum publish age, so this stays ignored until
    # 2026-10-26; then run `cargo update -p ctutils` and delete this entry.
    # ctutils is reached through digest (sqlx-postgres password hashing, on
    # the trusted database link) and through universal-hash → poly1305 →
    # chacha20poly1305 in fleet-auth, whose AEAD tag check runs on every
    # session cookie a client presents. A branch in the mask generation can
    # leak timing from that comparison, so bump as soon as the fix ages.
    { id = "RUSTSEC-2026-0385", reason = "constant-time mask branch; bump to 0.4.4 after 2026-10-26" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # prefer rustls over openssl for TLS
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

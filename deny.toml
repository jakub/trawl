# cargo-deny configuration
# run with: cargo deny check

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste 1.0.15 is flagged unmaintained (RUSTSEC-2024-0436). It is a
    # compile-time proc-macro with no runtime attack surface, pulled transitively
    # by parquet; there is no replacement until parquet drops it upstream.
    "RUSTSEC-2024-0436",
    # rustls 0.23.45, fixed in 0.23.46 (published 2026-10-14). The fix is
    # younger than the 3-day minimum publish age, so these stay ignored until
    # 2026-10-17; then run `cargo update -p rustls` and delete these four.
    # rustls is reached only through reqwest's client, with no ECH, no brotli
    # certificate compression, and no custom ClientSessionStore, so 0346,
    # 0347 and 0348 do not apply. 0349 can push a later connection from the
    # hybrid post-quantum group back to classical X25519.
    { id = "RUSTSEC-2026-0346", reason = "custom ClientSessionStore Debug only; none here" },
    { id = "RUSTSEC-2026-0347", reason = "ECH only; not enabled" },
    { id = "RUSTSEC-2026-0348", reason = "brotli certificate compression only; not enabled" },
    { id = "RUSTSEC-2026-0349", reason = "PQ-to-classical downgrade; bump to 0.23.46 after 2026-10-17" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # prefer rustls over openssl for TLS
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[workspace]
members = ["crates/*"]
exclude = ["crates/trawl-core/fuzz"]
default-members = ["crates/trawl-cli", "crates/trawl-admin", "crates/trawl-server"]
resolver = "3"

[workspace.package]
version = "0.1.15"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# internal crates
trawl-core = { path = "crates/trawl-core" }
trawl-engine = { path = "crates/trawl-engine", default-features = false }
trawl-auth = { path = "crates/trawl-auth" }
trawl-server = { path = "crates/trawl-server" }
trawl-api = { path = "crates/trawl-api" }
trawl-client = { path = "crates/trawl-client" }
trawl-dashboard = { path = "crates/trawl-dashboard" }

# external deps
aho-corasick = "1"
arboard = "3"
argon2 = { version = "0.5", features = ["std"] }
async-stream = "0.3"
axum = "0.8"
base64ct = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chumsky = "0.12"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
dashmap = "6"
comfy-table = "7"
duckdb = { version = "1.4" }
flate2 = "1"
futures = "0.3"
fs4 = "0.13"
governor = "0.10"
hostname = "0.4"
indexmap = "2"
insta = "1"
metrics = "0.24"
nucleo-matcher = "0.3"
metrics-exporter-prometheus = "0.18"
metrics-process = "2.4"
rand = "0.8"
regex = "1"
parking_lot = "0.12"
ratatui = "0.30"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "stream"] }
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
shellexpand = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1"
ulid = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "cors", "limit", "set-header"] }
tracing = "0.1"
tempfile = "3"
time = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-width = "0.2"
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }
syslog_loose = "0.23"
zstd = "0.13"

[profile.release]
strip = true
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
members = ["crates/*", "xtask"]
exclude = ["crates/trawl-core/fuzz"]
default-members = ["crates/trawl-cli", "crates/trawl-admin", "crates/trawl-server"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# internal crates
trawl-core = { path = "crates/trawl-core" }
trawl-engine = { path = "crates/trawl-engine", default-features = false }
trawl-server = { path = "crates/trawl-server" }
trawl-api = { path = "crates/trawl-api" }
trawl-client = { path = "crates/trawl-client" }
trawl-config = { path = "crates/trawl-config" }
trawl-dashboard = { path = "crates/trawl-dashboard" }
trawl-web = { path = "crates/trawl-web" }
trawl-crashdump = { path = "crates/trawl-crashdump" }
coastwatch-api-types = { path = "crates/coastwatch-api-types" }
fleet-auth = { path = "crates/fleet-auth", default-features = false }
fleet-ui = { path = "crates/fleet-ui" }

# external deps
aho-corasick = "1"
arboard = "3"
argon2 = { version = "0.5", features = ["std"] }
async-stream = "0.3"
axum = "0.8"
base64ct = "1"
blake3 = "1.8"
brotli = "8"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cookie = "0.18"
chumsky = "0.13"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
dashmap = "6"
comfy-table = "7"
duckdb = { version = "1.5" }
flate2 = "1"
futures = "0.3"
fs4 = "1.1"
governor = "0.10"
hostname = "0.4"
http = "1"
indexmap = "2"
insta = "1"
mime_guess = "2"
metrics = "0.24"
nucleo-matcher = "0.3"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-process = "2.4"
rand = "0.8"
regex = "1"
parking_lot = "0.12"
parquet = { version = "59", default-features = false }
ratatui = "0.30"
rust-embed = { version = "8", features = ["mime-guess"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "query", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-stream = "0.1"
shellexpand = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Umbrella sqlx: the rusqlite (links = "sqlite3") collision that forced the
# direct sqlx-core/sqlx-postgres workaround died with the trawl-auth crate in
# ADR-0004 slice 3, closing issue #12. tls-rustls-ring-webpki keeps the same
# webpki root store the workspace shipped with (`_tls-rustls-ring-webpki`).
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1"
ulid = "3"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "cors", "limit", "set-header"] }
tracing = "0.1"
tempfile = "3"
time = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-width = "0.2"
wiremock = "0.6"
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }
syslog_loose = "0.23"
zstd = "0.13"

[profile.release]
# Drops DWARF for normal/local release builds. This does NOT keep symbols
# usable for crash dumps under the release CI: that build cross-links with
# zig, whose lld strips .symtab regardless of this setting. So release CI
# overrides strip to false, runs dump_syms to publish breakpad .sym files
# (the symbolication source for minidumps — including the statically linked
# libduckdb frames), then llvm-strips the shipped artifacts with the GNU
# build-id note preserved. See .github/workflows/release.yml + trawl-crashdump.
strip = "debuginfo"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

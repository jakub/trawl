[workspace]
members = ["crates/*"]
default-members = ["crates/fleet-cli", "crates/fleet-admin", "crates/fleet-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# internal crates
fleet-core = { path = "crates/fleet-core" }
fleet-engine = { path = "crates/fleet-engine" }
fleet-auth = { path = "crates/fleet-auth" }
fleet-server = { path = "crates/fleet-server" }
fleet-client = { path = "crates/fleet-client" }

# external deps
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64ct = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chumsky = "0.12"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
comfy-table = "7"
duckdb = { version = "1.4", features = ["bundled"] }
flate2 = "1"
governor = "0.10"
insta = "1"
rand = "0.8"
regex = "1"
parking_lot = "0.12"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = "0.26"
shellexpand = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "cors", "limit", "set-header"] }
tracing = "0.1"
tempfile = "3"
time = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
members = ["crates/*", "xtask"]
exclude = ["crates/trawl-core/fuzz"]
default-members = ["crates/trawl-cli", "crates/trawl-server"]
resolver = "3"

[workspace.package]
version = "0.9.5"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
trawl-core = { path = "crates/trawl-core" }
trawl-engine = { path = "crates/trawl-engine", default-features = false }
trawl-server = { path = "crates/trawl-server" }
trawl-api = { path = "crates/trawl-api" }
trawl-search-url = { path = "crates/trawl-search-url" }
trawl-cli = { path = "crates/trawl-cli", default-features = false }
trawl-client = { path = "crates/trawl-client" }
trawl-mcp = { path = "crates/trawl-mcp" }
trawl-config = { path = "crates/trawl-config" }
trawl-dashboard = { path = "crates/trawl-dashboard" }
trawl-web = { path = "crates/trawl-web" }
trawl-crashdump = { path = "crates/trawl-crashdump" }
fleet-dev = { path = "crates/fleet-dev" }
fleet-auth = { path = "crates/fleet-auth", default-features = false }
fleet-ui = { path = "crates/fleet-ui" }

arboard = "3"
argon2 = { version = "0.5", features = ["std"] }
async-stream = "0.3"
axum = "0.8"
base64ct = "1"
blake3 = "1.8"
brotli = "8"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
cookie = "0.18"
chumsky = "0.13"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
dashmap = "6"
comfy-table = "7"
# duckdb-rs encodes DuckDB 1.5.x as 1.105xx.x. The probe matrix is
# release-gating (ADR-0017 §5), so a minor or major bump is a deliberate PR.
duckdb = { version = ">=1.10500, <1.10600" }
flate2 = "1"
futures = "0.3"
fs4 = "1.1"
governor = "0.10"
hostname = "0.4"
http = "1"
indexmap = "2"
insta = "1"
# Test-only: validates the MCP tool schemas against the JSON Schema 2020-12
# meta-schema. Defaults are off because they resolve remote and file
# references over reqwest and aws-lc-rs; the meta-schemas are built in.
jsonschema = { version = "0.59", default-features = false }
libc = "0.2"
log = "0.4"
mime_guess = "2"
memchr = "2"
metrics = "0.24"
nucleo-matcher = "0.3"
nix = { version = "0.29", features = ["fs", "process", "signal", "user"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-process = "2.4"
peak_alloc = "0.3"
proptest = "1.12"
rand = "0.8"
# The version is exact: a pattern's regex
# charge follows this crate's internals (`crates/trawl-core/src/pattern/charge.rs`),
# so a bump is a deliberate change that reruns `tests/regex_memory.rs`.
regex-automata = { version = "=0.4.16", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "hybrid", "dfa-onepass", "perf-inline", "perf-literal", "unicode"] }
regex-syntax = { version = "0.8", default-features = false }
parking_lot = "0.12"
parquet = { version = "59", default-features = false }
ratatui = "0.30"
rust-embed = { version = "8", features = ["mime-guess"] }
schemars = { version = "1.2.3", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "query", "stream"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
rustix = { version = "1.1.4", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-stream = "0.1"
shellexpand = "3"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: boot hydration (ADR-0041) accepts a WAL line only if it
# parses back to the exact float the writer printed. Enabling it makes float
# parsing exact for every serde_json user in the build.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1"
ulid = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "cors", "limit", "set-header"] }
tracing = "0.1"
tempfile = "3"
time = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
wiremock = "0.6"
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }
syslog_loose = "0.23"
zstd = "0.14"

[profile.release]
strip = "debuginfo"
lto = "thin"

[profile.wasm-dev]
inherits = "dev"
opt-level = "z"
debug = 0
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "symbols"
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_methods = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

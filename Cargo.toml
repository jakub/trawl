[workspace]
members = ["crates/*"]
default-members = ["crates/fleet-cli", "crates/fleet-admin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# internal crates
fleet-core = { path = "crates/fleet-core" }
fleet-engine = { path = "crates/fleet-engine" }
fleet-auth = { path = "crates/fleet-auth" }
fleet-server = { path = "crates/fleet-server" }
fleet-client = { path = "crates/fleet-client" }

# external deps
chumsky = "0.12"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
duckdb = { version = "1.4", features = ["bundled"] }
insta = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

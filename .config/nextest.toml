# Postgres admission: ONE group, one width (ADR-0021 ruling 4).

[test-groups.postgres]
max-threads = 8

[[profile.default.overrides]]
# Each startup_pg test holds two 8-connection pools, the sole-writer session,
# two 1-connection fixture pools, and the competing writer's lock session:
# 20 connections, which is two slots of WORST_TEST_CONNECTION_CEILING (10).
filter = 'package(trawl-server) & binary(startup_pg)'
threads-required = 2

[[profile.default.overrides]]
# Of trawl-server's library tests, only the listed Postgres modules belong
# here: the others open no connection. A pool-constructing case in an
# otherwise pure module moves to a sibling `pg_tests` module.
filter = '''
  (package(trawl-server) & kind(lib)
    & (test(/^from_saved::/) | test(/^scheduler::/)
      | test(/^store::catalog::pg_tests::/) | test(/^store::history::tests::/)
      | test(/^store::pooled::pg_tests::/) | test(/^store::investigations::pg_tests::/)
      | test(/^store::pg_tests::/)
      | test(/^investigations::step::pg_tests::/)
      | test(/^ingest::compaction::pg_tests::/) | test(/^results::charge::tests::/)
      | test(/^results::service::pg_tests::/)))
  | (package(trawl-server) & (binary(auth_pg) | binary(boot_corpus) | binary(catalog_surface)
    | binary(capacity_metrics) | binary(connection_budget) | binary(dashboard_storage) | binary(dsl_admission) | binary(field_catalog)
    | binary(gc_pins) | binary(hot_query) | binary(http_api)
    | binary(ingest_publication) | binary(repin) | binary(store_pg) | binary(schema_pg) | binary(startup_pg)
    | binary(scheduler_windows) | binary(span_context) | binary(http_failure) | binary(timestamp_repair) | binary(unavailable_run_result)
    | binary(admission_stall) | binary(ingest_admission) | binary(ingest_repair_logging) | binary(restart_overhang) | binary(query_timing_roundtrip) | binary(query_histogram)
    | binary(results_store_pg) | binary(investigations_store_pg) | binary(/^investigations_(api|attach|evidence|retention)$/) | binary(results_sweep) | binary(results_capture) | binary(results_read)
    | binary(results_cap) | binary(results_stable) | binary(results_lifecycle) | binary(results_admission) | binary(results_abort)
    | binary(results_context) | binary(results_sightings) | binary(results_compare)
    | binary(doctor_pg) | binary(trawld_doctor) | binary(ingest_preview)
    | binary(ingest_preview_stores_nothing) | binary(request_limit) | binary(query_resources) | binary(stream_caps) | binary(stream_typed) | binary(typed_results) | binary(run_parquet_types)
    | binary(listener_timeouts) | binary(capabilities) | binary(multi_service_source)
    | binary(retained_event_redaction) | binary(retained_event_debug)))
  | (package(fleet-auth) & kind(test))
  | (package(fleet-auth) & kind(lib) & test(/^store::pg_tests::/))
  | (package(fleet-admin) & kind(test))
  | (package(trawl-cli) & (binary(preview_ingest) | binary(client_zone) | binary(cli_terminal_sinks) | binary(query_advice) | binary(tui_terminal_sinks) | binary(/^mcp_(conformance|investigation)$/)))
'''
test-group = 'postgres'
# A hung pg test must become a NAMED failure before anything upstream (the
# soak runner's heartbeat, a CI job timeout) kills the process without a
# log line. The heaviest repin tests run ~55s in a loaded CI.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# Both tests assert wall-clock windows (executor reclaim via TEST_QUERY_DELAY_MS;
# token-bucket 429 timing) and flake only when the machine is saturated (e.g.
# both pre-push suites running).
filter = 'test(pool_executor_reclaimed_after_timeout) | test(rate_limit_returns_429)'
retries = 1
